<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
     shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="global_status_clip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#c8d0dc"/>
    </linearGradient>
    <linearGradient id="global_status_tab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8c2d0"/>
      <stop offset="100%" stop-color="#8a96a8"/>
    </linearGradient>
  </defs>

  <!-- Clipboard body -->
  <rect x="17" y="18" width="30" height="34" rx="3.5" fill="url(#global_status_clip)"
        stroke="#6b788c" stroke-width="1.5"/>
  <!-- Top clip -->
  <rect x="25" y="13" width="14" height="9" rx="2.5" fill="url(#global_status_tab)"
        stroke="#5c6878" stroke-width="1.25"/>
  <rect x="29" y="15.5" width="6" height="3" rx="1" fill="#eef1f5" opacity="0.85"/>

  <!-- Aggregated status rows -->
  <circle cx="24" cy="30" r="2.2" fill="#5c7cfa"/>
  <line x1="29" y1="30" x2="41" y2="30" stroke="#5c7cfa" stroke-width="2.25"
        stroke-linecap="round"/>
  <circle cx="24" cy="38" r="2.2" fill="#d4a017"/>
  <line x1="29" y1="38" x2="37" y2="38" stroke="#8896a8" stroke-width="2.25"
        stroke-linecap="round"/>
  <circle cx="24" cy="46" r="2.2" fill="#8896a8"/>
  <line x1="29" y1="46" x2="39" y2="46" stroke="#8896a8" stroke-width="2.25"
        stroke-linecap="round"/>
</svg>
