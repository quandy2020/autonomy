<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 24 464 464" role="img" aria-label="Aviz">
  <defs>
    <linearGradient id="cardBg" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#d8eef7"/>
      <stop offset="45%" stop-color="#b8dff0"/>
      <stop offset="100%" stop-color="#98cfe6"/>
    </linearGradient>

    <linearGradient id="cardHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="robotHead" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#eafff4"/>
      <stop offset="42%" stop-color="#9ce1c9"/>
      <stop offset="100%" stop-color="#12794a"/>
    </radialGradient>

    <linearGradient id="robotBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b8f0d8"/>
      <stop offset="100%" stop-color="#5fbf98"/>
    </linearGradient>

    <linearGradient id="robotEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8f5e0"/>
      <stop offset="100%" stop-color="#6ec9a3"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6aa8c4" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.45"/>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="eyeGlow" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle card (icon body) -->
  <g filter="url(#cardShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" ry="92" fill="url(#cardBg)"/>
    <rect x="56" y="56" width="400" height="400" rx="92" ry="92" fill="url(#cardHighlight)"/>
  </g>

  <!-- HUD / targeting reticle -->
  <g transform="translate(256 248)" fill="none" stroke="#f6fefd" stroke-linecap="round" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="132" stroke-width="2.2" opacity="0.95"/>
    <circle cx="0" cy="0" r="108" stroke-width="1.6" opacity="0.75"/>
    <circle cx="0" cy="0" r="86" stroke-width="1.4" opacity="0.55" stroke-dasharray="10 8 4 8"/>

    <line x1="-148" y1="0" x2="148" y2="0" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="-148" x2="0" y2="148" stroke-width="1.2" opacity="0.7"/>

    <path d="M -52 -18 A 56 56 0 0 1 52 -18" stroke-width="1.2" opacity="0.65"/>
    <path d="M -38 28 A 44 44 0 0 0 38 28" stroke-width="1.1" opacity="0.55"/>
    <path d="M -62 8 A 64 64 0 0 0 -28 46" stroke-width="1" opacity="0.45"/>
    <path d="M 62 8 A 64 64 0 0 1 28 46" stroke-width="1" opacity="0.45"/>

    <g filter="url(#nodeGlow)">
      <circle cx="0" cy="-132" r="5.5" fill="#ffffff" stroke="none"/>
      <circle cx="132" cy="0" r="5.5" fill="#ffffff" stroke="none"/>
      <circle cx="0" cy="132" r="5.5" fill="#ffffff" stroke="none"/>
      <circle cx="-132" cy="0" r="5.5" fill="#ffffff" stroke="none"/>
    </g>
  </g>

  <!-- Robot -->
  <path d="M 168 292
           C 188 268, 210 258, 256 258
           C 302 258, 324 268, 344 292
           C 334 318, 310 332, 256 332
           C 202 332, 178 318, 168 292 Z"
        fill="url(#robotBody)"/>

  <rect x="236" y="268" width="40" height="22" rx="10" fill="url(#robotBody)"/>

  <ellipse cx="178" cy="214" rx="22" ry="26" fill="url(#robotEar)"/>
  <ellipse cx="334" cy="214" rx="22" ry="26" fill="url(#robotEar)"/>

  <circle cx="256" cy="208" r="72" fill="url(#robotHead)"/>

  <path d="M 214 228 Q 256 242, 298 228" fill="none" stroke="#7ec8a8" stroke-width="2" opacity="0.35"/>

  <g filter="url(#eyeGlow)">
    <rect x="224" y="200" width="28" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="260" y="200" width="28" height="7" rx="3.5" fill="#ffffff"/>
  </g>
</svg>
