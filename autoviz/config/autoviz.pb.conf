# autoviz 文本格式配置（与 autoviz_conf.proto 对应）
# 加载方式：autolink::common::LoadConfig(relative_path, ...)
# 解析路径：AUTOLINK_CONF_PATH（可多目录，冒号分隔）、当前工作目录、或绝对路径

foxglove {
  host: "0.0.0.0"
  port: 8765
  session_id: "autoviz"
  use_compression: false
  use_ros2_type_name: true
  send_buffer_limit_bytes: 10000000
}

autolink {
  topic_whitelist: ".*"
  min_update_period_ms: 100.0
  max_update_period_ms: 5000.0
}

mcap {
  enabled: true
  output_path: "autoviz.mcap"
  flush_on_write: false
}
