foxglove:
  # WebSocket 监听地址与端口（Foxglove Studio 连接 ws://host:port）
  host: "0.0.0.0"
  port: 8765

  # 会话与能力
  session_id: "autoviz"
  capabilities:
    - "clientPublish"
    - "connectionGraph"
    - "parametersSubscribe"
    - "parameters"
    - "assets"
  supported_encodings:
    - "protobuf"

  # 发送缓冲限制（字节）
  send_buffer_limit_bytes: 10000000

  # 压缩与 TLS（当前默认关闭）
  use_compression: false
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

autolink:
  # autolink channel 白名单（正则）
  topic_whitelist:
    - ".*"

  # 拓扑更新周期（毫秒）
  min_update_period_ms: 100.0
  max_update_period_ms: 5000.0
