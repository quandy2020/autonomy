// autoviz 运行配置（文本 proto，由 autolink::common::LoadConfig + AUTOLINK_CONF_PATH 解析）
syntax = "proto2";

package autoviz.conf;

message FoxgloveTls {
  optional bool enabled = 1 [default = false];
  optional string cert_file = 2;
  optional string key_file = 3;
}

message Foxglove {
  optional string host = 1 [default = "0.0.0.0"];
  optional int32 port = 2 [default = 8765];
  optional string session_id = 3 [default = "autoviz"];
  repeated string capabilities = 4;
  repeated string supported_encodings = 5;
  optional uint64 send_buffer_limit_bytes = 6 [default = 10000000];
  optional bool use_compression = 7 [default = false];
  optional bool use_ros2_type_name = 8 [default = true];
  optional FoxgloveTls tls = 9;
}

message Autolink {
  repeated string topic_whitelist = 1;
  optional double min_update_period_ms = 2 [default = 100.0];
  optional double max_update_period_ms = 3 [default = 5000.0];
}

message Mcap {
  optional bool enabled = 1 [default = true];
  optional string output_path = 2 [default = "autoviz.mcap"];
  optional bool flush_on_write = 3 [default = false];
}

message AutovizConf {
  optional Foxglove foxglove = 1;
  optional Autolink autolink = 2;
  optional Mcap mcap = 3;
}
