syntax = "proto3";

package automsgs.custom_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/custom_msgs/foo.proto";
import "automsgs/custom_msgs/bar.proto";

message Baz {
  Foo foo = 1;
  Bar bar = 2;
}

message BazStamped {
  automsgs.msgs.std_msgs.Header header = 1;
  Baz baz = 2;
}
