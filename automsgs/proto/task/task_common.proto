syntax = "proto3";

package autonomy.task.proto;

import "automsgs/msgs/builtin_interfaces/time.proto";
import "automsgs/msgs/builtin_interfaces/duration.proto";
import "automsgs/msgs/status_msgs/status_msgs.proto";
import "automsgs/msgs/vehicle_msgs/robot_task_status.proto";
import "automsgs/msgs/vehicle_msgs/robot_task_type.proto";

// Internal task envelope (lighter than bridge RequestHeader).
message TaskHeader {
  automsgs.msgs.builtin_interfaces.Time stamp = 1;
  string task_id = 2;
  string client_id = 3;
  automsgs.msgs.vehicle_msgs.RobotTaskType task_type = 4;
}

message TaskResult {
  automsgs.msgs.vehicle_msgs.RobotTaskStatus status = 1;
  automsgs.msgs.status_msgs.StatusCode error_code = 2;
  string message = 3;
}

message TaskProgress {
  float progress = 1;  // [0, 1]
  string detail = 2;
}

// Plugin selection shared by navigation / tracking tasks.
message NavigationPluginOptions {
  string planner_id = 1;
  string controller_id = 2;
  string goal_checker_id = 3;
  string behavior_tree = 4;
}
