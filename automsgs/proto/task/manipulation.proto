syntax = "proto3";

package autonomy.task.proto;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/moveit_msgs/motion_plan.proto";
import "automsgs/msgs/moveit_msgs/robot_trajectory.proto";
import "automsgs/task/common.proto";

// manipulation — arm plan / execute (MoveIt move_group goals).

message ManipulationAction {
  message Goal {
    string id = 1;
    Cmd cmd = 2;
    string group = 3;
    string planner = 4;
    repeated double joint_positions = 5;
    repeated string joint_names = 6;
    automsgs.msgs.geometry_msgs.PoseStamped pose = 7;
    bool execute = 8;
    string capability = 9;
    // Prefer this when set (overrides joint_positions / pose / planner fields).
    automsgs.msgs.moveit_msgs.MotionPlanRequest motion_plan = 10;
    // If true, preempt an in-flight trajectory before executing.
    bool replace_execution = 11;
  }
  message Feedback {
    Status status = 1;
    float progress = 2;
  }
  message Result {
    Status status = 1;
    string error = 2;
    int32 error_code = 3;
    automsgs.msgs.moveit_msgs.RobotTrajectory trajectory = 4;
  }
}
