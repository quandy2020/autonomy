syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/control_msgs/motion_argument.proto";
import "automsgs/msgs/geometry_msgs/pose_stamped.proto";

// One motion primitive (PTP / LIN / CIRC, plus vendor-specific arguments).
// ROS int8 constants: UNKNOWN=-1, LINEAR_JOINT=0, LINEAR_CARTESIAN=50, CIRCULAR_CARTESIAN=51.
// Proto3 default of `type` is LINEAR_JOINT (0); use UNKNOWN for an unset primitive.
message MotionPrimitive {
  enum Type {
    LINEAR_JOINT = 0;          // Often referred as PTP
    LINEAR_CARTESIAN = 50;     // Often referred as LIN
    CIRCULAR_CARTESIAN = 51;   // Often referred as CIRC
    UNKNOWN = -1;
  }

  Type type = 1;
  double blend_radius = 2;
  // Vendor-specific arguments, e.g. (max) velocity / acceleration / efficiency.
  repeated MotionArgument additional_arguments = 3;
  // Cartesian targets; circular motions may include via + goal.
  repeated automsgs.msgs.geometry_msgs.PoseStamped poses = 4;
  repeated double joint_positions = 5;
}
