syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/builtin_interfaces/duration.proto";
import "automsgs/msgs/std_msgs/header.proto";

// PID controller internal state.
message PidState {
  automsgs.msgs.std_msgs.Header header = 1;
  automsgs.msgs.builtin_interfaces.Duration timestep = 2;

  // error = target - state
  double error = 3;
  double error_dot = 4;

  double p_error = 5;
  double i_error = 6;
  double d_error = 7;

  double p_term = 8;
  double i_term = 9;
  double d_term = 10;
  double i_max = 11;
  double i_min = 12;

  double output = 13;
}
