syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/control_msgs/interface_value.proto";
import "automsgs/msgs/std_msgs/header.proto";

// Per-joint interface names and values (dynamic joint state).
message DynamicJointState {
  automsgs.msgs.std_msgs.Header header = 1;
  // Resource names, e.g. ["arm_joint_1", "arm_joint_2", "gripper_joint"].
  repeated string joint_names = 2;
  // Interfaces and values for each joint listed in `joint_names`.
  repeated InterfaceValue interface_values = 3;
}
