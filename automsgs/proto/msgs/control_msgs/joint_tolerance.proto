syntax = "proto3";

package automsgs.msgs.control_msgs;

// Allowed deviation from setpoints. Special values:
//  0  - unspecified, keep the default
// -1  - erased, unrestricted motion
message JointTolerance {
  string name = 1;
  // Radians or meters.
  double position = 2;
  // rad/s or m/s.
  double velocity = 3;
  // rad/s^2 or m/s^2.
  double acceleration = 4;
}
