syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/std_msgs/header.proto";

// Current controller state of one joint.
// Deprecated as of Humble in favor of SingleDOFStateStamped.
message JointControllerState {
  automsgs.msgs.std_msgs.Header header = 1;
  double set_point = 2;
  double process_value = 3;
  double process_value_dot = 4;
  double error = 5;
  double time_step = 6;
  double command = 7;
  double p = 8;
  double i = 9;
  double d = 10;
  double i_clamp = 11;
  bool antiwindup = 12;
}
