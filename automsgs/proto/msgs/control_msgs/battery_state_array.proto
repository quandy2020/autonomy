syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/sensor_msgs/battery_state.proto";

// Publishes values for multiple batteries at once.
message BatteryStateArray {
  repeated automsgs.msgs.sensor_msgs.BatteryState battery_states = 1;
}
