syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/geometry_msgs/twist.proto";
import "automsgs/msgs/std_msgs/header.proto";

// State of a mecanum-drive controller.
message MecanumDriveControllerState {
  automsgs.msgs.std_msgs.Header header = 1;
  double front_left_wheel_velocity = 2;
  double back_left_wheel_velocity = 3;
  double back_right_wheel_velocity = 4;
  double front_right_wheel_velocity = 5;
  automsgs.msgs.geometry_msgs.Twist reference_velocity = 6;
}
