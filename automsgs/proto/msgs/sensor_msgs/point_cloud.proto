syntax = "proto3";

package automsgs.msgs.sensor_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point32.proto";
import "automsgs/msgs/sensor_msgs/channel_float32.proto";

// Deprecated in favor of PointCloud2. Holds a collection of 3D points
// plus optional per-point channels.
message PointCloud {
  // Time of sensor data acquisition, coordinate frame ID.
  automsgs.msgs.std_msgs.Header header = 1;

  // 3D points in the frame given by the header.
  repeated automsgs.msgs.geometry_msgs.Point32 points = 2;

  // Optional channels associated 1:1 with points.
  repeated ChannelFloat32 channels = 3;
}

