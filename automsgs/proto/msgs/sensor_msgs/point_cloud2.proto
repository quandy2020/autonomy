syntax = "proto3";

package automsgs.msgs.sensor_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/sensor_msgs/point_field.proto";

// 3D point cloud data.
message PointCloud2 {
  automsgs.msgs.std_msgs.Header header = 1;

  uint32 height = 2;
  uint32 width = 3;

  repeated PointField fields = 4;

  bool is_bigendian = 5;
  uint32 point_step = 6;
  uint32 row_step = 7;
  bytes data = 8;

  bool is_dense = 9;
}

