syntax = "proto3";

package automsgs.msgs.sensor_msgs;

// Region of interest within an image.
message RegionOfInterest {
  uint32 x_offset = 1;  // Leftmost pixel of the ROI
  uint32 y_offset = 2;  // Topmost pixel of the ROI
  uint32 height = 3;    // Height of ROI
  uint32 width = 4;     // Width of ROI

  // True if a distinct rectified ROI should be calculated from the raw ROI.
  bool do_rectify = 5;
}
