syntax = "proto3";

package automsgs.msgs.sensor_msgs;

import "automsgs/msgs/std_msgs/header.proto";

// Uncompressed image.
message Image {
  automsgs.msgs.std_msgs.Header header = 1;

  uint32 height = 2;  // rows
  uint32 width = 3;   // columns

  string encoding = 4;
  bool is_bigendian = 5;
  uint32 step = 6;    // bytes per row

  bytes data = 7;     // raw image data
}

