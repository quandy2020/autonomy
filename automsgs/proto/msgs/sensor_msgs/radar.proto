syntax = "proto3";

package automsgs.msgs.sensor_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/unique_identifier_msgs/uuid.proto";

// FMCW radar track relative to the radar frame.
// Not intended alone; use RadarTracks for stamped arrays.
message RadarTrack {
  // Object classifications. Vendor-specific values may start at 32000 (e.g. Car).
  enum Classification {
    NO_CLASSIFICATION = 0;
    STATIC = 1;
    DYNAMIC = 2;
  }

  // Unique object id from the radar.
  automsgs.msgs.unique_identifier_msgs.UUID uuid = 1;

  // Centroid; z ignored for 2D tracking.
  automsgs.msgs.geometry_msgs.Point position = 2;
  automsgs.msgs.geometry_msgs.Vector3 velocity = 3;
  automsgs.msgs.geometry_msgs.Vector3 acceleration = 4;
  // Size in the sensor frame (e.g. length/width/height).
  automsgs.msgs.geometry_msgs.Vector3 size = 5;

  // Optional class; prefer Classification values, vendors may use >= 32000.
  uint32 classification = 6;

  // Upper-triangle covariances about x, y, z (length 6 each).
  repeated float position_covariance = 7;
  repeated float velocity_covariance = 8;
  repeated float acceleration_covariance = 9;
  repeated float size_covariance = 10;
}

message RadarTracks {
  automsgs.msgs.std_msgs.Header header = 1;
  repeated RadarTrack tracks = 2;
}

// Single detection relative to the radar frame.
// Not intended alone; use RadarScan for stamped arrays.
message RadarReturn {
  // Distance (m) from the sensor to the detected return.
  float range = 1;
  // Azimuth (rad); positive anticlockwise per REP-0103.
  float azimuth = 2;
  // Elevation (rad); negative below sensor; 0 for 2D radar.
  float elevation = 3;
  // Doppler speed (m/s).
  float doppler_velocity = 4;
  // Amplitude (dB).
  float amplitude = 5;
}

message RadarScan {
  automsgs.msgs.std_msgs.Header header = 1;
  repeated RadarReturn returns = 2;
}
