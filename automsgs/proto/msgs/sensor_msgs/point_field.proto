syntax = "proto3";

package automsgs.msgs.sensor_msgs;

// Description of one field within a PointCloud2 point.
message PointField {
  enum DataType {
    DATA_TYPE_UNKNOWN = 0;
    INT8    = 1;
    UINT8   = 2;
    INT16   = 3;
    UINT16  = 4;
    INT32   = 5;
    UINT32  = 6;
    FLOAT32 = 7;
    FLOAT64 = 8;
  }

  string name = 1;
  uint32 offset = 2;
  DataType datatype = 3;
  uint32 count = 4;
}

