syntax = "proto3";

package automsgs.msgs.shape_msgs;

import "automsgs/msgs/geometry_msgs/polygon.proto";

// Defines primitive solid shapes.
message SolidPrimitive {
  // Primitive type.
  enum Type {
    TYPE_UNKNOWN = 0;
    BOX = 1;
    SPHERE = 2;
    CYLINDER = 3;
    CONE = 4;
    PRISM = 5;
  }

  Type type = 1;

  // Dimensions of the shape. At most 3 elements are used.
  repeated double dimensions = 2;

  // Polygon base used when type is PRISM.
  automsgs.msgs.geometry_msgs.Polygon polygon = 3;
}

