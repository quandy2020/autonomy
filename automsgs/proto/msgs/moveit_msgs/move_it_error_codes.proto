syntax = "proto3";

package automsgs.msgs.moveit_msgs;


// MoveIt-compatible error codes on the automsgs wire (MotionPlanResponse).
// Internal manipulation codes live in autonomy/manipulation/proto/error_codes.proto;
// map at the module boundary (motion_plan_message_conversion). Do not use as StatusCode.
message MoveItErrorCodes {
  enum Code {
    option allow_alias = true;
    CODE_UNSPECIFIED = 0;
    UNDEFINED = 0;
    SUCCESS = 1;
    FAILURE = 99999;
    PLANNING_FAILED = -1;
    INVALID_MOTION_PLAN = -2;
    MOTION_PLAN_INVALIDATED_BY_ENVIRONMENT_CHANGE = -3;
    CONTROL_FAILED = -4;
    UNABLE_TO_AQUIRE_SENSOR_DATA = -5;
    TIMED_OUT = -6;
    PREEMPTED = -7;
    START_STATE_IN_COLLISION = -10;
    START_STATE_VIOLATES_PATH_CONSTRAINTS = -11;
    GOAL_IN_COLLISION = -12;
    GOAL_VIOLATES_PATH_CONSTRAINTS = -13;
    GOAL_CONSTRAINTS_BADLY_DEFINED = -14;
    GOAL_CONSTRAINTS_VIOLATED = -14;
    INVALID_GROUP_NAME = -15;
    INVALID_GOAL_CONSTRAINTS = -16;
    INVALID_ROBOT_STATE = -17;
    INVALID_LINK_NAME = -18;
    INVALID_OBJECT_NAME = -19;
    FRAME_TRANSFORM_FAILURE = -21;
    COLLISION_CHECKING_UNAVAILABLE = -22;
    ROBOT_STATE_STALE = -23;
    SENSOR_INFO_STALE = -24;
    COMMUNICATION_FAILURE = -25;
    START_STATE_INVALID = -26;
    GOAL_STATE_INVALID = -27;
    UNRECOGNIZED_GOAL_TYPE = -28;
    CRASH = -29;
    ABORT = -30;
    NO_IK_SOLUTION = -31;
    INVALID_PLANNING_SCENE = -32;
  }
  Code val = 1;
  string message = 2;
  string source = 3;
}
