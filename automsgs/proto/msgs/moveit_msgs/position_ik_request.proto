syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/builtin_interfaces/duration.proto";
import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/moveit_msgs/constraints.proto";
import "automsgs/msgs/moveit_msgs/robot_state.proto";

message PositionIKRequest {
  string group_name = 1;
  RobotState robot_state = 2;
  Constraints constraints = 3;
  bool avoid_collisions = 4;
  string ik_link_name = 5;
  automsgs.msgs.geometry_msgs.PoseStamped pose_stamped = 6;
  repeated string ik_link_names = 7;
  repeated automsgs.msgs.geometry_msgs.PoseStamped pose_stamped_vector = 8;
  automsgs.msgs.builtin_interfaces.Duration timeout = 9;
}
