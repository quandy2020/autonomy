syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/std_msgs/header.proto";

message ContactInformation {
  enum BodyType {
    ROBOT_LINK = 0;
    WORLD_OBJECT = 1;
    ROBOT_ATTACHED = 2;
  }
  automsgs.msgs.std_msgs.Header header = 1;
  automsgs.msgs.geometry_msgs.Point position = 2;
  automsgs.msgs.geometry_msgs.Vector3 normal = 3;
  double depth = 4;
  string contact_body_1 = 5;
  uint32 body_type_1 = 6;
  string contact_body_2 = 7;
  uint32 body_type_2 = 8;
}
