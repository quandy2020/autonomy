syntax = "proto3";

package automsgs.msgs.moveit_msgs;


message PlanningSceneComponents {
  enum Component {
    COMPONENT_UNSPECIFIED = 0;
    SCENE_SETTINGS = 1;
    ROBOT_STATE = 2;
    ROBOT_STATE_ATTACHED_OBJECTS = 4;
    WORLD_OBJECT_NAMES = 8;
    WORLD_OBJECT_GEOMETRY = 16;
    OCTOMAP = 32;
    TRANSFORMS = 64;
    ALLOWED_COLLISION_MATRIX = 128;
    LINK_PADDING_AND_SCALING = 256;
    OBJECT_COLORS = 512;
  }
  uint32 components = 1;
}
