syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/moveit_msgs/attached_collision_object.proto";
import "automsgs/msgs/sensor_msgs/joint_state.proto";
import "automsgs/msgs/sensor_msgs/multi_dof_joint_state.proto";

message RobotState {
  automsgs.msgs.sensor_msgs.JointState joint_state = 1;
  automsgs.msgs.sensor_msgs.MultiDOFJointState multi_dof_joint_state = 2;
  repeated AttachedCollisionObject attached_collision_objects = 3;
  bool is_diff = 4;
}
