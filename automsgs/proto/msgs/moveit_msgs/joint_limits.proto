syntax = "proto3";

package automsgs.msgs.moveit_msgs;


// Position / velocity / acceleration / jerk limits for one joint.
// Fields 1-5 keep the existing automsgs layout; 6+ match ROS JointLimits extras.
message JointLimits {
  double min_position = 1;
  double max_position = 2;
  double max_velocity = 3;
  double max_acceleration = 4;
  bool has_position_limits = 5;
  string joint_name = 6;
  bool has_velocity_limits = 7;
  bool has_acceleration_limits = 8;
  bool has_jerk_limits = 9;
  double max_jerk = 10;
}
