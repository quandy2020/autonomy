syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/quaternion.proto";
import "automsgs/msgs/std_msgs/header.proto";

// Orientation constraint.
// Fields 1-4 keep the existing automsgs layout used by constraint_samplers;
// 5+ match ROS OrientationConstraint extras.
message OrientationConstraint {
  enum Parameterization {
    XYZ_EULER_ANGLES = 0;
    ROTATION_VECTOR = 1;
  }
  string link_name = 1;
  automsgs.msgs.geometry_msgs.PoseStamped target = 2;
  double tolerance = 3;
  double weight = 4;
  automsgs.msgs.std_msgs.Header header = 5;
  automsgs.msgs.geometry_msgs.Quaternion orientation = 6;
  double absolute_x_axis_tolerance = 7;
  double absolute_y_axis_tolerance = 8;
  double absolute_z_axis_tolerance = 9;
  Parameterization parameterization = 10;
}
