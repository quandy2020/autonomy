syntax = "proto3";

package automsgs.msgs.strata_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";

message Robot3DLayer {
    std_msgs.Header header = 1;
    string id = 2;
    string robot_id = 3;
    string model_url = 4;
    double scale = 5;
    geometry_msgs.Point offset = 6;
    double rotation_deg = 7;
    geometry_msgs.Point position = 8;
    double heading_deg = 9;
    string status = 10;
    bool visible = 11;
    double rotate_x = 12;
    double rotate_y = 13;
    double rotate_z = 14;
    double meters_scale = 15;
    string default_animation = 16;
}

message Robot3DLayerArray {
    std_msgs.Header header = 1;
    repeated Robot3DLayer layers = 2;
}
