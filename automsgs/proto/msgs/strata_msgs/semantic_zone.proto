syntax = "proto3";

package automsgs.msgs.strata_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/std_msgs/color_rgba.proto";

message SemanticZone {
    std_msgs.Header header = 1;
    string id = 2;
    string zone_type = 3;
    repeated geometry_msgs.Point polygon = 4;
    std_msgs.ColorRGBA fill_color = 5;
    float fill_opacity = 6;
    std_msgs.ColorRGBA outline_color = 7;
    float outline_width = 8;
    string label = 9;
}

message SemanticZoneArray {
    std_msgs.Header header = 1;
    repeated SemanticZone zones = 2;
}
