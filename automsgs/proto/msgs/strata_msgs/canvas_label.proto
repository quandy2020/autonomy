syntax = "proto3";

package automsgs.msgs.strata_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/std_msgs/color_rgba.proto";

message CanvasLabelStyle {
    string font = 1;
    std_msgs.ColorRGBA text_color = 2;
    std_msgs.ColorRGBA halo_color = 3;
    float halo_blur = 4;
    int32 padding = 5;
}

message CanvasLabel {
    std_msgs.Header header = 1;
    string id = 2;
    geometry_msgs.Point position = 3;
    string label = 4;
    bool visible = 5;
}

message CanvasLabelArray {
    std_msgs.Header header = 1;
    repeated CanvasLabel labels = 2;
    CanvasLabelStyle style = 3;
}
