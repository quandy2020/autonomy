syntax = "proto3";

package automsgs.msgs.strata_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";

message RobotMarker {
    std_msgs.Header header = 1;
    string id = 2;
    geometry_msgs.Point lng_lat = 3;
    double rotation_deg = 4;
    string name = 5;
    string status = 6;
    float battery = 7;
}

message RobotMarkerArray {
    std_msgs.Header header = 1;
    repeated RobotMarker robots = 2;
}
