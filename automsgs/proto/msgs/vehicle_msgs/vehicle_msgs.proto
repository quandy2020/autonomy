syntax = "proto3";

package automsgs.msgs.vehicle_msgs;

import "automsgs/msgs/builtin_interfaces/time.proto";
import "automsgs/msgs/status_msgs/status_msgs.proto";
import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/twist_stamped.proto";
import "automsgs/msgs/std_msgs/header.proto";

// 与 bridge.proto TaskType 数值对齐，供状态流与 Command RPC 共用
enum RobotTaskType {
  ROBOT_TASK_NONE = 0;
  ROBOT_TASK_NAVIGATION = 1;
  ROBOT_TASK_FOLLOW = 2;
  ROBOT_TASK_TELEOP = 3;
  ROBOT_TASK_EXPLORATION = 4;
  ROBOT_TASK_DOCK = 5;
  ROBOT_TASK_MAP = 6;
}

enum RobotTaskStatus {
  ROBOT_TASK_STATUS_UNKNOWN = 0;
  ROBOT_TASK_STATUS_IDLE = 1;
  ROBOT_TASK_STATUS_RUNNING = 2;
  ROBOT_TASK_STATUS_PAUSED = 3;
  ROBOT_TASK_STATUS_SUCCEEDED = 4;
  ROBOT_TASK_STATUS_FAILED = 5;
  ROBOT_TASK_STATUS_CANCELED = 6;
}

enum RobotEventType {
  ROBOT_EVENT_UNKNOWN = 0;
  ROBOT_EVENT_TASK_STARTED = 1;
  ROBOT_EVENT_TASK_COMPLETED = 2;
  ROBOT_EVENT_TASK_FAILED = 3;
  ROBOT_EVENT_TASK_CANCELED = 4;
  ROBOT_EVENT_FAULT = 5;
  ROBOT_EVENT_BATTERY_LOW = 6;
  ROBOT_EVENT_DOCK_COMPLETED = 7;
  ROBOT_EVENT_MAP_CHANGED = 8;
  ROBOT_EVENT_EMERGENCY_STOP = 9;
}

enum EventSeverity {
  EVENT_SEVERITY_INFO = 0;
  EVENT_SEVERITY_WARNING = 1;
  EVENT_SEVERITY_ERROR = 2;
}

// 周期推送的机器人快照（ReceiveBotStates / GetRobotSnapshot）
message RobotState {
  automsgs.msgs.builtin_interfaces.Time timestamp = 1;
  automsgs.msgs.geometry_msgs.PoseStamped pose = 2;
  automsgs.msgs.geometry_msgs.TwistStamped twist = 3;
  float battery_percent = 4;
  string map_name = 5;
  string global_frame = 6;
  RobotTaskType active_task_type = 7;
  RobotTaskStatus active_task_status = 8;
  string active_cmd_id = 9;
  bool motion_enabled = 10;
  bool is_docked = 11;
  bool is_charging = 12;
  float localization_quality = 13;  // [0, 1]，定位质量估计
}

// 事件推送（ReceiveBotEvents）
message RobotEvent {
  automsgs.msgs.builtin_interfaces.Time timestamp = 1;
  RobotEventType type = 2;
  EventSeverity severity = 3;
  RobotTaskType task_type = 4;
  string cmd_id = 5;
  string message = 6;
  automsgs.msgs.status_msgs.StatusCode error_code = 7;
}
