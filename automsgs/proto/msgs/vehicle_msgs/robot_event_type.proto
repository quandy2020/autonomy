  ROBOT_EVENT_TASK_STARTED = 1;
  ROBOT_EVENT_TASK_COMPLETED = 2;
  ROBOT_EVENT_TASK_FAILED = 3;
  ROBOT_EVENT_TASK_CANCELED = 4;
  ROBOT_EVENT_FAULT = 5;
