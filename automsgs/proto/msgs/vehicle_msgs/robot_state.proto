syntax = "proto3";

package automsgs.msgs.vehicle_msgs;

import "automsgs/msgs/builtin_interfaces/time.proto";
import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/twist_stamped.proto";
import "automsgs/msgs/vehicle_msgs/robot_task_status.proto";
import "automsgs/msgs/vehicle_msgs/robot_task_type.proto";

// 周期推送的机器人快照（ReceiveBotStates / GetRobotSnapshot）
message RobotState {
  automsgs.msgs.builtin_interfaces.Time timestamp = 1;
  automsgs.msgs.geometry_msgs.PoseStamped pose = 2;
  automsgs.msgs.geometry_msgs.TwistStamped twist = 3;
  float battery_percent = 4;
  string map_name = 5;
  string global_frame = 6;
  RobotTaskType active_task_type = 7;
  RobotTaskStatus active_task_status = 8;
  string active_cmd_id = 9;
  bool motion_enabled = 10;
  bool is_docked = 11;
  bool is_charging = 12;
  float localization_quality = 13;  // [0, 1]，定位质量估计
}
