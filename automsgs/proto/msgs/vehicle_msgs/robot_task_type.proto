syntax = "proto3";

package automsgs.msgs.vehicle_msgs;

// 与 bridge.proto TaskType 数值对齐，供状态流与 Command RPC 共用
enum RobotTaskType {
  ROBOT_TASK_NONE = 0;
  ROBOT_TASK_NAVIGATION = 1;
  ROBOT_TASK_FOLLOW = 2;
  ROBOT_TASK_TELEOP = 3;
  ROBOT_TASK_EXPLORATION = 4;
  ROBOT_TASK_DOCK = 5;
  ROBOT_TASK_MAP = 6;
}
