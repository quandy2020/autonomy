syntax = "proto3";

package automsgs.msgs.action_msgs;

import "automsgs/msgs/action_msgs/goal_info.proto";

// Action goal state after acceptance by an action server.
// See http://design.ros2.org/articles/actions.html
message GoalStatus {
  enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_ACCEPTED = 1;
    STATUS_EXECUTING = 2;
    STATUS_CANCELING = 3;
    STATUS_SUCCEEDED = 4;
    STATUS_CANCELED = 5;
    STATUS_ABORTED = 6;
  }

  // Goal info (contains ID and timestamp).
  GoalInfo goal_info = 1;

  // Action goal state-machine status.
  Status status = 2;
}
