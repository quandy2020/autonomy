syntax = "proto3";

package automsgs.msgs.std_msgs;

import "automsgs/msgs/std_msgs/multi_array_dimension.proto";

// Multi-dimensional array layout.
message MultiArrayLayout {
  repeated MultiArrayDimension dim = 1; // dimension properties
  uint32 data_offset = 2;               // padding bytes at front of data
}
