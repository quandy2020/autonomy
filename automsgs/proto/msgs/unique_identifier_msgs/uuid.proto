syntax = "proto3";

package automsgs.msgs.unique_identifier_msgs;

// A universally unique identifier (UUID).
// http://en.wikipedia.org/wiki/Universally_unique_identifier
// http://tools.ietf.org/html/rfc4122.html
message UUID {
  // 16-byte UUID payload (unique_identifier_msgs/UUID.uuid).
  bytes uuid = 1;
}
