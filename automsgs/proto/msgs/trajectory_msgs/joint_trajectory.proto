syntax = "proto3";

package automsgs.msgs.trajectory_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/trajectory_msgs/joint_trajectory_point.proto";

// Joint trajectory for a set of joints.
message JointTrajectory {
  // Coordinate frame and reference time for durations.
  automsgs.msgs.std_msgs.Header header = 1;

  // Names of the active joints, ordered as in the points below.
  repeated string joint_names = 2;

  // Trajectory points along the path.
  repeated JointTrajectoryPoint points = 3;
}

