syntax = "proto3";

package automsgs.msgs.trajectory_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/trajectory_msgs/multi_dof_joint_trajectory_point.proto";

// Multi-DOF joint trajectory (each point is a transform).
message MultiDOFJointTrajectory {
  automsgs.msgs.std_msgs.Header header = 1;

  // Names of the joints, ordered as in each point.
  repeated string joint_names = 2;

  // Points along the trajectory.
  repeated MultiDOFJointTrajectoryPoint points = 3;
}

