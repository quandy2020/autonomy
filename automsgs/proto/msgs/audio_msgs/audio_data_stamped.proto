syntax = "proto3";

package automsgs.msgs.audio_msgs;

import "automsgs/msgs/audio_msgs/audio_info.proto";
import "automsgs/msgs/std_msgs/header.proto";

// Generic interleaved PCM chunk for transport / visualization / recording.
// Prefer this over Image-as-PCM bags for new publishers.
message AudioDataStamped {
  automsgs.msgs.std_msgs.Header header = 1;
  AudioInfo info = 2;
  // Interleaved PCM bytes matching info.channels / sample_format / sample_rate.
  bytes data = 3;
}
