syntax = "proto3";

package automsgs.msgs.map_msgs;

import "automsgs/msgs/map_msgs/grid_map_info.proto";
import "automsgs/msgs/std_msgs/float32_multi_array.proto";

message GridMap {
  GridMapInfo info = 1;
  repeated string layers = 2;
  repeated string basic_layers = 3;
  repeated automsgs.msgs.std_msgs.Float32MultiArray data = 4;
  uint32 outer_start_index = 5;
  uint32 inner_start_index = 6;
}
