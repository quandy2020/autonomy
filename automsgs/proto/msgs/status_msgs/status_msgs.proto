// Generic status wrapper (aligned with apollo.common.StatusPb).
// Shares StatusCode with automsgs.rpcs.common.Status (RPC uses field names
// code / message; this type keeps error_code / msg for internal msgs).
message StatusPb {
  StatusCode error_code = 1;
  string msg = 2;
}
