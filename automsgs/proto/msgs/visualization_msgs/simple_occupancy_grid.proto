syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";

// Planar occupancy grid: plane coefficients + occupied cell centers.
message SimpleOccupancyGrid {
  // Frame of @c cells.
  automsgs.msgs.std_msgs.Header header = 1;
  // Plane coefficients [a, b, c, d] for ax + by + cz + d = 0 (length 4).
  repeated float coefficients = 2;
  // Cell size / spacing in meters.
  float resolution = 3;
  // Occupied cell centers projected onto the plane.
  repeated automsgs.msgs.geometry_msgs.Point cells = 4;
}
