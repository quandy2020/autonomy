syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/color_rgba.proto";

// 2D HUD menu overlay with a highlighted selection index.
message OverlayMenu {
  // Menu interaction action.
  enum Action {
    ACTION_SELECT = 0;  // Keep the menu open / update selection.
    ACTION_CLOSE = 1;   // Close / dismiss the menu.
  }

  Action action = 1;
  // Zero-based index of the highlighted menu entry.
  uint32 current_index = 2;
  // Ordered menu entry labels.
  repeated string menus = 3;
  // Optional title shown above the menu entries.
  string title = 4;
  // Background color.
  automsgs.msgs.std_msgs.ColorRGBA bg_color = 5;
  // Foreground / text color.
  automsgs.msgs.std_msgs.ColorRGBA fg_color = 6;
}
