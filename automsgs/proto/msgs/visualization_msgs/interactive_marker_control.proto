syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/geometry_msgs/quaternion.proto";
import "automsgs/msgs/visualization_msgs/marker.proto";

// Control for an interactive marker.
message InteractiveMarkerControl {
  string name = 1;
  automsgs.msgs.geometry_msgs.Quaternion orientation = 2;

  enum OrientationMode {
    INHERIT = 0;
    FIXED = 1;
    VIEW_FACING = 2;
  }

  OrientationMode orientation_mode = 3;

  enum InteractionMode {
    NONE = 0;
    MENU = 1;
    BUTTON = 2;
    MOVE_AXIS = 3;
    MOVE_PLANE = 4;
    ROTATE_AXIS = 5;
    MOVE_ROTATE = 6;
    MOVE_3D = 7;
    ROTATE_3D = 8;
    MOVE_ROTATE_3D = 9;
  }

  InteractionMode interaction_mode = 4;
  bool always_visible = 5;
  repeated Marker markers = 6;
  bool independent_marker_orientation = 7;
  string description = 8;
}
