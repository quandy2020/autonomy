syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/visualization_msgs/segment.proto";

// Human skeleton as named bones represented by 3D segments.
message HumanSkeleton {
  // Frame of the bone segments.
  automsgs.msgs.std_msgs.Header header = 1;
  // Bone names; index-aligned with @c bones when provided.
  repeated string bone_names = 2;
  // Bone geometry as start→end segments.
  repeated Segment bones = 3;
}
