syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/color_rgba.proto";

// 2D HUD text overlay drawn in screen / viewport coordinates.
message OverlayText {
  // Overlay lifecycle action.
  enum Action {
    ACTION_ADD = 0;     // Create or update the overlay.
    ACTION_DELETE = 1;  // Remove the overlay.
  }

  Action action = 1;
  // Overlay width in pixels.
  int32 width = 2;
  // Overlay height in pixels.
  int32 height = 3;
  // Left edge offset from the viewport origin (pixels).
  int32 left = 4;
  // Top edge offset from the viewport origin (pixels).
  int32 top = 5;
  // Background fill color (RGBA, typically with alpha).
  automsgs.msgs.std_msgs.ColorRGBA bg_color = 6;
  // Optional border / outline width in pixels.
  int32 line_width = 7;
  // Font size in points (or display units used by the renderer).
  float text_size = 8;
  // Font family name (empty → renderer default).
  string font = 9;
  // Foreground text color.
  automsgs.msgs.std_msgs.ColorRGBA fg_color = 10;
  // UTF-8 text content to render.
  string text = 11;
}
