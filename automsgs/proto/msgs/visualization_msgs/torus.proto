syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";

// Torus (ring) primitive: major / minor radii about a center pose.
message Torus {
  // Frame of @c pose.
  automsgs.msgs.std_msgs.Header header = 1;
  // @c true when estimation / detection failed (visualizers may hide or flag).
  bool failure = 2;
  // Center pose; torus lies in the local XY plane by convention.
  automsgs.msgs.geometry_msgs.Pose pose = 3;
  // Distance from center to tube centerline (meters).
  double large_radius = 4;
  // Tube (minor) radius (meters).
  double small_radius = 5;
}
