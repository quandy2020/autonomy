syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";

// Directional acoustic power spectrum (HARK-style ambient sound display).
// Each entry is typically one angular bin around the sensor.
message HarkPower {
  automsgs.msgs.std_msgs.Header header = 1;
  // Power values per direction bin (linear or dB; consumer-defined units).
  repeated float powers = 2;
}
