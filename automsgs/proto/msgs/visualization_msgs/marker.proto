syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/std_msgs/color_rgba.proto";
import "automsgs/msgs/builtin_interfaces/duration.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/sensor_msgs/compressed_image.proto";
import "automsgs/msgs/visualization_msgs/uv_coordinate.proto";
import "automsgs/msgs/visualization_msgs/mesh_file.proto";

// Generic visualization marker.
message Marker {
  // Marker types.
  enum Type {
    ARROW = 0;
    CUBE = 1;
    SPHERE = 2;
    CYLINDER = 3;
    LINE_STRIP = 4;
    LINE_LIST = 5;
    CUBE_LIST = 6;
    SPHERE_LIST = 7;
    POINTS = 8;
    TEXT_VIEW_FACING = 9;
    MESH_RESOURCE = 10;
    TRIANGLE_LIST = 11;
  }

  // Actions.
  enum Action {
    option allow_alias = true;
    ADD = 0;
    MODIFY = 0;
    DELETE = 2;
    DELETEALL = 3;
  }

  automsgs.msgs.std_msgs.Header header = 1;
  string ns = 2;
  int32 id = 3;
  Type type = 4;
  Action action = 5;

  automsgs.msgs.geometry_msgs.Pose pose = 6;
  automsgs.msgs.geometry_msgs.Vector3 scale = 7;
  automsgs.msgs.std_msgs.ColorRGBA color = 8;

  automsgs.msgs.builtin_interfaces.Duration lifetime = 9;
  bool frame_locked = 10;

  repeated automsgs.msgs.geometry_msgs.Point points = 11;
  repeated automsgs.msgs.std_msgs.ColorRGBA colors = 12;

  string texture_resource = 13;
  automsgs.msgs.sensor_msgs.CompressedImage texture = 14;
  repeated UVCoordinate uv_coordinates = 15;

  string text = 16;
  string mesh_resource = 17;
  MeshFile mesh_file = 18;
  bool mesh_use_embedded_materials = 19;
}
