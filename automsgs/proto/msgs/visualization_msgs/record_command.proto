syntax = "proto3";

package automsgs.msgs.visualization_msgs;

// Operator command to start / stop recording or play back a file.
message RecordCommand {
  // Recorder / player action.
  enum Command {
    PLAY = 0;    // Play @c file.
    RECORD = 1;  // Start recording to @c file.
    STOP = 2;    // Stop recording or playback.
  }

  Command command = 1;
  // Target file path (empty when unused by @c command).
  string file = 2;
}
