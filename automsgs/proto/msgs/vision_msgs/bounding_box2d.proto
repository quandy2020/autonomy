syntax = "proto3";

package automsgs.msgs.vision_msgs;

import "automsgs/msgs/vision_msgs/pose2d.proto";

// 2D bounding box that can be rotated about its center.
message BoundingBox2D {
  // 2D position and orientation of the bounding box center (pixels, radians).
  Pose2D center = 1;

  // Size of the bounding box (pixels) relative to the center pose.
  double size_x = 2;
  double size_y = 3;
}
