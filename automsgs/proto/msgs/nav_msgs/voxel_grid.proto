syntax = "proto3";

package automsgs.msgs.nav_msgs;

import "automsgs/msgs/geometry_msgs/point32.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/std_msgs/header.proto";

message VoxelGrid {
  automsgs.msgs.std_msgs.Header header = 1;
  repeated uint32 data = 2;
  automsgs.msgs.geometry_msgs.Point32 origin = 3;
  automsgs.msgs.geometry_msgs.Vector3 resolutions = 4;
  uint32 size_x = 5;
  uint32 size_y = 6;
  uint32 size_z = 7;
}
