syntax = "proto3";

package automsgs.msgs.nav_msgs;

import "automsgs/msgs/builtin_interfaces/time.proto";

message BehaviorTreeStatusChange {
  // Internal behavior tree event timestamp (typically wall clock).
  automsgs.msgs.builtin_interfaces.Time timestamp = 1;
  string node_name = 2;
  // IDLE, RUNNING, SUCCESS or FAILURE
  string previous_status = 3;
  string current_status = 4;
}

message BehaviorTreeLog {
  // ROS time that this log message was sent.
  automsgs.msgs.builtin_interfaces.Time timestamp = 1;
  repeated BehaviorTreeStatusChange event_log = 2;
}
