syntax = "proto3";

package automsgs.rpcs.mapping;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/map_msgs/map_meta_data.proto";
import "automsgs/msgs/map_msgs/occupancy_grid.proto";
import "automsgs/rpcs/common.proto";

// =============================================================================
// MapService
//
// Session (SLAM):
//   StartMapping / FinishMapping / CancelMapping / GetMappingStatus
// Storage:
//   ListMaps / GetMap / GetMapMetadata / SaveMap / DeleteMap / SetCurrentMap
//
// Prefer map_identifier; map_name is lookup alias when identifier empty.
// Busy → MAPPING_BUSY (1100).
// =============================================================================
service MapService {
  rpc StartMapping(StartMappingRequest) returns (automsgs.rpcs.common.Status);
  rpc FinishMapping(FinishMappingRequest) returns (FinishMappingResponse);
  rpc CancelMapping(CancelMappingRequest) returns (automsgs.rpcs.common.Status);
  rpc GetMappingStatus(GetMappingStatusRequest) returns (MappingStatus);

  rpc ListMaps(ListMapsRequest) returns (ListMapsResponse);
  rpc GetMap(GetMapRequest) returns (GetMapResponse);
  rpc GetMapMetadata(GetMapMetadataRequest) returns (GetMapMetadataResponse);
  rpc SaveMap(SaveMapRequest) returns (SaveMapResponse);
  rpc DeleteMap(DeleteMapRequest) returns (automsgs.rpcs.common.Status);
  rpc SetCurrentMap(SetCurrentMapRequest) returns (automsgs.rpcs.common.Status);
}

enum MappingState {
  MAPPING_STATE_UNKNOWN = 0;
  MAPPING_STATE_IDLE = 1;
  MAPPING_STATE_MAPPING = 2;
  MAPPING_STATE_SAVING = 3;
  MAPPING_STATE_FAILED = 4;
  MAPPING_STATE_CANCELLED = 5;
}

// ---------------------------------------------------------------------------
// Session
// ---------------------------------------------------------------------------

message StartMappingRequest {
  automsgs.msgs.std_msgs.Header header = 1;
  string map_name = 2;
  // Optional client-defined id (echoed in MappingStatus.goal_id).
  string goal_id = 3;
}

message FinishMappingRequest {
  // Empty = current mapping session.
  string goal_id = 1;
  // If true, persist the map before returning to idle.
  bool persist = 2;
}

message FinishMappingResponse {
  automsgs.rpcs.common.Status status = 1;
  string map_identifier = 2;
}

message CancelMappingRequest {
  // Empty = cancel current mapping session.
  string goal_id = 1;
}

message GetMappingStatusRequest {}

message MappingStatus {
  automsgs.rpcs.common.Status status = 1;
  MappingState state = 2;
  string goal_id = 3;
  string map_identifier = 4;
  string map_name = 5;
  string detail = 6;
  // Unset = unknown. Optional coverage / save progress in [0, 1].
  optional float progress = 7;
}

// ---------------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------------

message MapSummary {
  string map_identifier = 1;
  string name = 2;
  float resolution = 3;
  uint32 width = 4;
  uint32 height = 5;
  bool is_current = 6;
}

message ListMapsRequest {
  automsgs.msgs.std_msgs.Header header = 1;
}

message ListMapsResponse {
  automsgs.rpcs.common.Status status = 1;
  repeated MapSummary maps = 2;
}

message GetMapRequest {
  // Prefer map_identifier; map_name is alias when identifier is empty.
  string map_identifier = 1;
  string map_name = 2;
}

message GetMapResponse {
  automsgs.rpcs.common.Status status = 1;
  automsgs.msgs.map_msgs.OccupancyGrid map = 2;
}

message GetMapMetadataRequest {
  string map_identifier = 1;
  string map_name = 2;
}

message GetMapMetadataResponse {
  automsgs.rpcs.common.Status status = 1;
  automsgs.msgs.map_msgs.MapMetaData metadata = 2;
  string map_identifier = 3;
}

message SaveMapRequest {
  automsgs.msgs.std_msgs.Header header = 1;
  string map_identifier = 2;
  string map_name = 3;
  // Empty grid = save current SLAM / active map buffer.
  automsgs.msgs.map_msgs.OccupancyGrid map = 4;
}

message SaveMapResponse {
  automsgs.rpcs.common.Status status = 1;
  string map_identifier = 2;
}

message DeleteMapRequest {
  string map_identifier = 1;
}

message SetCurrentMapRequest {
  string map_identifier = 1;
}
