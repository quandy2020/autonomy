syntax = "proto3";

package automsgs.rpcs.common;

// Status returned by RPCs (aligned with google.rpc.Status). Reused across all modules.
message Status {
  int32 code = 1;     // See Code enum; 0 = UNSPECIFIED, 1 = OK (success).
  string message = 2; // Human-readable message.
}

// Modular status codes: 0-1 generic, 2-99 common, 100+ per-module ranges.
// Ranges: 100-199 navigation, 200-299 vehicle, 300-399 task, 400-499 speech,
//         500-599 charging, 600-699 map, 700-799 sensor, 800-899 localization.
enum Code {
  // Generic (0-1)
  CODE_UNSPECIFIED = 0;
  CODE_OK = 1;

  // Common (2-99)
  CODE_INVALID_ARGUMENT = 2;
  CODE_UNAVAILABLE = 3;
  CODE_DEADLINE_EXCEEDED = 4;
  CODE_ABORTED = 5;
  CODE_INTERNAL = 6;
  CODE_NOT_FOUND = 7;
  CODE_ALREADY_EXISTS = 8;
  CODE_PERMISSION_DENIED = 9;

  // Navigation (100-199)
  CODE_NAVIGATION_GOAL_REJECTED = 100;
  CODE_NAVIGATION_PATH_BLOCKED = 101;
  CODE_NAVIGATION_TIMEOUT = 102;
  CODE_NAVIGATION_CANCELLED = 103;
  CODE_NAVIGATION_NO_PATH = 104;

  // Vehicle (200-299)
  CODE_VEHICLE_LOW_BATTERY = 200;
  CODE_VEHICLE_FAULT = 201;
  CODE_VEHICLE_BUSY = 202;
  CODE_VEHICLE_OFFLINE = 203;

  // Task (300-399)
  CODE_TASK_NOT_FOUND = 300;
  CODE_TASK_ALREADY_RUNNING = 301;
  CODE_TASK_CANCELLED = 302;
  CODE_TASK_FAILED = 303;

  // Speech (400-499)
  CODE_SPEECH_SYNTHESIS_FAILED = 400;
  CODE_SPEECH_RECOGNITION_FAILED = 401;
  CODE_SPEECH_TIMEOUT = 402;
  CODE_SPEECH_LANGUAGE_NOT_SUPPORTED = 403;

  // Charging (500-599)
  CODE_CHARGING_DOCK_NOT_FOUND = 500;
  CODE_CHARGING_DOCK_FAILED = 501;
  CODE_CHARGING_ALREADY_DOCKED = 502;
  CODE_CHARGING_ALREADY_UNDOCKED = 503;

  // Map (600-699)
  CODE_MAP_NOT_FOUND = 600;
  CODE_MAP_SAVE_FAILED = 601;
  CODE_MAP_LOAD_FAILED = 602;
  CODE_MAP_INVALID = 603;

  // Sensor (700-799)
  CODE_SENSOR_NOT_FOUND = 700;
  CODE_SENSOR_UNAVAILABLE = 701;
  CODE_SENSOR_TIMEOUT = 702;

  // Localization (800-899)
  CODE_LOCALIZATION_LOST = 800;
  CODE_LOCALIZATION_NOT_READY = 801;
  CODE_LOCALIZATION_INVALID_POSE = 802;
}
