syntax = "proto3";

package automsgs.rpcs.sensor;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/sensor_msgs/image.proto";
import "automsgs/msgs/sensor_msgs/compressed_image.proto";
import "automsgs/msgs/sensor_msgs/laser_scan.proto";
import "automsgs/msgs/sensor_msgs/point_cloud2.proto";
import "automsgs/msgs/nav_msgs/occupancy_grid.proto";
import "automsgs/rpcs/status.proto";

// Sensor RPCs: list sensors, get latest image/lidar/pointcloud/grid.
service SensorService {
  rpc List(ListSensorsRequest) returns (ListSensorsResponse);
  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  rpc GetLaserScan(GetLaserScanRequest) returns (GetLaserScanResponse);
  rpc GetPointCloud(GetPointCloudRequest) returns (GetPointCloudResponse);
  rpc GetGrid(GetGridRequest) returns (GetGridResponse);
}

enum SensorType {
  SENSOR_TYPE_UNSPECIFIED = 0;
  SENSOR_TYPE_CAMERA = 1;
  SENSOR_TYPE_DEPTH_CAMERA = 2;
  SENSOR_TYPE_LASER_SCAN = 3;
  SENSOR_TYPE_POINT_CLOUD = 4;
  SENSOR_TYPE_ODOMETRY = 5;
}

message ListSensorsRequest {
  automsgs.msgs.std_msgs.Header header = 1;
}

message SensorInfo {
  string sensor_id = 1;
  string frame_id = 2;
  SensorType type = 3;
  string topic = 4;  // Optional, e.g. ROS topic name.
}

message ListSensorsResponse {
  automsgs.rpcs.common.Status status = 1;
  repeated SensorInfo sensors = 2;
}

message GetImageRequest {
  string sensor_id = 1;  // From ListSensors.
  bool compressed = 2;   // If true, return CompressedImage to reduce size.
}

message GetImageResponse {
  automsgs.rpcs.common.Status status = 1;
  oneof image {
    automsgs.msgs.sensor_msgs.Image raw = 2;
    automsgs.msgs.sensor_msgs.CompressedImage compressed = 3;
  }
}

message GetLaserScanRequest {
  string sensor_id = 1;
}

message GetLaserScanResponse {
  automsgs.rpcs.common.Status status = 1;
  automsgs.msgs.sensor_msgs.LaserScan scan = 2;
}

message GetPointCloudRequest {
  string sensor_id = 1;
}

message GetPointCloudResponse {
  automsgs.rpcs.common.Status status = 1;
  automsgs.msgs.sensor_msgs.PointCloud2 point_cloud = 2;
}

message GetGridRequest {
  string frame_id = 1;  // Optional; empty = default.
}

message GetGridResponse {
  automsgs.rpcs.common.Status status = 1;
  automsgs.msgs.nav_msgs.OccupancyGrid grid = 2;
}
