syntax = "proto3";

package automsgs.rpcs.task;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/rpcs/status.proto";

// Task execution: run by id, query status, cancel.
service TaskService {
  rpc Run(RunRequest) returns (RunResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

message RunRequest {
  automsgs.msgs.std_msgs.Header header = 1;
  string task_id = 2;   // e.g. "delivery", "patrol"; vendor-defined.
  string task_args = 3; // Optional JSON or opaque string for task params.
}

message RunResponse {
  automsgs.rpcs.common.Status status = 1;
  string run_id = 2;    // Server-assigned id for status/cancel.
}

message GetStatusRequest {
  string run_id = 1;    // From RunResponse.run_id.
}

enum TaskRunState {
  TASK_RUN_STATE_UNSPECIFIED = 0;
  TASK_RUN_STATE_PENDING = 1;
  TASK_RUN_STATE_RUNNING = 2;
  TASK_RUN_STATE_SUCCEEDED = 3;
  TASK_RUN_STATE_FAILED = 4;
  TASK_RUN_STATE_CANCELLED = 5;
}

message GetStatusResponse {
  automsgs.rpcs.common.Status status = 1;
  TaskRunState state = 2;
  string run_id = 3;
  string progress = 4;  // Optional human-readable progress.
}

message CancelRequest {
  string run_id = 1;
}

message CancelResponse {
  automsgs.rpcs.common.Status status = 1;
}
