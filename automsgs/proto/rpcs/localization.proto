syntax = "proto3";

package automsgs.rpcs.localization;

import "automsgs/msgs/geometry_msgs/pose_with_covariance.proto";
import "automsgs/rpcs/common.proto";

// =============================================================================
// LocalizationService
//
//   GetPose         — unary pose in map frame (PoseWithCovariance)
//   GetStatus       — unary LocalizationStatus snapshot
//   SetInitialPose  — unary re-localization seed (pose + covariance)
//
// PoseWithCovariance embeds PoseStamped (header + pose) + 6x6 covariance.
// Active map via MapService.SetCurrentMap; map_id here is optional.
// While INITIALIZING, new SetInitialPose → LOCALIZATION_BUSY (803).
// =============================================================================
service LocalizationService {
  rpc GetPose(GetPoseRequest) returns (GetPoseResponse);
  rpc GetStatus(GetStatusRequest) returns (LocalizationStatus);
  rpc SetInitialPose(SetInitialPoseRequest) returns (automsgs.rpcs.common.Status);
}

enum LocalizationState {
  LOCALIZATION_STATE_UNKNOWN = 0;
  LOCALIZATION_STATE_LOCALIZED = 1;
  LOCALIZATION_STATE_LOST = 2;
  LOCALIZATION_STATE_INITIALIZING = 3;
}

message LocalizationStatus {
  automsgs.rpcs.common.Status status = 1;
  LocalizationState state = 2;
  string map_id = 3;
  string detail = 4;
  // Unset = unknown. Typical range [0, 1].
  optional float confidence = 5;
}

message GetPoseRequest {
  // Empty = default map frame.
  string map_frame_id = 1;
}

message GetPoseResponse {
  automsgs.rpcs.common.Status status = 1;
  // header + pose + covariance (length 0 or 36).
  automsgs.msgs.geometry_msgs.PoseWithCovariance pose = 2;
  optional float confidence = 3;
}

message GetStatusRequest {}

message SetInitialPoseRequest {
  // Seed pose; set pose.pose.header.frame_id (e.g. map) and covariance.
  automsgs.msgs.geometry_msgs.PoseWithCovariance pose = 1;
  // Empty = current map from MapService.
  string map_id = 2;
}
