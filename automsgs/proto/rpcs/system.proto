syntax = "proto3";

package automsgs.rpcs.system;

import "automsgs/msgs/sensor_msgs/battery_state.proto";
import "automsgs/msgs/vehicle_msgs/robot_state.proto";
import "automsgs/rpcs/common.proto";

// =============================================================================
// SystemService
//
// Aligned with autonomy/system (monitors + process control):
//   Heartbeat / GetInfo / GetStatus / GetHealth
//   EmergencyStop / ClearEmergencyStop
//   CancelAllGoals / GetActiveGoal / GetCapabilities
//
// Health fields map to autonomy::system::monitor
// (HazardLevel, MrmHandler, CPU/Mem/Disk, Channel/Latency watches).
// =============================================================================
service SystemService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  // Full onboarding / cloud snapshot (no raw perception).
  rpc GetRobotFullInfo(GetRobotFullInfoRequest) returns (RobotFullInfo);

  rpc EmergencyStop(EmergencyStopRequest) returns (automsgs.rpcs.common.Status);
  rpc ClearEmergencyStop(ClearEmergencyStopRequest)
      returns (automsgs.rpcs.common.Status);

  rpc CancelAllGoals(CancelAllGoalsRequest) returns (automsgs.rpcs.common.Status);
  rpc GetActiveGoal(GetActiveGoalRequest) returns (ActiveGoal);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);

  // Process / evidence / OTA (system management plane).
  rpc RestartModule(RestartModuleRequest) returns (RestartModuleResponse);
  rpc GetProcessStatus(GetProcessStatusRequest) returns (GetProcessStatusResponse);
  rpc GetEventBundle(GetEventBundleRequest) returns (GetEventBundleResponse);
  rpc StartOta(StartOtaRequest) returns (StartOtaResponse);
  rpc GetOtaStatus(GetOtaStatusRequest) returns (GetOtaStatusResponse);
  rpc AbortOta(AbortOtaRequest) returns (AbortOtaResponse);
  rpc ApplyConfigPackage(ApplyConfigPackageRequest)
      returns (ApplyConfigPackageResponse);
}

// ---------------------------------------------------------------------------
// Identity / keepalive
// ---------------------------------------------------------------------------

message HeartbeatRequest {
  uint64 sequence = 1;
}

message HeartbeatResponse {
  automsgs.rpcs.common.Status status = 1;
  uint64 sequence = 2;
  int64 robot_time_ns = 3;
}

message GetInfoRequest {}

message GetInfoResponse {
  automsgs.rpcs.common.Status status = 1;
  string model = 2;
  string serial_number = 3;
  string firmware_version = 4;
  string software_version = 5;
  string hostname = 6;
  // autonomy process / stack version (from autonomy/system runtime).
  string autonomy_version = 7;
}

// ---------------------------------------------------------------------------
// Robot full profile (client / cloud Unary; aggregates identity + live state)
// ---------------------------------------------------------------------------

message RobotIdentity {
  string robot_id = 1;
  string model = 2;
  string serial_number = 3;
  string hostname = 4;
  string firmware_version = 5;
  string software_version = 6;
  string autonomy_version = 7;
  string bridge_version = 8;
  string fleet_id = 9;
  string site_id = 10;
}

message GetRobotFullInfoRequest {}

message RobotAlert {
  string code = 1;
  string severity = 2;
  string message = 3;
  string source = 4;
}

message RobotFullInfo {
  automsgs.rpcs.common.Status status = 1;
  RobotIdentity identity = 2;
  automsgs.msgs.vehicle_msgs.RobotState state = 3;
  SystemState system_state = 4;
  ActiveGoal active_goal = 5;
  // Includes channel lists for alert summarization; use GetHealth for ops dig.
  SystemHealth health = 6;
  Capabilities capabilities = 7;
  int64 robot_time_ns = 8;
  repeated RobotAlert alerts = 9;
}

// ---------------------------------------------------------------------------
// Coarse state + health (monitor-aligned)
// ---------------------------------------------------------------------------

enum SystemState {
  SYSTEM_STATE_UNKNOWN = 0;
  SYSTEM_STATE_IDLE = 1;
  SYSTEM_STATE_BUSY = 2;
  SYSTEM_STATE_ERROR = 3;
  SYSTEM_STATE_ESTOP = 4;
}

// Matches autonomy::system::monitor::HazardLevel (OK/WARN/ERROR).
enum HazardLevel {
  HAZARD_LEVEL_UNKNOWN = 0;
  HAZARD_LEVEL_OK = 1;
  HAZARD_LEVEL_WARN = 2;
  HAZARD_LEVEL_ERROR = 3;
}

message HostResourceSnapshot {
  // From CPU / Mem / HDD / NTP monitors (percent or seconds).
  optional float cpu_usage_percent = 1;
  optional float memory_usage_percent = 2;
  optional float disk_usage_percent = 3;
  optional float load_average_1m = 4;
  optional float ntp_offset_seconds = 5;
}

// Matches autonomy::system::monitor::ChannelHealth.
message ChannelHealth {
  string channel = 1;
  bool ever_received = 2;
  bool healthy = 3;
  float age_seconds = 4;
  float rate_hz = 5;
}

// Matches autonomy::system::monitor::LatencyHealth.
message LatencyHealth {
  string channel = 1;
  bool ever_received = 2;
  bool healthy = 3;
  float message_age_seconds = 4;
}

// Matches autonomy::system::monitor::ProcessHealth (critical process list).
message ProcessHealth {
  string name = 1;
  string match = 2;
  bool alive = 3;
  int32 pid = 4;
  string restart_hint = 5;
}

// Aggregate health from autonomy/system/monitor registry.
message SystemHealth {
  HazardLevel hazard_level = 1;
  // MrmHandler publishing zero cmd_vel.
  bool mrm_active = 2;
  // Software / hardware estop latch (EmergencyStop RPC or external).
  bool emergency_stop_latched = 3;
  HostResourceSnapshot host = 4;
  repeated ChannelHealth channels = 5;
  repeated LatencyHealth latencies = 6;
  string detail = 7;
  repeated ProcessHealth processes = 8;
}

message GetStatusRequest {}

message GetStatusResponse {
  automsgs.rpcs.common.Status status = 1;
  SystemState state = 2;
  string detail = 3;
  automsgs.msgs.sensor_msgs.BatteryState battery = 4;
  // Compact health; use GetHealth for full channel/latency lists if heavy.
  SystemHealth health = 5;
}

message GetHealthRequest {}

message GetHealthResponse {
  automsgs.rpcs.common.Status status = 1;
  SystemHealth health = 2;
}

// ---------------------------------------------------------------------------
// Estop
// ---------------------------------------------------------------------------

message EmergencyStopRequest {
  string reason = 1;
}

message ClearEmergencyStopRequest {
  string reason = 1;
  string confirmation_token = 2;
}

// ---------------------------------------------------------------------------
// Goal arbitration
// ---------------------------------------------------------------------------

enum GoalKind {
  GOAL_KIND_UNKNOWN = 0;
  GOAL_KIND_NONE = 1;
  GOAL_KIND_NAVIGATION = 2;
  GOAL_KIND_FOLLOW = 3;
  GOAL_KIND_CHARGE = 4;
  GOAL_KIND_MAPPING = 5;
  GOAL_KIND_TELEOP = 6;
  GOAL_KIND_EXPLORATION = 7;
  GOAL_KIND_VOICE = 8;
}

message CancelAllGoalsRequest {
  // Empty = cancel every active domain goal.
  repeated GoalKind goal_kinds = 1;
  string reason = 2;
}

message GetActiveGoalRequest {}

message ActiveGoal {
  automsgs.rpcs.common.Status status = 1;
  GoalKind kind = 2;
  string goal_id = 3;
  string detail = 4;
}

// ---------------------------------------------------------------------------
// Capabilities
// ---------------------------------------------------------------------------

message GetCapabilitiesRequest {}

message Capabilities {
  automsgs.rpcs.common.Status status = 1;
  bool supports_navigation = 2;
  bool supports_follow = 3;
  bool supports_charge = 4;
  bool supports_mapping = 5;
  bool supports_localization = 6;
  bool supports_teleop = 7;
  bool supports_sensor_record = 8;
  bool supports_system_monitor = 9;
  bool supports_mrm = 10;
  string bridge_version = 11;
  string autonomy_version = 12;
  bool supports_exploration = 13;
  bool supports_ota = 14;
  bool supports_event_bundle = 15;
}

// ---------------------------------------------------------------------------
// Process control / evidence / OTA / config package
// ---------------------------------------------------------------------------

message RestartModuleRequest {
  string module_name = 1;  // launch module name, e.g. "planning"
  string reason = 2;
}

message RestartModuleResponse {
  automsgs.rpcs.common.Status status = 1;
  string detail = 2;
}

message GetProcessStatusRequest {}

message GetProcessStatusResponse {
  automsgs.rpcs.common.Status status = 1;
  repeated ProcessHealth processes = 2;
}

message GetEventBundleRequest {
  // Empty = latest event under events/
  string event_id = 1;
}

message GetEventBundleResponse {
  automsgs.rpcs.common.Status status = 1;
  string event_id = 2;
  string path = 3;
  string detail = 4;
}

enum OtaState {
  OTA_STATE_UNKNOWN = 0;
  OTA_STATE_IDLE = 1;
  OTA_STATE_DOWNLOADING = 2;
  OTA_STATE_VERIFYING = 3;
  OTA_STATE_APPLYING = 4;
  OTA_STATE_SWITCHING = 5;
  OTA_STATE_RESTARTING = 6;
  OTA_STATE_HEALTH_GATING = 7;
  OTA_STATE_COMMITTED = 8;
  OTA_STATE_ROLLING_BACK = 9;
  OTA_STATE_FAILED = 10;
}

message StartOtaRequest {
  // Local path or http(s) URI to full/delta package directory or archive.
  string package_uri = 1;
  // Optional: "full" | "delta" | empty = auto
  string package_type = 2;
  bool prefer_delta = 3;
}

message StartOtaResponse {
  automsgs.rpcs.common.Status status = 1;
  OtaState state = 2;
  string detail = 3;
}

message GetOtaStatusRequest {}

message GetOtaStatusResponse {
  automsgs.rpcs.common.Status status = 1;
  OtaState state = 2;
  string current_version = 3;
  string target_version = 4;
  float progress = 5;  // 0..1 if known
  string detail = 6;
}

message AbortOtaRequest {
  string reason = 1;
}

message AbortOtaResponse {
  automsgs.rpcs.common.Status status = 1;
  OtaState state = 2;
}

message ApplyConfigPackageRequest {
  string package_uri = 1;
  bool dry_run = 2;
}

message ApplyConfigPackageResponse {
  automsgs.rpcs.common.Status status = 1;
  string detail = 2;
}
