syntax = "proto3";

package automsgs.rpcs.vehicle;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/rpcs/status.proto";

// Vehicle state RPCs: pose, battery, overall status (AGV/service robot as vehicle).
service VehicleService {
  rpc GetPose(GetPoseRequest) returns (GetPoseResponse);
  rpc GetBattery(GetBatteryRequest) returns (GetBatteryResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetPoseRequest {
  string frame_id = 1;  // Optional; empty = default odom/base frame.
}

message GetPoseResponse {
  automsgs.rpcs.common.Status status = 1;
  automsgs.msgs.std_msgs.Header header = 2;
  automsgs.msgs.geometry_msgs.Pose pose = 3;
}

message GetBatteryRequest {}

message GetBatteryResponse {
  automsgs.rpcs.common.Status status = 1;
  float percentage = 2;   // 0..100
  bool is_charging = 3;
  int32 remaining_seconds = 4;  // -1 if unknown.
}

enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_IDLE = 1;
  VEHICLE_STATUS_BUSY = 2;
  VEHICLE_STATUS_NAVIGATING = 3;
  VEHICLE_STATUS_CHARGING = 4;
  VEHICLE_STATUS_ERROR = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  automsgs.rpcs.common.Status status = 1;
  VehicleStatus state = 2;  // Vehicle running state (idle, busy, etc.).
  string detail = 3;       // Optional human-readable detail.
}
