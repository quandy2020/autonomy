syntax = "proto3";

package automsgs.srvs;

import "automsgs/msgs/hunav_msgs/agent.proto";
import "automsgs/msgs/hunav_msgs/agents.proto";

// Move one agent among a full snapshot (HuNav ``/move_agent``).
message MoveAgent {
  message Request {
    automsgs.msgs.hunav_msgs.Agents current_agents = 1;
    automsgs.msgs.hunav_msgs.Agent robot = 2;
    int32 agent_id = 3;
    double dt = 4;
  }

  message Response {
    automsgs.msgs.hunav_msgs.Agent updated_agent = 1;
    bool success = 2;
    string message = 3;
  }

  Request request = 1;
  Response response = 2;
}
