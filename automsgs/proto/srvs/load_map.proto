syntax = "proto3";

package automsgs.srvs;

import "automsgs/msgs/nav_msgs/occupancy_grid.proto";

// Service to load a map from a URL.
message LoadMap {
  message Request {
    // URL of map resource: file:// or package:// style.
    string map_url = 1;
  }

  message Response {
    // Result code (semantics same as original ROS service).
    uint32 result = 1;
    automsgs.msgs.nav_msgs.OccupancyGrid map = 2;
  }

  Request request = 1;
  Response response = 2;
}

