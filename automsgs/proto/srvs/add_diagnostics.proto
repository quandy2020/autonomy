syntax = "proto3";

package automsgs.srvs;

// Service to add analyzers to the diagnostic aggregator at runtime.
message AddDiagnostics {
  // Request message.
  message Request {
    // Namespace under which analyzer parameters have been loaded (global name).
    string load_namespace = 1;
  }

  // Response message.
  message Response {
    // True if new diagnostics were added successfully.
    bool success = 1;

    // Additional information about success or failure.
    string message = 2;
  }

  Request request = 1;
  Response response = 2;
}


