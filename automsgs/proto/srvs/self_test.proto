syntax = "proto3";

package automsgs.srvs;

import "automsgs/msgs/diagnostic_msgs/diagnostic_status.proto";

// Service to perform a self-test and return aggregated diagnostic status.
message SelfTest {
  message Request {}

  message Response {
    string id = 1;
    int32 passed = 2;
    repeated automsgs.msgs.diagnostic_msgs.DiagnosticStatus status = 3;
  }

  Request request = 1;
  Response response = 2;
}

