syntax = "proto3";

package automsgs.srvs;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/nav_msgs/path.proto";

// Service to get a plan from the current position to a goal pose.
message GetPlan {
  // Request specifying start, goal and tolerance.
  message Request {
    automsgs.msgs.geometry_msgs.PoseStamped start = 1;
    automsgs.msgs.geometry_msgs.PoseStamped goal = 2;
    float tolerance = 3;
  }

  // Response containing the planned path, if found.
  message Response {
    automsgs.msgs.nav_msgs.Path plan = 1;
  }

  Request request = 1;
  Response response = 2;
}

