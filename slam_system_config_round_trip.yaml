pipeline: voxel_slam
trajectory_path: "/tmp/traj.txt"
sensors:
  lidar:
    model: ouster
    blind_distance_meters: 0.5
    point_filter_stride: 2
    relative_time_synthesis_enabled: true
    scan_period_seconds: 0.10000000000000001
    lidar_to_imu_rotation: [0, -1, 0, -1, 0, 0, 0, 0, -1]
    lidar_to_imu_translation: [-0.001, -0.0085500000000000003, 0.055]
frontend:
  initialization:
    minimum_imu_sample_count: 4
    gravity_magnitude: 9.8100000000000005
    maximum_acceleration_variance: 0.20000000000000001
    minimum_plane_observability_eigenvalue: 5
  local_mapping:
    window_size: 3
  odometry:
    local_window_size: 10
    worker_thread_count: 6
    degradation_count_limit: 50
    minimum_normal_eigenvalue: 6
    point_downsampling_size_meters: 0.10000000000000001
    range_noise_meters: 0.01
    beam_angle_noise_degrees: 0.01
    local_bundle_adjustment_enabled: true
    gravity_bundle_adjustment_enabled: false
  inertial:
    gyroscope_measurement_noise: 0.20000000000000001
    accelerometer_measurement_noise: 0.29999999999999999
    gyroscope_bias_random_walk_noise: 0.00020000000000000001
    accelerometer_bias_random_walk_noise: 0.00029999999999999997
mapping:
  voxel:
    voxel_size_meters: 1
    minimum_plane_eigenvalue: 0.01
optimization:
  inertial_factor_coefficient: 0.0001
  loop_icp_minimum_eigenvalue: 0.01
backend:
  loop_closure:
    enabled: true
    triangle_descriptors_enabled: true
    descriptor_score_threshold: 0.45000000000000001
    maximum_drift_ratio: 0.050000000000000003
    same_session_update_interval: 10
    historical_session_update_interval: 30
  global_mapping:
    enabled: true
    local_window_size: 10
    submap_merge_size: 5
storage:
  directory: ""
  session_name: "session0"
  previous_map: ""
