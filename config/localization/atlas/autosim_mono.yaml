# Autosim / Habitat RGB monocular (matches autosim/config/default.yaml camera)
#
# Intrinsics: fx = 0.5 * width / tan(0.5 * hfov), hfov=90°, 640x480 → fx=fy=320
# Topics (when image bridge is wired):
#   /camera/rgb/image_raw   rgb8
#   /camera/camera_info

Camera:
  name: "autosim monocular"
  setup: "monocular"
  model: "perspective"

  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0

  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0

  fps: 15.0
  cols: 640
  rows: 480

  color_order: "RGB"

Preprocessing:
  min_size: 800

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20
  erase_temporal_keyframes: false
  num_temporal_keyframes: 15

Tracking:
  backend: "g2o"
  enable_temporal_keyframe_only_tracking: false

KeyframeInserter:
  wait_for_local_bundle_adjustment: false

Relocalizer:
  search_neighbor: true

LoopDetector:
  backend: "g2o"

System:
  map_format: "msgpack"
  num_grid_cols: 47
  num_grid_rows: 30

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400

PLP:
  enabled: true
  use_line_tracking: true
  use_plane_mapping: false
