# Atla2 platform: visual-lidar-inertial (loose coupling)
frontend:
  mode: livo
  fusion: loose
  vio:
    enabled: true
    camera: front
  lio:
    enabled: true
    lidar: mid360
  imu: default

sensor:
  gps:
    enabled: false

backend:
  type: iekf

map:
  max_local_map_points: 80000
  voxel_size: 0.2

sync_tol_ms: 20.0
