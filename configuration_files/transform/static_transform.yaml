# Static Transform Configuration
# 静态TF变换配置
# 
# 说明：
# - frame_id: 父坐标系名称
# - child_frame_id: 子坐标系名称
# - translation: 平移向量 (x, y, z) 单位：米
# - rotation: 旋转四元数 (x, y, z, w)
# - enabled: 是否启用该变换

static_transforms:
  
  # base_footprint -> base_link: 单位变换（重合）
  # base_footprint 和 base_link 是重合的，它们之间没有偏移
  - name: base_footprint_to_base_link
    enabled: true
    frame_id: "base_footprint"
    child_frame_id: "base_link"
    translation:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0
  
  # RGB-D Camera - Intel RealSense D435i (前方)
  - name: realsense435i
    enabled: true
    frame_id: "base_link"
    child_frame_id: "camera_front_link"
    translation:
      x: 0.3
      y: 0.0
      z: 0.1
    rotation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0

  # RGB-D Camera - Intel RealSense D455 (后方，朝向后方需要旋转180度)
  - name: realsense455
    enabled: true
    frame_id: "base_link"
    child_frame_id: "camera_rear_link"
    translation:
      x: -0.3
      y: 0.0
      z: 0.1
    rotation:
      x: 0.0
      y: 0.0
      z: 1.0
      w: 0.0
  
  # IMU - Inertial Measurement Unit (质心位置)
  - name: imu
    enabled: true
    frame_id: "base_link"
    child_frame_id: "imu_link"
    translation:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0
  
  # Front Laser scanner (在imu前方20cm)
  - name: laser
    enabled: true
    frame_id: "base_link"
    child_frame_id: "laser_link"
    translation:
      x: 0.2
      y: 0.0
      z: 0.0
    rotation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0
