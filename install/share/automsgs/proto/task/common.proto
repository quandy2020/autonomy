syntax = "proto3";

package autonomy.task.proto;

enum Cmd {
  UNSPECIFIED = 0;
  START = 1;
  CANCEL = 2;
  PAUSE = 3;
  RESUME = 4;
}

enum Status {
  UNKNOWN = 0;
  RUNNING = 1;
  PAUSED = 2;
  SUCCEEDED = 3;
  FAILED = 4;
  CANCELED = 5;
}
