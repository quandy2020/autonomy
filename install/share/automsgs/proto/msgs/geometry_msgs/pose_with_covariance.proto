syntax = "proto3";

package automsgs.msgs.geometry_msgs;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";

// Pose in free space with covariance.
message PoseWithCovariance {
  PoseStamped pose = 1;

  // Row-major 6x6 covariance matrix (length 36):
  // (x, y, z, rot_X, rot_Y, rot_Z).
  repeated double covariance = 2;
}
