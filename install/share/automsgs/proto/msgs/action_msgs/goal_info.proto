syntax = "proto3";

package automsgs.msgs.action_msgs;

import "automsgs/msgs/builtin_interfaces/time.proto";
import "automsgs/msgs/unique_identifier_msgs/uuid.proto";

message GoalInfo {
  // Goal ID.
  automsgs.msgs.unique_identifier_msgs.UUID goal_id = 1;

  // Time when the goal was accepted.
  automsgs.msgs.builtin_interfaces.Time stamp = 2;
}
