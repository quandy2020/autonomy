syntax = "proto3";

package automsgs.msgs.control_msgs;

// JointTolerance variant with a component selector for multi-DOF joints.
// X/Y/Z_AXIS apply to a single axis; TRANSLATION is Euclidean distance (m);
// ROTATION is quaternion difference (rad). Z_AXIS is only valid with a floating joint.
message JointComponentTolerance {
  enum Component {
    COMPONENT_UNSPECIFIED = 0;
    X_AXIS = 1;
    Y_AXIS = 2;
    Z_AXIS = 3;
    TRANSLATION = 4;
    ROTATION = 5;
  }

  string joint_name = 1;
  Component component = 2;
  double position = 3;
  double velocity = 4;
  double acceleration = 5;
}
