syntax = "proto3";

package automsgs.msgs.control_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/trajectory_msgs/joint_trajectory_point.proto";
import "automsgs/msgs/trajectory_msgs/multi_dof_joint_trajectory_point.proto";

// Current state of a JointTrajectoryController.
message JointTrajectoryControllerState {
  automsgs.msgs.std_msgs.Header header = 1;

  repeated string joint_names = 2;
  automsgs.msgs.trajectory_msgs.JointTrajectoryPoint reference = 3;
  automsgs.msgs.trajectory_msgs.JointTrajectoryPoint feedback = 4;
  automsgs.msgs.trajectory_msgs.JointTrajectoryPoint error = 5;
  automsgs.msgs.trajectory_msgs.JointTrajectoryPoint output = 6;

  repeated string multi_dof_joint_names = 7;
  automsgs.msgs.trajectory_msgs.MultiDOFJointTrajectoryPoint multi_dof_reference = 8;
  automsgs.msgs.trajectory_msgs.MultiDOFJointTrajectoryPoint multi_dof_feedback = 9;
  automsgs.msgs.trajectory_msgs.MultiDOFJointTrajectoryPoint multi_dof_error = 10;
  automsgs.msgs.trajectory_msgs.MultiDOFJointTrajectoryPoint multi_dof_output = 11;

  // Speed scaling factor currently applied to trajectory execution.
  double speed_scaling_factor = 12;
}
