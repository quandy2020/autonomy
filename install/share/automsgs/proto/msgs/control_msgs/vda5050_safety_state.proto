syntax = "proto3";

package automsgs.msgs.control_msgs;

// VDA5050 safety state (e-stop acknowledge type + protective field).
// e_stop values: "autoAck", "manual", "remote", "none".
message VDA5050SafetyState {
  // Acknowledge type of e-stop: autoAck / manual / remote / none.
  string e_stop = 1;
  // True if a protective field is violated.
  bool field_violation = 2;
}
