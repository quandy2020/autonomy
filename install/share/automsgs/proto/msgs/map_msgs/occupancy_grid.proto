syntax = "proto3";

package automsgs.msgs.map_msgs;

import "automsgs/msgs/map_msgs/map_meta_data.proto";
import "automsgs/msgs/std_msgs/header.proto";

// Canonical OccupancyGrid lives in map_msgs.
// Official ROS places OccupancyGrid in nav_msgs; this repo consolidates on map_msgs.
message OccupancyGrid {
  automsgs.msgs.std_msgs.Header header = 1;
  MapMetaData info = 2;
  repeated int32 data = 3;
}
