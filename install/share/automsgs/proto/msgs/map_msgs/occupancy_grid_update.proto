syntax = "proto3";

package automsgs.msgs.map_msgs;

import "automsgs/msgs/std_msgs/header.proto";

// Official map_msgs/OccupancyGridUpdate
message OccupancyGridUpdate {
  automsgs.msgs.std_msgs.Header header = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  repeated int32 data = 6;
}
