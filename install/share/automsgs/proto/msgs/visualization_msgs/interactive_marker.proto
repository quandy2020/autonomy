syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/visualization_msgs/menu_entry.proto";
import "automsgs/msgs/visualization_msgs/interactive_marker_control.proto";

// Interactive marker definition.
message InteractiveMarker {
  automsgs.msgs.std_msgs.Header header = 1;
  automsgs.msgs.geometry_msgs.Pose pose = 2;
  string name = 3;
  string description = 4;
  float scale = 5;
  repeated MenuEntry menu_entries = 6;
  repeated InteractiveMarkerControl controls = 7;
}
