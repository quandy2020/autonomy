syntax = "proto3";

package automsgs.msgs.visualization_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/geometry_msgs/point.proto";

// Feedback from interactive marker GUI.
message InteractiveMarkerFeedback {
  automsgs.msgs.std_msgs.Header header = 1;
  string client_id = 2;
  string marker_name = 3;
  string control_name = 4;

  enum EventType {
    KEEP_ALIVE = 0;
    POSE_UPDATE = 1;
    MENU_SELECT = 2;
    BUTTON_CLICK = 3;
    MOUSE_DOWN = 4;
    MOUSE_UP = 5;
  }

  EventType event_type = 5;
  automsgs.msgs.geometry_msgs.Pose pose = 6;
  uint32 menu_entry_id = 7;
  automsgs.msgs.geometry_msgs.Point mouse_point = 8;
  bool mouse_point_valid = 9;
}
