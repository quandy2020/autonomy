syntax = "proto3";

package automsgs.msgs.moveit_msgs;


message ServoStatus {
  enum Code {
    NO_WARNING = 0;
    DECELERATE_FOR_APPROACHING_SINGULARITY = 1;
    HALT_FOR_SINGULARITY = 2;
    DECELERATE_FOR_LEAVING_SINGULARITY = 3;
    DECELERATE_FOR_COLLISION = 4;
    HALT_FOR_COLLISION = 5;
    JOINT_BOUND = 6;
    INVALID = -1;
  }
  Code code = 1;
  string message = 2;
}
