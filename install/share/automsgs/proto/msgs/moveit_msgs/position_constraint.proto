syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/moveit_msgs/bounding_volume.proto";
import "automsgs/msgs/std_msgs/header.proto";

// Position constraint.
// Fields 1-4 keep the existing automsgs layout used by constraint_samplers;
// 5+ match ROS PositionConstraint extras.
message PositionConstraint {
  string link_name = 1;
  automsgs.msgs.geometry_msgs.PoseStamped target = 2;
  double tolerance = 3;
  double weight = 4;
  automsgs.msgs.std_msgs.Header header = 5;
  automsgs.msgs.geometry_msgs.Vector3 target_point_offset = 6;
  BoundingVolume constraint_region = 7;
}
