syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/moveit_msgs/gripper_translation.proto";
import "automsgs/msgs/trajectory_msgs/joint_trajectory.proto";

message Grasp {
  string id = 1;
  automsgs.msgs.trajectory_msgs.JointTrajectory pre_grasp_posture = 2;
  automsgs.msgs.trajectory_msgs.JointTrajectory grasp_posture = 3;
  automsgs.msgs.geometry_msgs.PoseStamped grasp_pose = 4;
  double grasp_quality = 5;
  GripperTranslation pre_grasp_approach = 6;
  GripperTranslation post_grasp_retreat = 7;
  GripperTranslation post_place_retreat = 8;
  float max_contact_force = 9;
  repeated string allowed_touch_objects = 10;
}
