syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/geometry_msgs/transform_stamped.proto";
import "automsgs/msgs/moveit_msgs/allowed_collision_matrix.proto";
import "automsgs/msgs/moveit_msgs/attached_collision_object.proto";
import "automsgs/msgs/moveit_msgs/link_padding.proto";
import "automsgs/msgs/moveit_msgs/link_scale.proto";
import "automsgs/msgs/moveit_msgs/object_color.proto";
import "automsgs/msgs/moveit_msgs/planning_scene_world.proto";
import "automsgs/msgs/moveit_msgs/robot_state.proto";
import "automsgs/msgs/sensor_msgs/joint_state.proto";

// Planning scene. Fields 1-7 keep the existing automsgs layout; 8+ match ROS extras.
message PlanningScene {
  string name = 1;
  automsgs.msgs.sensor_msgs.JointState robot_state = 2;
  string robot_model_name = 3;
  AllowedCollisionMatrix allowed_collision_matrix = 4;
  PlanningSceneWorld world = 5;
  bool is_diff = 6;
  repeated AttachedCollisionObject attached_collision_objects = 7;
  RobotState full_robot_state = 8;
  repeated automsgs.msgs.geometry_msgs.TransformStamped fixed_frame_transforms = 9;
  repeated LinkPadding link_padding = 10;
  repeated LinkScale link_scale = 11;
  repeated ObjectColor object_colors = 12;
}
