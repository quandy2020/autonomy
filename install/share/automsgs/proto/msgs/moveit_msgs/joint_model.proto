syntax = "proto3";

package automsgs.msgs.moveit_msgs;

import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/moveit_msgs/joint_limits.proto";

// URDF-derived joint description including limits, axis, origin, and mimic.
message JointModel {
  string name = 1;
  string type = 2;  // revolute / continuous / prismatic / fixed
  string parent_link = 3;
  string child_link = 4;
  JointLimits limits = 5;
  string mimic_joint = 6;
  double mimic_factor = 7;
  double mimic_offset = 8;
  automsgs.msgs.geometry_msgs.Vector3 axis = 9;
  automsgs.msgs.geometry_msgs.Pose origin = 10;
}
