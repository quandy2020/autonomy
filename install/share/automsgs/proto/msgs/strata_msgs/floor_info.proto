syntax = "proto3";

package automsgs.msgs.strata_msgs;

import "automsgs/msgs/std_msgs/header.proto";

message FloorInfo {
    string id = 1;
    string name = 2;
    int32 level = 3;
    string slam_image_path = 4;
    double start_x = 5;
    double start_y = 6;
    int32 x_grid_count = 7;
    int32 y_grid_count = 8;
    double resolution = 9;
}

message FloorInfoArray {
    std_msgs.Header header = 1;
    repeated FloorInfo floors = 2;
    string active_floor_id = 3;
}
