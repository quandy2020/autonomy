syntax = "proto3";

package automsgs.msgs.strata_msgs;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/geometry_msgs/point.proto";

message LabelBubble {
    std_msgs.Header header = 1;
    geometry_msgs.Point lng_lat = 2;
    string html = 3;
    float offset_x = 4;
    float offset_y = 5;
    bool visible = 6;
}

message LabelBubbleArray {
    std_msgs.Header header = 1;
    repeated LabelBubble bubbles = 2;
}
