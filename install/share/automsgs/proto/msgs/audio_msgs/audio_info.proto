syntax = "proto3";

package automsgs.msgs.audio_msgs;

// Generic audio stream metadata (ROS audio_common_msgs / Foxglove RawAudio style).
// Domain-specific mic-array / siren types live under autonomy/audio/proto.
message AudioInfo {
  // Number of interleaved channels in the accompanying PCM buffer.
  uint32 channels = 1;
  // Sampling rate [Hz].
  uint32 sample_rate = 2;
  // Sample format string (e.g. "S16LE", "F32LE").
  string sample_format = 3;
  // Nominal bitrate [bits/s]; 0 if unknown / uncompressed PCM.
  uint32 bitrate = 4;
  // Coding / container format (e.g. "PCM", "WAVE", "MP3").
  string coding_format = 5;
}
