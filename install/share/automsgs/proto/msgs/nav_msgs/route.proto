syntax = "proto3";

package automsgs.msgs.nav_msgs;

import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/std_msgs/header.proto";

message EdgeCost {
  uint32 edgeid = 1;
  float cost = 2;
}

message RouteNode {
  uint32 nodeid = 1;
  automsgs.msgs.geometry_msgs.Point position = 2;
}

message RouteEdge {
  uint32 edgeid = 1;
  automsgs.msgs.geometry_msgs.Point start = 2;
  automsgs.msgs.geometry_msgs.Point end = 3;
}

message Route {
  automsgs.msgs.std_msgs.Header header = 1;
  float route_cost = 2;
  repeated RouteNode nodes = 3;
  repeated RouteEdge edges = 4;
}
