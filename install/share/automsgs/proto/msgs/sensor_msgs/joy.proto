syntax = "proto3";

package automsgs.msgs.sensor_msgs;

import "automsgs/msgs/std_msgs/header.proto";

// Reports the state of a joystick's axes and buttons.
message Joy {
  // Time at which data is received from the joystick.
  automsgs.msgs.std_msgs.Header header = 1;

  // Axes measurements from a joystick.
  repeated float axes = 2;

  // Button measurements from a joystick.
  repeated int32 buttons = 3;
}
