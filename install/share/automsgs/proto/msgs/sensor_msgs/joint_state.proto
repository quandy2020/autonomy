syntax = "proto3";

package automsgs.msgs.sensor_msgs;

import "automsgs/msgs/std_msgs/header.proto";

// State of a set of torque-controlled joints.
message JointState {
  automsgs.msgs.std_msgs.Header header = 1;

  repeated string name = 2;
  repeated double position = 3;
  repeated double velocity = 4;
  repeated double effort = 5;
}

