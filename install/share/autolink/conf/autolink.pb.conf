#
# Default: INTRA (same proc) + SHM (diff proc / diff host).
# Cross-host Channel requires AUTOLINK_ENABLE_FASTDDS=ON and diff_host: RTPS.
# participant_attr / AUTOLINK_DOMAIN_ID apply only when FastDDS RTPS is enabled.
transport_conf {
  participant_attr {
    lease_duration: 12
    announcement_period: 3
    domain_id_gain: 200
    port_base: 10000
  }
  communication_mode {
    same_proc: INTRA
    diff_proc: SHM
    diff_host: SHM
  }
  resource_limit {
    max_history_depth: 1000
  }
  shm_conf {
    notifier_type: "condition"
    shm_type: "xsi"
    arena_shm_conf {
      arena_channel_conf {
        channel_name: "/autolink/msg"
        max_msg_size: 33554432
        max_pool_size: 32
      }
    }
  }
}

run_mode_conf {
    run_mode: MODE_REALITY
    clock_mode: MODE_AUTOLINK
}

scheduler_conf {
    routine_num: 100
    default_proc_num: 16
}
