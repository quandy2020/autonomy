---
- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ autonomy_config_dir }}"
    state: directory
    owner: root
    group: "{{ autonomy_user }}"
    mode: "0750"
  become: true

- name: Copy runtime configuration (build mode)
  ansible.builtin.copy:
    src: "{{ autonomy_source_dir }}/config/"
    dest: "{{ autonomy_config_dir }}/"
    remote_src: true
    mode: preserve
  when: autonomy_deploy_mode == 'build'
  become: true
  register: autonomy_config_build
  notify: Restart enabled autonomy services

- name: Stat config bundled inside install prefix (artifact mode)
  ansible.builtin.stat:
    path: "{{ autonomy_install_prefix }}/share/autonomy/config"
  register: autonomy_bundled_config
  when: autonomy_deploy_mode == 'artifact'

- name: Install configuration from artifact bundle
  ansible.builtin.copy:
    src: "{{ autonomy_install_prefix }}/share/autonomy/config/"
    dest: "{{ autonomy_config_dir }}/"
    remote_src: true
    mode: preserve
  when:
    - autonomy_deploy_mode == 'artifact'
    - autonomy_config_from_artifact | bool
    - autonomy_bundled_config.stat.isdir | default(false)
  become: true
  register: autonomy_config_from_bundle
  notify: Restart enabled autonomy services

- name: Sync runtime configuration from control machine (artifact fallback)
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../../config/"
    dest: "{{ autonomy_config_dir }}/"
    delete: true
    rsync_opts:
      - --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r
  when:
    - autonomy_deploy_mode == 'artifact'
    - not (autonomy_config_from_artifact | bool and (autonomy_bundled_config.stat.isdir | default(false)))
  delegate_to: localhost
  become: false
  register: autonomy_config_artifact
  notify: Restart enabled autonomy services

- name: Set config directory ownership
  ansible.builtin.file:
    path: "{{ autonomy_config_dir }}"
    state: directory
    owner: root
    group: "{{ autonomy_user }}"
    mode: "0750"
    recurse: true
  become: true

- name: Set config file and directory modes
  ansible.builtin.shell: |
    set -euo pipefail
    find {{ autonomy_config_dir | quote }} -type d -exec chmod 750 {} +
    find {{ autonomy_config_dir | quote }} -type f -exec chmod 640 {} +
  args:
    executable: /bin/bash
  become: true
