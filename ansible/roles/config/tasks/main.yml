---
- name: Mark the start of live configuration writes for release recovery
  ansible.builtin.set_fact:
    autonomy_rollout_configuration_started: true
  when:
    - autonomy_rollout_transaction | default(false) | bool
    - not ansible_check_mode

- name: Snapshot existing configuration before a real push
  ansible.builtin.include_tasks: push_snapshot.yml
  when:
    - autonomy_play_mode == 'push'
    - not ansible_check_mode

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ autonomy_config_dir }}"
    state: directory
    owner: "{{ 'root' if autonomy_system_install | bool else omit }}"
    group: "{{ autonomy_user if autonomy_system_install | bool else omit }}"
    mode: "0750"
  register: autonomy_config_directory
  become: "{{ autonomy_system_install | bool }}"

- name: Copy component configuration from control machine
  ansible.builtin.copy:
    src: "{{ autonomy_config_source_dir }}/autonomy/{{ item }}/conf/"
    dest: "{{ autonomy_config_dir }}/{{ item }}/"
    owner: "{{ 'root' if autonomy_system_install | bool else omit }}"
    group: "{{ autonomy_user if autonomy_system_install | bool else omit }}"
    mode: "0640"
    directory_mode: "0750"
  loop: "{{ autonomy_config_components }}"
  register: autonomy_config_push
  when: autonomy_play_mode == 'push'
  become: "{{ autonomy_system_install | bool }}"

- name: Copy component configuration from build host
  ansible.builtin.copy:
    src: "{{ autonomy_source_dir }}/autonomy/{{ item }}/conf/"
    dest: "{{ autonomy_config_dir }}/{{ item }}/"
    remote_src: true
    mode: "0750"
    directory_mode: "0750"
  loop: "{{ autonomy_config_components }}"
  register: autonomy_config_build
  when:
    - autonomy_play_mode != 'push'
    - autonomy_deploy_mode == 'build'
  become: "{{ autonomy_system_install | bool }}"

- name: Install configuration bundled with artifact
  ansible.builtin.copy:
    src: "{{ autonomy_install_prefix }}/share/autonomy/config/"
    dest: "{{ autonomy_config_dir }}/"
    remote_src: true
    mode: "0750"
    directory_mode: "0750"
  register: autonomy_config_bundle
  when:
    - autonomy_play_mode != 'push'
    - autonomy_deploy_mode == 'artifact'
    - autonomy_config_from_artifact | bool
  become: "{{ autonomy_system_install | bool }}"

- name: Set config ownership
  ansible.builtin.file:
    path: "{{ autonomy_config_dir }}"
    state: directory
    owner: "{{ 'root' if autonomy_system_install | bool else omit }}"
    group: "{{ autonomy_user if autonomy_system_install | bool else omit }}"
    recurse: true
  register: autonomy_config_owner
  become: "{{ autonomy_system_install | bool }}"

- name: Correct config permissions only when needed
  ansible.builtin.shell: |
    set -euo pipefail
    find {{ autonomy_config_dir | quote }} -type d ! -perm 0750 -print -exec chmod 0750 {} +
    find {{ autonomy_config_dir | quote }} -type f ! -perm 0640 -print -exec chmod 0640 {} +
  args:
    executable: /bin/bash
  register: autonomy_config_permissions
  changed_when: autonomy_config_permissions.stdout | default('') | length > 0
  become: "{{ autonomy_system_install | bool }}"

- name: Report runtime configuration changes
  ansible.builtin.set_fact:
    autonomy_config_changed: >-
      {{ autonomy_config_push.changed | default(false)
         or autonomy_config_build.changed | default(false)
         or autonomy_config_bundle.changed | default(false)
         or autonomy_config_permissions.changed
         or autonomy_config_owner.changed
         or autonomy_config_directory.changed }}

- name: Drop the temporary backup after an unchanged push
  ansible.builtin.file:
    path: "{{ autonomy_push_snapshot.path }}"
    state: absent
  when:
    - autonomy_push_snapshot.path is defined
    - not autonomy_config_changed
  changed_when: false
  become: "{{ autonomy_system_install | bool }}"

- name: Record the configuration restore point
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} configuration snapshot: {{ autonomy_push_snapshot.path }}"
  when:
    - autonomy_push_snapshot.path is defined
    - autonomy_config_changed
