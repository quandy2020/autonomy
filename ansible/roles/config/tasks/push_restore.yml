---
- name: Restore and verify the configuration from immediately before this push
  when:
    - autonomy_play_mode == 'push'
    - not ansible_check_mode
    - autonomy_push_snapshot_copy.rc | default(1) == 0
    - autonomy_config_changed | default(true) | bool
  block:
    - name: Restore the saved configuration
      ansible.builtin.import_role:
        name: openbot.autonomy_ops.artifact
        tasks_from: restore_configuration.yml
      vars:
        autonomy_configuration_snapshot: "{{ autonomy_push_snapshot.path }}"

    - name: Reload the restored configuration on system services
      ansible.builtin.import_role:
        name: openbot.autonomy_ops.services
        tasks_from: restart.yml
      when: autonomy_system_install | bool and autonomy_restart_on_config_change | bool

    - name: Verify the restored configuration is healthy
      ansible.builtin.import_role:
        name: openbot.autonomy_ops.services
        tasks_from: verify.yml

    - name: Record the successful configuration recovery
      ansible.builtin.set_fact:
        autonomy_push_recovered: true

- name: Stop maintenance after a failure
  ansible.builtin.fail:
    msg: >-
      Maintenance failed on {{ inventory_hostname }}.
      {% if autonomy_push_recovered | default(false) %}
      Previous configuration restored and checked. Failed configuration: {{ autonomy_push_snapshot.path }}/failed-config.
      {% endif %}
