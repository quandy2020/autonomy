---
- name: Require C and C++ source style before configuring or building
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"
      - "{{ autonomy_source_dir }}/tools/python/clang_format_sources.py"
      - --check
  changed_when: false

- name: Install ccache when enabled
  ansible.builtin.apt:
    name: ccache
    state: present
    lock_timeout: "{{ autonomy_apt_lock_timeout }}"
  when:
    - autonomy_use_ccache | bool
    - autonomy_system_install | bool
  become: true

- name: Resolve the isolated build directory for the requested modules
  ansible.builtin.set_fact:
    autonomy_build_selection: "{{ autonomy_build_modules | unique | sort | join(';') }}"

- name: Select the CMake build directory
  ansible.builtin.set_fact:
    autonomy_effective_build_dir: >-
      {{ autonomy_cmake_build_dir ~ '/.modules/' ~ (autonomy_build_selection | hash('sha256'))
         if autonomy_build_selection | length > 0 else autonomy_cmake_build_dir }}

- name: Create build and cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ [autonomy_effective_build_dir] + ([autonomy_ccache_dir] if autonomy_use_ccache | bool else []) }}"

- name: Resolve configure arguments
  ansible.builtin.set_fact:
    autonomy_configure_argv: >-
      {{ ['cmake', '-S', autonomy_source_dir, '-B', autonomy_effective_build_dir,
          '-DCMAKE_BUILD_TYPE=' ~ autonomy_cmake_build_type,
          '-DCMAKE_INSTALL_PREFIX=' ~ autonomy_install_prefix,
          '-DBUILD_GRPC=' ~ (autonomy_build_grpc | bool | ternary('ON', 'OFF')),
          '-DBUILD_TEST=' ~ (autonomy_build_test | bool | ternary('ON', 'OFF')),
          '-DCMAKE_C_COMPILER_LAUNCHER=' ~ (autonomy_use_ccache | bool | ternary('ccache', '')),
          '-DCMAKE_CXX_COMPILER_LAUNCHER=' ~ (autonomy_use_ccache | bool | ternary('ccache', ''))]
         + autonomy_cmake_extra_args + ['-DAUTONOMY_BUILD_MODULES=' ~ autonomy_build_selection] }}

- name: Check existing CMake cache
  ansible.builtin.stat:
    path: "{{ autonomy_effective_build_dir }}/CMakeCache.txt"
  register: autonomy_build_cache

- name: Check recorded configure arguments
  ansible.builtin.stat:
    path: "{{ autonomy_effective_build_dir }}/.ansible-configure-args.json"
  register: autonomy_configure_stamp

- name: Read previous configure arguments
  ansible.builtin.slurp:
    src: "{{ autonomy_effective_build_dir }}/.ansible-configure-args.json"
  register: autonomy_previous_configure
  when: autonomy_configure_stamp.stat.exists

- name: Configure autonomy when cache or requested options changed
  ansible.builtin.command:
    argv: "{{ autonomy_configure_argv }}"
  environment:
    CCACHE_DIR: "{{ autonomy_ccache_dir }}"
  changed_when: true
  register: autonomy_cmake_configure
  when: >-
    not autonomy_build_cache.stat.exists or not autonomy_configure_stamp.stat.exists
    or (autonomy_previous_configure.content | default('') | b64decode)
       != (autonomy_configure_argv | to_json)

- name: Record successful configure arguments
  ansible.builtin.copy:
    content: "{{ autonomy_configure_argv | to_json }}"
    dest: "{{ autonomy_effective_build_dir }}/.ansible-configure-args.json"
    mode: "0644"

- name: Build autonomy
  ansible.builtin.command:
    argv: [cmake, --build, "{{ autonomy_effective_build_dir }}", --parallel, "{{ autonomy_cmake_jobs | string }}"]
  environment:
    CCACHE_DIR: "{{ autonomy_ccache_dir }}"
  register: autonomy_cmake_build
  changed_when: >-
    'Building ' in autonomy_cmake_build.stdout or 'Linking ' in autonomy_cmake_build.stdout
    or 'Generating ' in autonomy_cmake_build.stdout

- name: Run build tests when requested
  ansible.builtin.command:
    argv: [ctest, --test-dir, "{{ autonomy_effective_build_dir }}", --output-on-failure, --no-tests=error]
  when: autonomy_build_test | bool
  changed_when: false

- name: Report the selected module build output
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} build output: {{ autonomy_effective_build_dir }}"
  when: autonomy_build_modules | length > 0

- name: Check install prefix before writing a local build
  ansible.builtin.stat:
    path: "{{ autonomy_install_prefix }}"
    follow: false
  register: autonomy_build_prefix
  when: not autonomy_build_modules

- name: Protect immutable artifact releases from build installs
  ansible.builtin.assert:
    that:
      - not (autonomy_build_prefix.stat.islnk | default(false))
    fail_msg: "Build install prefix points to an artifact release. Use a separate build install prefix."
  when: not autonomy_build_modules

- name: Install autonomy build
  ansible.builtin.command:
    argv: [cmake, --install, "{{ autonomy_effective_build_dir }}"]
  register: autonomy_cmake_install
  changed_when: "'-- Installing:' in autonomy_cmake_install.stdout"
  become: "{{ autonomy_system_install | bool }}"
  when: not autonomy_build_modules
