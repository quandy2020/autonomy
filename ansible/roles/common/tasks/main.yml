---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ autonomy_apt_cache_valid_time }}"
    lock_timeout: "{{ autonomy_apt_lock_timeout }}"
  become: true
  register: autonomy_apt_cache
  retries: "{{ autonomy_apt_update_retries }}"
  delay: "{{ autonomy_apt_update_retry_delay }}"
  until: autonomy_apt_cache is succeeded

- name: Install base packages for deployment
  ansible.builtin.apt:
    name: "{{ autonomy_base_packages }}"
    state: present
  become: true

- name: Create autonomy group
  ansible.builtin.group:
    name: "{{ autonomy_user }}"
    system: true
  become: true

- name: Create autonomy user
  ansible.builtin.user:
    name: "{{ autonomy_user }}"
    group: "{{ autonomy_user }}"
    groups: "{{ autonomy_supplementary_groups }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ autonomy_data_dir }}"
    create_home: false
  become: true

- name: Ensure runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(autonomy_user) }}"
    group: "{{ item.group | default(autonomy_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "{{ autonomy_install_prefix }}"
    - path: "{{ autonomy_data_dir }}"
    - path: "{{ autonomy_log_dir }}"
    - path: "{{ autonomy_build_dir }}"
      owner: root
      group: root
      mode: "0755"
  become: true
