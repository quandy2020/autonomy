---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ autonomy_apt_cache_valid_time }}"
    lock_timeout: "{{ autonomy_apt_lock_timeout }}"
  become: true
  register: autonomy_apt_cache
  retries: "{{ autonomy_apt_update_retries }}"
  delay: "{{ autonomy_apt_update_retry_delay }}"
  until: autonomy_apt_cache is succeeded
  when: autonomy_install_dependencies | bool

- name: Install base packages for deployment
  ansible.builtin.apt:
    name: "{{ autonomy_base_packages }}"
    state: present
  become: true
  when: autonomy_install_dependencies | bool

- name: Create autonomy group
  ansible.builtin.group:
    name: "{{ autonomy_user }}"
    system: true
  become: true
  when: autonomy_system_install | bool

- name: Create autonomy user
  ansible.builtin.user:
    name: "{{ autonomy_user }}"
    group: "{{ autonomy_user }}"
    groups: "{{ autonomy_supplementary_groups }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ autonomy_data_dir }}"
    create_home: false
  become: true
  when: autonomy_system_install | bool

- name: Ensure runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ autonomy_user if autonomy_system_install | bool else omit }}"
    group: "{{ autonomy_user if autonomy_system_install | bool else omit }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "{{ autonomy_data_dir }}"
    - path: "{{ autonomy_data_dir }}/.autonomy"
      mode: "0700"
    - path: "{{ autonomy_data_dir }}/.autonomy/config"
      mode: "0700"
    - path: "{{ autonomy_data_dir }}/.autonomy/config/incoming"
      mode: "0700"
    - path: "{{ autonomy_log_dir }}"
    - path: "{{ autonomy_log_dir }}/events"
    - path: "{{ autonomy_data_dir }}/.autonomy/maps"
    - path: "{{ autonomy_data_dir }}/.autonomy/models"
    - path: "{{ autonomy_data_dir }}/.autonomy/records"
    - path: "{{ autonomy_data_dir }}/.autonomy/artifacts"
    - path: "{{ autonomy_data_dir }}/.autonomy/cache"
    - path: "{{ autonomy_data_dir }}/.autonomy/runtime"
      mode: "0700"
  when: autonomy_system_install | bool or item.path != autonomy_data_dir
  become: "{{ autonomy_system_install | bool }}"

- name: Ensure build storage exists
  ansible.builtin.file:
    path: "{{ autonomy_build_dir }}"
    state: directory
    owner: "{{ 'root' if autonomy_system_install | bool else omit }}"
    group: "{{ 'root' if autonomy_system_install | bool else omit }}"
    mode: "0755"
  when: autonomy_deploy_mode == 'build'
  become: "{{ autonomy_system_install | bool }}"
