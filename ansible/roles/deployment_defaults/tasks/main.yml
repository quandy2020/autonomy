---
- name: Validate deployment contract
  ansible.builtin.assert:
    that:
      - autonomy_play_mode in ['full', 'build', 'push', 'check', 'plan', 'verify', 'restart']
      - autonomy_deploy_mode in ['build', 'artifact']
      - autonomy_play_mode != 'build' or autonomy_deploy_mode == 'build'
      - autonomy_services | difference(autonomy_service_name_map.keys() | list) | length == 0
      - autonomy_system_install | bool or not autonomy_install_dependencies | bool
      - >-
        not autonomy_require_ci | bool or autonomy_play_mode in ['check', 'plan', 'verify']
        or lookup('env', 'GITHUB_ACTIONS') == 'true'
      - autonomy_profile != 'production' or use_locked_versions | bool
      - autonomy_profile != 'production' or autonomy_system_install | bool
    fail_msg: >-
      Invalid deployment mode, services or installation policy. User installation requires dependency
      installation disabled; production requires system installation, version locks and approved CI.
    quiet: true

- name: Keep module selection in compile-only modes
  ansible.builtin.assert:
    that:
      - autonomy_build_modules | type_debug == 'list'
      - autonomy_build_modules | reject('match', '^[a-z][a-z0-9_]*(/[a-z][a-z0-9_]*)?$') | list | length == 0
      - >-
        autonomy_build_modules | length == 0 or
        (autonomy_deploy_mode == 'build' and autonomy_play_mode in ['plan', 'build'])
      - autonomy_cmake_extra_args | select('match', '^-DAUTONOMY_BUILD_MODULES[:=]') | list | length == 0
    fail_msg: "Use autonomy_build_modules with build mode for selective compilation."
    quiet: true

- name: Validate the application probe before release changes
  ansible.builtin.assert:
    that:
      - autonomy_health_probe_argv is sequence
      - autonomy_health_probe_argv is not string
      - autonomy_health_probe_argv is not mapping
      - autonomy_health_probe_argv | select('string') | list | length == autonomy_health_probe_argv | length
      - autonomy_health_probe_timeout_seconds | int > 0
      - >-
        not (autonomy_require_health_probe | bool
             or (autonomy_profile == 'production' and autonomy_system_install | bool and autonomy_services | length > 0))
        or autonomy_health_probe_argv | length > 0
    fail_msg: "Configure a bounded, read-only autonomy_health_probe_argv for this release."
    quiet: true
  when:
    - autonomy_play_mode in ['plan', 'verify', 'push', 'restart'] or (autonomy_play_mode == 'full' and autonomy_deploy_mode == 'artifact')

- name: Require one cross profile across the selected release hosts
  ansible.builtin.assert:
    that:
      - (hostvars[item].autonomy_cross_profile | default('')) == autonomy_cross_release_profile
    fail_msg: "{{ item }} must declare autonomy_cross_profile={{ autonomy_cross_release_profile }} in inventory."
    quiet: true
  loop: "{{ ansible_play_hosts_all }}"
  when:
    - autonomy_cross_release_profile is defined
    - inventory_hostname == ansible_play_hosts_all[0]

- name: Load optional controller vault without logging secrets
  ansible.builtin.include_vars:
    file: "{{ autonomy_controller_root }}/inventory/group_vars/vault.yml"
  when: (autonomy_controller_root ~ '/inventory/group_vars/vault.yml') is file
  no_log: true
