---
- name: Validate artifact on the control machine
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/inspect_artifact.py"
      - "{{ autonomy_artifact_path }}"
      - --prefix
      - "{{ autonomy_install_prefix }}"
  register: autonomy_artifact_inspection
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Resolve artifact metadata
  ansible.builtin.set_fact:
    autonomy_artifact_metadata: "{{ autonomy_artifact_inspection.stdout | from_json }}"

- name: Check artifact architecture and expected checksum
  ansible.builtin.assert:
    that:
      - autonomy_artifact_metadata.architecture == ansible_architecture
      - autonomy_expected_git_sha | length == 0 or autonomy_artifact_metadata.git_sha == autonomy_expected_git_sha
      - autonomy_artifact_sha256 | length == 0 or autonomy_artifact_metadata.sha256 == autonomy_artifact_sha256
      - autonomy_install_prefix != '/'
      - autonomy_release_dir != autonomy_install_prefix
      - not autonomy_release_dir.startswith(autonomy_install_prefix ~ '/')
    fail_msg: "Artifact architecture, checksum or install prefix does not match this target."

- name: Verify the target profile and ABI before transferring a cross artifact
  when: autonomy_artifact_metadata.cross_profile is defined
  block:
    - name: Read the target package architecture
      ansible.builtin.command:
        argv: [dpkg, --print-architecture]
      register: autonomy_target_dpkg_arch
      changed_when: false
      check_mode: false

    - name: Match cross artifact metadata against the inventory and target
      ansible.builtin.assert:
        that:
          - (autonomy_cross_profile | default('')) == autonomy_artifact_metadata.cross_profile
          - (ansible_distribution | lower) == autonomy_artifact_metadata.target_os
          - >-
            (ansible_distribution_major_version if ansible_distribution == 'Debian' else ansible_distribution_version)
            == autonomy_artifact_metadata.target_version
          - autonomy_target_dpkg_arch.stdout == autonomy_artifact_metadata.target_dpkg_arch
        fail_msg: "Cross artifact Profile, OS or package ABI does not match {{ inventory_hostname }}."

- name: Resolve content-addressed release directory
  ansible.builtin.set_fact:
    autonomy_artifact_release: "{{ autonomy_release_dir }}/{{ autonomy_artifact_metadata.sha256 }}"

- name: Ensure release storage exists
  ansible.builtin.file:
    path: "{{ autonomy_release_dir }}"
    state: directory
    owner: "{{ 'root' if autonomy_system_install | bool else omit }}"
    group: "{{ 'root' if autonomy_system_install | bool else omit }}"
    mode: "0755"

- name: Check whether this release is already installed
  ansible.builtin.stat:
    path: "{{ autonomy_artifact_release }}"
  register: autonomy_release_stat

- name: Stage new release without modifying the current install
  when:
    - not autonomy_release_stat.stat.exists
    - not ansible_check_mode
  block:
    - name: Create isolated staging directory on the release filesystem
      ansible.builtin.tempfile:
        state: directory
        path: "{{ autonomy_release_dir }}"
        prefix: .stage-
      register: autonomy_artifact_stage

    - name: Create a clean tree for the new release
      ansible.builtin.file:
        path: "{{ autonomy_artifact_stage.path }}/tree"
        state: directory
        mode: "0700"

    - name: Start with the full artifact as the transfer plan
      ansible.builtin.set_fact:
        autonomy_artifact_wire_sha256: "{{ autonomy_artifact_metadata.sha256 }}"
        autonomy_artifact_delta_used: false

    - name: Inspect the active release link for incremental staging
      ansible.builtin.stat:
        path: "{{ autonomy_install_prefix }}"
        follow: false
      register: autonomy_delta_active
      when: autonomy_artifact_incremental | bool

    - name: Stage a smaller delta from the active managed release
      ansible.builtin.include_tasks: stage_delta.yml
      vars:
        autonomy_incremental_basis: "{{ autonomy_delta_active.stat.lnk_source | default('') }}"
      when:
        - autonomy_artifact_incremental | bool
        - autonomy_delta_active.stat.islnk | default(false)
        - (autonomy_incremental_basis | dirname) == autonomy_release_dir
        - (autonomy_incremental_basis | basename) is match('^[0-9a-f]{64}$')

    - name: Copy artifact into isolated staging directory
      ansible.builtin.copy:
        src: "{{ autonomy_artifact_path }}"
        dest: "{{ autonomy_artifact_stage.path }}/release.tar.gz"
        mode: "0600"
      when: not autonomy_artifact_delta_used

    - name: Check copied artifact checksum
      ansible.builtin.stat:
        path: "{{ autonomy_artifact_stage.path }}/release.tar.gz"
        checksum_algorithm: sha256
      register: autonomy_copied_artifact

    - name: Require the expected archive after transfer
      ansible.builtin.assert:
        that:
          - autonomy_copied_artifact.stat.checksum == autonomy_artifact_wire_sha256

    - name: Extract artifact into isolated staging directory
      ansible.builtin.unarchive:
        src: "{{ autonomy_artifact_stage.path }}/release.tar.gz"
        dest: "{{ autonomy_artifact_stage.path }}/tree"
        remote_src: true
        owner: "{{ 'root' if autonomy_system_install | bool else omit }}"
        group: "{{ 'root' if autonomy_system_install | bool else omit }}"

    - name: Check required executables before activating release
      ansible.builtin.stat:
        path: "{{ autonomy_artifact_stage.path }}/tree/{{ autonomy_install_prefix | basename }}/bin/{{ autonomy_service_binaries[item] }}"
      loop: "{{ autonomy_services }}"
      register: autonomy_staged_binaries

    - name: Require selected service binaries in release
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.executable | default(false)
        fail_msg: "Artifact is missing the executable for {{ item.item }}."
      loop: "{{ autonomy_staged_binaries.results }}"

    - name: Publish complete release directory
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "{{ autonomy_artifact_stage.path }}/tree/{{ autonomy_install_prefix | basename }}"
          - "{{ autonomy_artifact_release }}"
        creates: "{{ autonomy_artifact_release }}"
      changed_when: true
  always:
    - name: Remove temporary staging directory
      ansible.builtin.file:
        path: "{{ autonomy_artifact_stage.path }}"
        state: absent
      when: autonomy_artifact_stage.path is defined

- name: Inspect current install without following its link
  ansible.builtin.stat:
    path: "{{ autonomy_install_prefix }}"
    follow: false
  register: autonomy_current_install

- name: Refuse to overwrite an unrelated install-prefix file
  ansible.builtin.assert:
    that:
      - >-
        not autonomy_current_install.stat.exists
        or autonomy_current_install.stat.isdir | default(false)
        or autonomy_current_install.stat.islnk | default(false)
    fail_msg: "Install prefix must be absent, a directory or a release symlink."

- name: Preserve existing directory installation during first migration
  ansible.builtin.command:
    argv:
      - mv
      - "{{ autonomy_install_prefix }}"
      - "{{ autonomy_release_dir }}/legacy-{{ ansible_date_time.epoch }}"
    creates: "{{ autonomy_release_dir }}/legacy-{{ ansible_date_time.epoch }}"
  when: autonomy_current_install.stat.isdir | default(false)
  changed_when: true

- name: Preserve the preceding release link
  ansible.builtin.file:
    path: "{{ autonomy_install_prefix }}.previous"
    src: >-
      {{ autonomy_current_install.stat.lnk_source
         if autonomy_current_install.stat.islnk | default(false)
         else autonomy_release_dir ~ '/legacy-' ~ ansible_date_time.epoch }}
    state: link
    force: true
    follow: false
  when:
    - autonomy_artifact_backup | bool
    - autonomy_current_install.stat.exists
    - autonomy_current_install.stat.lnk_source | default('') != autonomy_artifact_release

- name: Activate release through the stable install prefix
  ansible.builtin.file:
    path: "{{ autonomy_install_prefix }}"
    src: "{{ autonomy_artifact_release }}"
    state: link
    force: true
    follow: false
  register: autonomy_artifact_activation
  when: not ansible_check_mode
