---
# Controller build settings; target addresses/services remain in inventory/.
container: SpaceHero
workspace: /workspace/autonomy
build_dir: /workspace/autonomy/build/autonomy
build_args: [--packages-up-to, autonomy, --cmake-args, -DBUILD_GRPC=ON, -DAUTONOMY_BUILD_BRIDGE=ON, -DBUILD_TOOLS=ON]
artifact_path: ~/.autonomy/artifacts/autonomy.tar.gz
install_prefix: /opt/autonomy
bundle_runtime: true
