---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: autonomy-ops-test
    image: "${MOLECULE_IMAGE:-jrei/systemd-ubuntu:22.04}"
    privileged: true
    cgroupns_mode: private
    tmpfs:
      - /run
      - /run/lock
    command: /sbin/init
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    converge: "${MOLECULE_CONVERGE_PLAYBOOK:-converge.yml}"
  config_options:
    defaults:
      host_key_checking: false
  inventory:
    group_vars:
      all:
        autonomy_min_free_disk_mb: 64
        autonomy_preflight_strict_os: false
        autonomy_install_dependencies: false
        autonomy_run_verify: true
        autonomy_deploy_mode: artifact
        autonomy_config_from_artifact: true
        autonomy_restart_on_config_change: false
        autonomy_services:
          - task
    host_vars:
      autonomy-ops-test:
        ansible_python_interpreter: /usr/bin/python3

scenario:
  name: default
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
