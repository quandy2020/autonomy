<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autosim · Habitat 机器人</title>
<style>body{margin:0;background:#10151e;color:#e9edf6;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #334055}main{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 80px)}section{padding:16px}img{width:100%;height:calc(100% - 80px);object-fit:contain}aside{overflow:auto;padding:16px;background:#1a2230}label{display:block;padding:12px 0;border-bottom:1px solid #334055}input[type=range]{width:100%}input[type=number]{width:96px;background:#10151e;color:white;border:1px solid #55647c;padding:5px}button{background:#487bed;color:white;border:0;border-radius:5px;padding:8px 14px;cursor:pointer}small{color:#a5b3c9}#error{color:#ff9797}h2{font-size:17px;margin:5px 0 12px}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}img{height:55vh}aside{max-height:70vh}}</style>
<header><b>Autosim · Habitat-Sim</b>　<select id="profile" aria-label="机器人型号"></select>　<button id="reset">重置姿态</button>　<span id="error"></span></header><main><section><img id="frame" alt="Habitat 渲染"><div>视角 <input id="azimuth" type="range" min="-180" max="180" value="140">仰角 <input id="elevation" type="range" min="-70" max="70" value="15">距离 <input id="distance" type="number" min="0.1" step="0.2"></div></section><aside><h2>关节自由度</h2><small>旋转单位 rad，移动单位 m。滑块和数值输入均可控制；从动关节跟随源关节。</small><div id="joints"></div></aside></main>
<script>
const $=id=>document.getElementById(id);let busy=false,queued=null;
async function command(body){if(busy){queued={...queued,...body,joints:{...queued?.joints,...body.joints},camera:{...queued?.camera,...body.camera}};return}busy=true;try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();$('error').textContent=x.error||''}catch(e){$('error').textContent=String(e)}finally{busy=false;if(queued){let p=queued;queued=null;command(p)}}}
$('reset').onclick=()=>command({reset:true});$('profile').onchange=()=>command({profile:$('profile').value});for(const key of ['azimuth','elevation','distance'])$(key).oninput=()=>command({camera:{[key]:Number($(key).value)*(key==='distance'?1:Math.PI/180)}});
const controls=new Map();let initialized=false,profile='';
async function state(){try{const s=await(await fetch('/api/robot-state?t='+Date.now())).json();if(!s.joints)return;if(profile!==s.profile){profile=s.profile;controls.clear();$('joints').replaceChildren();$('profile').replaceChildren(...s.profiles.map(n=>{const o=document.createElement('option');o.value=o.textContent=n;return o}));$('profile').value=s.profile;initialized=false}if(!initialized){$('distance').value=s.camera.distance.toFixed(2);$('azimuth').value=s.camera.azimuth*180/Math.PI;$('elevation').value=s.camera.elevation*180/Math.PI;initialized=true}for(const j of s.joints){if(!controls.has(j.name)){const row=document.createElement('label'),name=document.createElement('div'),range=document.createElement('input'),value=document.createElement('input'),info=document.createElement('small');name.textContent=j.name;range.type='range';range.min=j.lower??-Math.PI;range.max=j.upper??Math.PI;range.step='0.001';value.type='number';value.step='0.01';if(j.lower!==null)value.min=j.lower;if(j.upper!==null)value.max=j.upper;info.textContent=j.mimic?' 跟随 '+j.mimic:' '+j.type;const locked=j.lower!==null&&j.lower===j.upper;range.disabled=value.disabled=!!j.mimic||locked;if(locked)info.textContent=' 上游限位锁定';range.oninput=()=>{value.value=range.value;command({joints:{[j.name]:Number(range.value)}})};value.onchange=()=>command({joints:{[j.name]:Number(value.value)}});row.append(name,range,value,info);$('joints').append(row);controls.set(j.name,{range,value})}const c=controls.get(j.name);if(document.activeElement!==c.range)c.range.value=j.position;if(document.activeElement!==c.value)c.value.value=j.position.toFixed(4)}}catch(e){$('error').textContent=String(e)}}
async function frame(){try{const r=await fetch('/frame'),blob=await r.blob();if(blob.size){const old=$('frame').dataset.url,url=URL.createObjectURL(blob);$('frame').src=url;$('frame').dataset.url=url;if(old)URL.revokeObjectURL(old)}}catch(e){}setTimeout(frame,100)}frame();state();setInterval(state,500);
</script></html>
