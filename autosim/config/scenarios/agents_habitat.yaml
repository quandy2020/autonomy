# Habitat pedestrians for MP3D (map frame, meters).
# With scenario.pedestrian.wander + spread_spawn, start poses are re-seeded onto
# separated navmesh points and goals become far random navigable targets.
# behavior: regular | impassive | surprised | scared | curious | threatening
agents:
  - id: 1
    pose: {x: -3.2, y: 0.5, yaw: 0.0}
    radius: 0.22
    height: 1.7
    speed: 0.72
    behavior: regular
    skin: 1
    goal_tolerance: 0.55
    cyclic_goals: true
    goals:
