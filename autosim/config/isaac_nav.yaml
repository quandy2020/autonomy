#
# Isaac Sim (USD) backend. Same autolink channels as Habitat; requires Isaac Sim.
#
# Ground-nav / SLAM sensor stack (differential drive): no HuNav service, no
# joint states, and a slightly taller robot for the map inflate.
#
#   CONFIG=src/autonomy/autosim/config/isaac_nav.yaml src/autonomy/autosim/scripts/run.sh sim

extends: isaac.yaml

habitat:
  isaac:
    traffic:
      # Empty = discover People assets; isaac.yaml pins the usd/people paths.
      animation_root: ""
      character_root: ""
  # isaac.yaml exposes the HuNav service; nav runs without it.
  hunav:
    service: false
    publish_agents: false
  map:
    mesh_inflate_m: 0.12
    robot_height_m: 0.35
  sensors:
    joint_states:
      enabled: false
