# Fake backend navigation: smaller 12×12 world, tiny RGB-D and IMU on.
extends: fake.yaml

habitat:
  scenario:
    x_length: 12
    y_length: 12
    obstacle_number: 40
  sensors:
    camera:
      enabled: true
      width: 160
      height: 120
      depth_points_stride: 1
    imu:
      enabled: true
