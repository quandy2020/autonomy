# Shared defaults for the Habitat robot previews.
# A robot file starts with `extends: _base.yaml` and overrides only what differs.
habitat:
  backend: habitat
  mode: nav
  path: ""  # Optional scene GLB; empty opens the robot in an empty scene.
  gpu: 0
  spawn: [0.0, 0.0, 0.0]
  # Studio floor for the empty-scene preview (ignored when path is set).
  scenario:
    enabled: true
    type: floor
    x_length: 24.0
    y_length: 24.0
    z_length: 0.2
    resolution: 0.1
    spawn_radius: 1.0
    spawn_height: 1.5
  render:
    enable_hbao: true
    # Neutral backdrop: an empty studio otherwise renders the sky as black.
    clear_color: [0.55, 0.57, 0.60, 1.0]
  robot:
    instance: true
    fixed_base: true
    max_linear_accel: 0.8
    max_linear_decel: 1.2
    max_angular_accel: 2.0
    block_motion: true
    map_frame: map
    control_hz: 50.0
    watchdog_sec: 0.5
    cmd_vel: /cmd_vel
    joint_command:
      enabled: true
      channel: /joint_commands
    tf:
      enabled: true
      channel: /tf
      static_channel: /tf_static
      publish_map_odom: true
    clock:
      enabled: true
      channel: /clock
  sensors:
    lidar_2d:
      enabled: true
      channel: /scan
      frame: laser_link
      num_beams: 360
      angle_min: -3.14159
      angle_max: 3.14159
      range_min: 0.1
      range_max: 30.0
      noise: 0.0
      rate_hz: 10.0
    odom:
      enabled: true
      channel: /odom
      frame: odom
      child_frame: base_footprint
      noise: 0.0
    camera:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 120.0
      rgb_channel: /camera/rgb/image_raw
      depth_channel: /camera/depth/image_raw
      info_channel: /camera/camera_info
      follow_urdf: true
      rate_hz: 10.0
    imu:
      enabled: true
      channel: /imu/data
      rate_hz: 50.0
      noise:
        gyro: 0.0
        accel: 0.0
    joint_states:
      enabled: true
      channel: /joint_states
    chase:
      enabled: true
      clear_color: [0.3, 0.34, 0.4, 1.0]
      width: 640
      height: 480
      distance_m: 3.0
      height_m: 2.0
      look_at_height_m: 0.8
      rate_hz: 10.0
