# TurtleBot3 Burger: /cmd_vel differential drive with the stock sensor rig.
extends: _base.yaml
habitat:
  robot:
    profile: turtlebot3_burger
    # base_footprint is the URDF root and already sits on the floor.
    root_height: 0.0
    base_link_height: 0.01
    wheel_separation: 0.160
    wheel_radius: 0.033
    max_linear: 0.5
    max_angular: 1.0
  sensors:
    camera:
      hfov_deg: 90.0
      frame: camera_link
      # URDF link axes: x forward, y left, z up (not a ROS optical frame).
      axes: body
    imu:
      frame: imu_link
    chase:
      # Burger is only ~0.19 m tall; keep the camera close enough to read it.
      distance_m: 0.7
      height_m: 0.45
      look_at_height_m: 0.12
