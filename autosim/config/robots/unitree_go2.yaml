# Unitree Go2: /cmd_vel planar motion plus named joint control.
extends: _base.yaml
habitat:
  robot:
    profile: unitree_go2
    max_linear: 2.0
    max_angular: 2.0
  sensors:
    odom:
      # URDF root (base); odom_child_frame() falls back to it anyway.
      child_frame: base
    camera:
      frame: front_camera
      # URDF link axes: x forward, y left, z up (not a ROS optical frame).
      axes: body
    imu:
      frame: imu
