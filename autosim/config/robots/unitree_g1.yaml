# Unitree G1: /cmd_vel planar motion plus named joint control.
extends: _base.yaml
habitat:
  robot:
    profile: unitree_g1
    # Arms at the sides: the URDF zero pose holds both forearms straight out.
    joint_positions:
      left_shoulder_pitch_joint: 0.10
      right_shoulder_pitch_joint: 0.10
      left_shoulder_roll_joint: -0.12
      right_shoulder_roll_joint: 0.12
      left_elbow_joint: 1.45
      right_elbow_joint: 1.45
    max_linear: 1.2
    max_angular: 1.5
    joint_command:
      enabled: true
      channel: /joint_commands
      timeout_sec: 1.0
  sensors:
    lidar_2d:
      frame: mid360_link
    odom:
      # URDF root (pelvis); odom_child_frame() falls back to it anyway.
      child_frame: pelvis
    camera:
      hfov_deg: 69.4
      frame: d435_link
      # URDF link axes: x forward, y left, z up (not a ROS optical frame).
      axes: body
    imu:
      frame: imu_in_torso
    joint_states:
      enabled: true
      channel: /joint_states
