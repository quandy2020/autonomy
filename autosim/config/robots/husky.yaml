# Husky: /cmd_vel differential drive with the stock sensor rig.
extends: _base.yaml
habitat:
  robot:
    profile: husky
    # base_footprint is the URDF root and already sits on the floor.
    root_height: 0.0
    base_link_height: 0.1651
    wheel_separation: 0.512
    wheel_radius: 0.1651
    max_linear: 1.0
    max_angular: 1.5
  sensors:
    camera:
      hfov_deg: 90.0
      frame: camera_link
      # URDF link axes: x forward, y left, z up (not a ROS optical frame).
      axes: body
    imu:
      frame: imu_link
    chase:
      distance_m: 2.6
      height_m: 1.6
      look_at_height_m: 0.5
