# Habitat URDF model: /cmd_vel planar motion plus named joint control.
habitat:
  backend: habitat
  mode: nav
  path: ""  # Optional scene GLB; empty opens the robot in an empty scene.
  gpu: 0
  spawn: [0.0, 0.0, 0.0]
  # Studio floor for the empty-scene preview (ignored when path is set).
  scenario:
    enabled: true
    type: floor
    x_length: 8.0
    y_length: 8.0
    z_length: 0.2
    resolution: 0.1
    spawn_radius: 1.0
    spawn_height: 1.5
  render:
    enable_hbao: true
  robot:
    profile: google_robot
    instance: true
    fixed_base: true
    # Arm hanging down with a slight elbow bend: the URDF zero pose points
    # straight up, and a straight arm would reach through the floor.
    joint_positions:
      joint_shoulder: 3.0
      joint_bicep: 0.0
      joint_elbow: -0.9
      joint_wrist: 0.0
      joint_finger_right: 0.6
      joint_finger_left: 0.6
    max_linear: 0.5
    max_angular: 1.0
    max_linear_accel: 0.8
    max_linear_decel: 1.2
    max_angular_accel: 2.0
    block_motion: true
    map_frame: map
    control_hz: 50.0
    watchdog_sec: 0.5
    cmd_vel: /cmd_vel
    joint_command:
      enabled: true
      channel: /joint_commands
    tf:
      enabled: true
      channel: /tf
      static_channel: /tf_static
      publish_map_odom: true
    clock:
      enabled: true
      channel: /clock
  sensors:
    odom:
      enabled: true
      channel: /odom
      frame: odom
      child_frame: base_link
      noise: 0.0
    camera:
      enabled: true
      width: 640
      height: 480
      rgb_channel: /camera/rgb/image_raw
      depth_channel: /camera/depth/image_raw
      info_channel: /camera/camera_info
      frame: camera_center_optical_frame
      follow_urdf: true
      rate_hz: 10.0
    stereo:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 60.0
      rate_hz: 15.0
      baseline_m: 0.124
      left_frame: camera_left_optical_frame
      right_frame: camera_right_optical_frame
    imu:
      enabled: true
      channel: /imu/data
      frame: imu.base
      rate_hz: 50.0
      noise:
        gyro: 0.0
        accel: 0.0
    range:
      enabled: true
      rate_hz: 10.0
      min_range: 0.02
      max_range: 4.0
      fov: 0.0349
      sensors:
        time_of_flight.right_1: /tof/right_1
        time_of_flight.right_2: /tof/right_2
        time_of_flight.right_back_1: /tof/right_back_1
        time_of_flight.right_back_2: /tof/right_back_2
        time_of_flight.left_1: /tof/left_1
        time_of_flight.left_2: /tof/left_2
        time_of_flight.left_back_1: /tof/left_back_1
        time_of_flight.left_back_2: /tof/left_back_2
        cliff.rear_right:
          channel: /cliff/rear_right
          max_range: 0.5
          min_range: 0.01
        cliff.rear_left:
          channel: /cliff/rear_left
          max_range: 0.5
          min_range: 0.01
    joint_states:
      enabled: true
      channel: /joint_states
    chase:
      enabled: true
      clear_color: [0.3, 0.34, 0.4, 1.0]
      width: 640
      height: 480
      distance_m: 3.0
      height_m: 2.0
      look_at_height_m: 0.8
      rate_hz: 10.0
