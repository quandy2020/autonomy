# Google Robot: /cmd_vel planar motion plus named joint control.
extends: _base.yaml
habitat:
  robot:
    profile: google_robot
    # Arm hanging down with a slight elbow bend: the URDF zero pose points
    # straight up, and a straight arm would reach through the floor.
    joint_positions:
      joint_shoulder: 3.0
      joint_bicep: 0.0
      joint_elbow: -0.9
      joint_wrist: 0.0
      joint_finger_right: 0.6
      joint_finger_left: 0.6
    max_linear: 0.5
    max_angular: 1.0
  sensors:
    lidar_2d:
      # The Google robot carries RGB-D, stereo, IMU, ToF and cliff beams.
      enabled: false
    odom:
      # URDF root (link_base); odom_child_frame() falls back to it anyway.
      child_frame: link_base
    camera:
      frame: camera_center_optical_frame
    stereo:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 60.0
      rate_hz: 15.0
      baseline_m: 0.124
      left_frame: camera_left_optical_frame
      right_frame: camera_right_optical_frame
    imu:
      frame: imu.base
    range:
      enabled: true
      rate_hz: 10.0
      min_range: 0.02
      max_range: 4.0
      # ToF emitters light up a spot, not a line: nine rays inside 6° keep a
      # thin chair leg from slipping between beams. The reported fov follows
      # cone_deg unless an entry overrides it.
      cone_deg: 6.0
      samples: 9
      sensors:
        time_of_flight.right_1: /tof/right_1
        time_of_flight.right_2: /tof/right_2
        time_of_flight.right_back_1: /tof/right_back_1
        time_of_flight.right_back_2: /tof/right_back_2
        time_of_flight.left_1: /tof/left_1
        time_of_flight.left_2: /tof/left_2
        time_of_flight.left_back_1: /tof/left_back_1
        time_of_flight.left_back_2: /tof/left_back_2
        cliff.rear_right:
          channel: /cliff/rear_right
          max_range: 0.5
          min_range: 0.01
          cone_deg: 0.0
          fov: 0.0349
        cliff.rear_left:
          channel: /cliff/rear_left
          max_range: 0.5
          min_range: 0.01
          cone_deg: 0.0
          fov: 0.0349
