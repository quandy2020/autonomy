habitat:
  # --- Scene loading (two modes, mirrors autonomy_ros habitat/sim.py) ---
  #
  # Mode 1 (preferred): MP3D dataset config + scene_id.
  #   dataset_config: path to mp3d.scene_dataset_config.json
  #   scene_id:       scene asset relative to dataset config, e.g. 17DRP5sb8fy/17DRP5sb8fy.glb
  #   Enables semantic mesh loading (required for semantic sensor / colored PLY).
  #
  # dataset_config: /media/quandy/0d708864-2623-44e1-8e26-435b41edea21/datasets/habitat/mp3d/mp3d/mp3d.scene_dataset_config.json
  # scene_id: 17DRP5sb8fy/17DRP5sb8fy.glb
  #
  # Mode 2 (legacy): direct .glb path.
  path: /workspace/autonomy/src/17DRP5sb8fy/17DRP5sb8fy.glb
  spawn: [0.0, 0.0, 0.0]  # x, y, yaw
  gpu: 0

  robot:
    urdf: urdf/turtlebot3_burger.urdf   # empty = no URDF; path relative to autosim/
    max_linear: 0.5
    max_angular: 1.0
    wheel_separation: 0.55  # m; used for odom yaw-noise scale
    map_frame: map
    base_link_height: 0.01   # odom→base_footprint z (matches autonomy_ros)
    watchdog_sec: 0.5
    control_hz: 50.0
    cmd_vel: /cmd_vel
    truth:
      enabled: false
      channel: /gt/pose
    tf:
      enabled: true
      channel: /tf
      static_channel: /tf_static
    clock:
      enabled: true
      channel: /clock
    footprint:
      enabled: true
      channel: /footprint
      frame: base_footprint

  sensors:
    lidar_2d:
      enabled: true
      channel: /scan
      frame: laser_link
      rate_hz: 10.0
      angle_min: -3.14159
      angle_max: 3.14159
      range_min: 0.1
      range_max: 30.0
      num_beams: 360
      noise: 0.01          # Gaussian σ on range (m)

    lidar_3d:
      enabled: false
      channel: /points
      frame: lidar_link
      rate_hz: 10.0
      horizontal:
        angle_min: -3.14159
        angle_max: 3.14159
        num_beams: 360
      vertical:
        angle_min: -0.26
        angle_max: 0.26
        num_rings: 16
      range_min: 0.1
      range_max: 30.0
      noise: 0.015         # Gaussian σ on radial range (m)

    camera:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 90.0       # horizontal FOV → CameraInfo K
      sensor_height: 0.6   # Habitat agent camera Y (matches autonomy_ros sensor_height)
      rgb_channel: /camera/rgb/image_raw
      depth_channel: /camera/depth/image_raw
      info_channel: /camera/camera_info
      frame: camera_link
      rate_hz: 15.0        # Habitat render ~20-40ms/frame; 30Hz overloads sensor worker
      noise:
        depth: 0.0         # Gaussian σ on valid depth (m); 0 = clean sim image

    imu:
      enabled: true
      channel: /imu
      frame: imu_link
      rate_hz: 200.0
      noise:
        gyro: 0.01         # Gaussian σ on ω_z (rad/s)
        accel: 0.05        # Gaussian σ on a_x / a_y (m/s²)
        gyro_bias: 0.001   # constant bias draw at start (rad/s)
        accel_bias: 0.01   # constant bias draw at start (m/s²)

    odom:
      enabled: true
      channel: /odom
      frame: odom
      child_frame: base_footprint
      noise: 0.02          # integrated σ scale (m / sqrt(m) on Δs)

  map:
    enabled: true          # MP3D scene loaded via habitat.path
    frame: map
    rate_hz: 1.0           # OccupancyGrid republish for late subscribers; PLY cloud is sent once
    ply:
      source: /workspace/autonomy/src/17DRP5sb8fy/17DRP5sb8fy_semantic.ply
      channel: /overall/map
      stride: 1            # no downsampling; use autoviz Decimate to thin on the viewer side
    grid:                  # height-slice + free-space carve → OccupancyGrid
      channel: /map
      resolution: 0.05
      z_min: 0.1
      z_max: 2.5
