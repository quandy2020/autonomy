habitat:
  # MP3D root: /media/quandy/0d708864-2623-44e1-8e26-435b41edea21/datasets/habitat/mp3d/mp3d
  # Habitat-sim loads a scene .glb (sibling folders are other MP3D houses).
  path: /media/quandy/0d708864-2623-44e1-8e26-435b41edea21/datasets/habitat/mp3d/mp3d/QUCTc6BB5sX/QUCTc6BB5sX.glb
  spawn: [0.0, 0.0, 0.0]  # x, y, yaw
  gpu: 0

  robot:
    urdf: urdf/turtlebot3_burger.urdf   # empty = no URDF; path relative to autosim/
    max_linear: 0.5
    max_angular: 1.0
    wheel_separation: 0.55  # m; used for odom yaw-noise scale
    map_frame: map
    watchdog_sec: 0.5
    control_hz: 50.0
    cmd_vel: /cmd_vel
    truth:
      enabled: false
      channel: /gt/pose
    tf:
      enabled: true
      channel: /tf
      static_channel: /tf_static
    clock:
      enabled: true
      channel: /clock
    footprint:
      enabled: true
      channel: /footprint
      frame: base_footprint

  sensors:
    lidar_2d:
      enabled: true
      channel: /scan
      frame: laser_link
      rate_hz: 10.0
      angle_min: -3.14159
      angle_max: 3.14159
      range_min: 0.1
      range_max: 30.0
      num_beams: 360
      noise: 0.01          # Gaussian σ on range (m)

    lidar_3d:
      enabled: false
      channel: /points
      frame: lidar_link
      rate_hz: 10.0
      horizontal:
        angle_min: -3.14159
        angle_max: 3.14159
        num_beams: 360
      vertical:
        angle_min: -0.26
        angle_max: 0.26
        num_rings: 16
      range_min: 0.1
      range_max: 30.0
      noise: 0.015         # Gaussian σ on radial range (m)

    camera:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 90.0       # horizontal FOV → CameraInfo K
      rgb_channel: /camera/rgb/image_raw
      depth_channel: /camera/depth/image_raw
      info_channel: /camera/camera_info
      frame: camera_link
      rate_hz: 30.0
      noise:
        depth: 0.0         # Gaussian σ on valid depth (m); 0 = clean sim image

    imu:
      enabled: true
      channel: /imu
      frame: imu_link
      rate_hz: 200.0
      noise:
        gyro: 0.01         # Gaussian σ on ω_z (rad/s)
        accel: 0.05        # Gaussian σ on a_x / a_y (m/s²)
        gyro_bias: 0.001   # constant bias draw at start (rad/s)
        accel_bias: 0.01   # constant bias draw at start (m/s²)

    odom:
      enabled: true
      channel: /odom
      frame: odom
      child_frame: base_footprint
      noise: 0.02          # integrated σ scale (m / sqrt(m) on Δs)

  map:
    enabled: true          # MP3D scene loaded via habitat.path
    frame: map
    rate_hz: 1.0           # periodic republish so late Autoviz subscribers still receive /map
    ply:                   # file XOR channel (at least one)
      file: ""             # empty = no PLY dump; path relative to autosim/
      channel: /map_points # empty = no PointCloud2; e.g. /map/points
      stride: 1            # publish every Nth point (>= 1)
      range_max: 30.0
      horizontal:
        angle_min: -3.14159
        angle_max: 3.14159
        num_beams: 360
      vertical:
        angle_min: -0.5
        angle_max: 0.5
        num_rings: 16
    grid:                  # height-slice + free-space carve → OccupancyGrid
      channel: /map
      resolution: 0.05
      z_min: 0.1
      z_max: 1.8
