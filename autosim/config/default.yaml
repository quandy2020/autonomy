scene:
  backend: minimal   # minimal | habitat
  path: ""           # habitat 时填官方数据集场景路径
  spawn: [0.0, 0.0, 0.0]  # x, y, yaw

robot:
  max_linear: 0.5
  max_angular: 1.0
  wheel_separation: 0.30
  frames:
    base: base_link
    laser: laser_link
    camera: camera_link
    imu: imu_link
    odom: odom
    map: map

rates:
  control_hz: 50.0
  scan_hz: 10.0
  rgb_hz: 15.0
  imu_hz: 100.0

channels:
  cmd_vel: /cmd_vel
  scan: /scan
  rgb: /camera/rgb/image_raw
  depth: /camera/depth/image_raw
  camera_info: /camera/camera_info
  imu: /imu
  odom: /odom
  gt_pose: /gt/pose

noise:
  odom: 0.0
  imu: 0.0
  lidar: 0.0

truth:
  enabled: false

habitat:
  gpu: 0
  width: 640
  height: 480
  headless: true

watchdog_sec: 0.5

lidar:
  angle_min: -3.14159
  angle_max: 3.14159
  range_min: 0.1
  range_max: 30.0
  num_beams: 360
