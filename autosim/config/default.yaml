habitat:
  # slam: Cartographer owns map→odom and /map (autosim: odom→base_link only).
  # nav:  drift-corrected map→odom→base_link so LaserScan matches GT map.
  mode: slam

  # --- Scene loading (two modes, mirrors autonomy_ros habitat/sim.py) ---
  #
  # Mode 1: dataset config must sit beside scene folders (glob */*.glb is relative
  # to that file). Example: /workspace/autonomy/src/mp3d.scene_dataset_config.json
  # dataset_config: /workspace/autonomy/src/mp3d.scene_dataset_config.json
  # scene_id: 8WUmhLawc2A/8WUmhLawc2A.glb
  #
  # Mode 2 (default): direct .glb — auto-installs dataset config in the scene parent.
  path: /workspace/autonomy/src/17DRP5sb8fy/17DRP5sb8fy.glb
  # MP3D origin (0,0) often yields a flat semantic field; autosim also auto-relocates on start.
  spawn: [-4.0, 0.18, 0.0]  # x, y, yaw — valid semantic mesh pose for this scene
  gpu: 0

  robot:
    urdf: urdf/turtlebot3_burger.urdf   # empty = no URDF; path relative to autosim/
    max_linear: 0.5
    max_angular: 1.0
    wheel_separation: 0.55  # m; used for odom yaw-noise scale
    map_frame: map
    base_link_height: 0.01   # odom→base_link z
    watchdog_sec: 0.5
    control_hz: 50.0
    cmd_vel: /cmd_vel
    truth:
      enabled: false
      channel: /gt/pose
    tf:
      enabled: true
      channel: /tf
      static_channel: /tf_static
      # Forced true in nav (drift-corrected map→odom so LaserScan matches GT map).
      # Forced false in slam (Cartographer owns map→odom).
      publish_map_odom: false
    clock:
      enabled: true
      channel: /clock
    footprint:
      enabled: true
      channel: /footprint
      frame: base_link

  sensors:
    lidar_2d:
      enabled: true
      channel: /scan
      # Sensor frame: LaserScan is planar (z=0) in this frame; Autoviz height
      # comes from TF base_link→laser_link (~0.17 m on turtlebot3).
      frame: laser_link
      rate_hz: 10.0
      angle_min: -3.14159
      angle_max: 3.14159
      range_min: 0.1
      range_max: 30.0
      num_beams: 360
      noise: 0.0           # no Gaussian range noise (clean sim scan)

    lidar_3d:
      enabled: false
      channel: /points
      frame: lidar_link
      rate_hz: 10.0
      horizontal:
        angle_min: -3.14159
        angle_max: 3.14159
        num_beams: 360
      vertical:
        angle_min: -0.26
        angle_max: 0.26
        num_rings: 16
      range_min: 0.1
      range_max: 30.0
      noise: 0.015         # Gaussian σ on radial range (m)

    camera:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 90.0       # horizontal FOV → CameraInfo K
      sensor_height: 0.6   # Habitat agent camera Y (matches autonomy_ros sensor_height)
      rgb_channel: /camera/rgb/image_raw
      depth_channel: /camera/depth/image_raw
      info_channel: /camera/camera_info
      semantic_enabled: true
      semantic_channel: /camera/semantic/image_raw   # rgb8 colored (Habitat semantic_to_rgb)
      semantic_ids_channel: /camera/semantic/instance_ids  # mono16 ids for Atlas PLP
      frame: camera_link
      rate_hz: 15.0        # Habitat render ~20-40ms/frame; 30Hz overloads sensor worker
      noise:
        depth: 0.0         # Gaussian σ on valid depth (m); 0 = clean sim image

    imu:
      enabled: true
      channel: /imu
      frame: imu_link
      rate_hz: 200.0
      noise:
        gyro: 0.01         # Gaussian σ on ω_z (rad/s)
        accel: 0.05        # Gaussian σ on a_x / a_y (m/s²)
        gyro_bias: 0.001   # constant bias draw at start (rad/s)
        accel_bias: 0.01   # constant bias draw at start (m/s²)

    odom:
      enabled: true
      channel: /odom
      frame: odom
      # Both slam and nav use base_link (nav tree: map→odom→base_link).
      child_frame: base_link
      # Keep 0 in slam so wheel odom matches GT laser rays (runner also glues
      # odom←GT each tick in slam mode). Non-zero only for nav odometry demos.
      noise: 0.0

  map:
    enabled: false          # load PLY → internal occupancy for lidar wall-clip
    publish: false          # nav: publish GT /map; slam mode forces this off
    frame: map
    rate_hz: 1.0           # OccupancyGrid republish for late subscribers; PLY cloud is sent once
    ply:
      source: /workspace/autonomy/src/17DRP5sb8fy/17DRP5sb8fy_semantic.ply
      channel: /overall/map
      stride: 1            # no downsampling; use autoviz Decimate to thin on the viewer side
    grid:                  # height-slice + free-space carve → OccupancyGrid
      channel: /map
      resolution: 0.05
      z_min: 0.1
      z_max: 2.5
