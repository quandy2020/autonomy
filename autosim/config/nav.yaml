# Copyright 2026 The Openbot Authors (duyongquan)
#
# Habitat 导航联调：GT OccupancyGrid `/map` + `/overall/map`，autosim 发 map→odom。
# 场景、传感、TF 与 config/default.yaml 相同；这里只覆盖场景、限速和 chase 视角。
# SLAM 联调用 config/slam.yaml。
#
# 启动（任选其一）：
#   CONFIG=config/nav.yaml src/autonomy/autosim/scripts/run.sh sim
#   CONFIG=src/autonomy/autosim/config/nav.yaml src/autonomy/autosim/scripts/run.sh sim
#
# Autoviz / 任务：见 autosim/README.md 与 autonomy/task。

extends: default.yaml

habitat:
  path: /workspace/autonomy/src/jtcxE69GiFV/jtcxE69GiFV.glb
  robot:
    max_linear: 0.8
    max_angular: 2.2
    tf:
      # nav: drift-corrected map→odom so LaserScan matches the GT map.
      # slam: Cartographer / Atlas owns map→odom (config/slam.yaml).
      publish_map_odom: true
  sensors:
    # Third-person chase RGB (behind/above). Auto-instances the URDF mesh for
    # this view only; ego RGB-D stays unobstructed.
    chase:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 70.0
      distance_m: 1.0
      height_m: 0.85
      look_at_height_m: 0.15
      rate_hz: 10.0
      frame: chase_link
      channel: /camera/chase/image_raw
      info_channel: /camera/chase/camera_info
