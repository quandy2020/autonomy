#
# Atlas RGB-D + IMU validation profile for the Habitat backend.
# Atlas owns map -> odom and publishes the navigation map. Autosim publishes
# synchronized sensor data, odom -> base_footprint, static sensor TF and ground
# truth only.

habitat:
  backend: habitat
  mode: slam

  path: /workspace/autonomy/src/jtcxE69GiFV/jtcxE69GiFV.glb
  spawn: [-4.0, 0.18, 0.0]
  gpu: 0

  robot:
    urdf: robot/turtlebot3_burger/turtlebot3_burger.urdf
    description_channel: /robot_description
    max_linear: 0.5
    max_angular: 1.0
    max_linear_accel: 0.8
    max_linear_decel: 1.2
    max_angular_accel: 2.0
    wheel_separation: 0.55
    map_frame: map
    base_link_height: 0.01
    watchdog_sec: 0.5
    control_hz: 50.0
    cmd_vel: /cmd_vel
    truth:
      enabled: true
      channel: /gt/pose
      odometry_channel: /gt/odometry
    tf:
      enabled: true
      channel: /tf
      static_channel: /tf_static
      publish_map_odom: false
    clock:
      enabled: true
      channel: /clock
    footprint:
      enabled: true
      channel: /footprint
      frame: base_link

  sensors:
    # Disable sensors that Atlas does not consume to keep the render loop
    # deterministic and leave CPU/GPU budget for RGB-D tracking and mapping.
    lidar_2d:
      enabled: false
      channel: /scan
      frame: laser_link
      rate_hz: 10.0
      angle_min: -3.14159
      angle_max: 3.14159
      range_min: 0.1
      range_max: 30.0
      num_beams: 360
      noise: 0.0

    lidar_3d:
      enabled: false
      channel: /points
      frame: lidar_link
      rate_hz: 10.0
      horizontal:
        angle_min: -3.14159
        angle_max: 3.14159
        num_beams: 360
      vertical:
        angle_min: -0.26
        angle_max: 0.26
        num_rings: 16
      range_min: 0.1
      range_max: 30.0
      noise: 0.0
      motion_compensate: true

    camera:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 90.0
      rgb_channel: /camera/rgb/image_raw
      depth_channel: /camera/depth/image_raw
      info_channel: /camera/camera_info
      semantic_enabled: false
      semantic_channel: /camera/semantic/image_raw
      semantic_ids_channel: ""
      frame: camera_optical_frame
      rate_hz: 15.0
      range_min: 0.15
      range_max: 30.0
      noise:
        depth: 0.0

    # Third-person chase RGB (behind/above). Auto-instances the URDF mesh for
    # this view only; ego RGB-D stays unobstructed.
    chase:
      enabled: true
      width: 640
      height: 480
      hfov_deg: 70.0
      distance_m: 1.0
      height_m: 0.85
      look_at_height_m: 0.15
      rate_hz: 10.0
      frame: chase_link
      channel: /camera/chase/image_raw
      info_channel: /camera/chase/camera_info

    imu:
      enabled: true
      channel: /imu
      frame: imu_link
      rate_hz: 200.0
      gravity: 9.80665
      noise:
        gyro: 0.01
        accel: 0.05
        gyro_bias: 0.001
        accel_bias: 0.01

    odom:
      enabled: true
      channel: /odom
      frame: odom
      child_frame: base_footprint
      noise: 0.0

  map:
    # publish: true → GT ``/overall/map`` PointCloud2 for Autoviz.
    # OccupancyGrid ``/map`` stays off in slam (Atlas owns it).
    # Prefer the MP3D semantic PLY (full floorplan). Ray-cast from spawn is
    # occlusion-limited and truncates large houses (range_max / first-hit).
    enabled: true
    publish: true
    frame: map
    rate_hz: 1.0
    ply:
      source: /workspace/autonomy/src/jtcxE69GiFV/jtcxE69GiFV_semantic.ply
      channel: /overall/map
      # ~2.9M verts after grid z-band; stride keeps SHM under 32 MiB.
      stride: 5
    grid:
      channel: /map
      resolution: 0.05
      # Height band shared with Atlas dense map; also filters /overall/map.
      z_min: -1.0
      z_max: 1.5
