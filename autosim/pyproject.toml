[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosim"
version = "0.1.0"
description = "Multi-backend sensor-actuator bridge with LeRobot dataset recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "protobuf>=4.21",
]

[project.optional-dependencies]
habitat = ["habitat-sim>=0.3.0"]
# Isaac Sim is typically provided by the Omniverse / Isaac Kit Python env.
# The extra documents the intended install; omni.* packages are not on PyPI.
isaac = []
dataset = ["pyarrow>=14.0", "opencv-python-headless>=4.8"]
dev = ["pytest>=7.0", "pyarrow>=14.0"]

[project.scripts]
autosim = "autosim.__main__:run"
autosim-teleop = "autosim.bridge.teleop:Teleop.main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autosim*"]

[tool.setuptools.data-files]
"share/autosim/config" = ["config/*.yaml"]
"share/autosim/robot" = ["robot/README.md"]
"share/autosim/robot/turtlebot3_burger" = [
  "robot/turtlebot3_burger/*.urdf",
]
"share/autosim/robot/turtlebot3_burger/meshes" = [
  "robot/turtlebot3_burger/meshes/README.md",
  "robot/turtlebot3_burger/meshes/LICENSE",
]
"share/autosim/robot/turtlebot3_burger/meshes/bases" = [
  "robot/turtlebot3_burger/meshes/bases/*",
]
"share/autosim/robot/turtlebot3_burger/meshes/wheels" = [
  "robot/turtlebot3_burger/meshes/wheels/*",
]
"share/autosim/robot/turtlebot3_burger/meshes/sensors" = [
  "robot/turtlebot3_burger/meshes/sensors/*",
]
"share/autosim/robot/husky" = [
  "robot/husky/*.urdf",
]
"share/autosim/robot/husky/meshes" = [
  "robot/husky/meshes/*",
]
"share/autosim/usd" = [
  "usd/README.md",
  "usd/worlds/simple_room/simple_room.usd",
  "usd/robots/turtlebot3_burger/turtlebot3_burger.usd",
  "usd/robots/husky/husky.usd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
