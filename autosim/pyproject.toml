[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosim"
version = "0.1.0"
description = "Habitat-Sim sensor-actuator bridge for autonomy via autolink/automsgs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "protobuf>=4.21",
]

[project.optional-dependencies]
habitat = ["habitat-sim>=0.3.0"]
# Isaac Sim is typically provided by the Omniverse / Isaac Kit Python env.
# The extra documents the intended install; omni.* packages are not on PyPI.
isaac = []
dev = ["pytest>=7.0"]

[project.scripts]
autosim = "autosim.__main__:run"
autosim-teleop = "autosim.teleop:Teleop.main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autosim*"]

[tool.setuptools.data-files]
"share/autosim/config" = ["config/*.yaml"]
"share/autosim/urdf" = ["urdf/*.urdf", "urdf/*.md"]
"share/autosim/usd" = [
  "usd/README.md",
  "usd/worlds/simple_room/simple_room.usd",
  "usd/robots/turtlebot3_burger/turtlebot3_burger.usd",
  "usd/robots/husky/husky.usd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
