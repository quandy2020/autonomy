    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(797.5368 157.835559)">Work width, turning radius, speed</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(797.5368 171.98677)">Headland, angle, objective, turn type</text>
   </g>
   <g id="text_9">
    <text style="fill: #238466; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="61.8048" y="296.495325" transform="rotate(-0 61.8048 296.495325)">mainland / core</text>
   </g>
   <g id="text_10">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 326.297559)">Inset area; holes enlarged</text>
