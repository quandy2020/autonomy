   </g>
   <g id="text_5">
    <text style="fill: #2866ad; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="391.8528" y="128.033325" transform="rotate(-0 391.8528 128.033325)">ConstHL</text>
