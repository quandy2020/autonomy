   <g id="text_1">
    <text style="fill: #26364a; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="49.428" y="35.028" transform="rotate(-0 49.428 35.028)">Fields2Cover: data flow and geometric constraints</text>
   </g>
   <g id="text_2">
    <text style="fill: #586671; font: 11px 'DejaVu Sans'; text-anchor: start" x="49.428" y="68.0328" transform="rotate(-0 49.428 68.0328)">Core area scores coverage; the original field constrains connecting paths</text>
   </g>
   <g id="text_3">
    <text style="fill: #238466; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="61.8048" y="128.033325" transform="rotate(-0 61.8048 128.033325)">Cell / Cells</text>
   </g>
