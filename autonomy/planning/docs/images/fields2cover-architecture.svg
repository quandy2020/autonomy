   <g id="text_1">
    <text style="fill: #26364a; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="49.428" y="35.028" transform="rotate(-0 49.428 35.028)">Fields2Cover in Autonomy: architecture</text>
   </g>
   <g id="text_2">
    <text style="fill: #586671; font: 11px 'DejaVu Sans'; text-anchor: start" x="49.428" y="68.0328" transform="rotate(-0 49.428 68.0328)">Source: autonomy/planning/planner/fields2cover | Optional module in autonomy_planning</text>
   </g>
   <g id="text_3">
    <text style="fill: #586671; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="61.8048" y="131.471325" transform="rotate(-0 61.8048 131.471325)">Application / task adapter</text>
   </g>
   <g id="text_4">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 161.273559)">Region + holes + robot parameters</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 175.42477)">Task status, cancellation, control semantics</text>
   </g>
   <g id="text_5">
    <text style="fill: #2866ad; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="405.6048" y="131.471325" transform="rotate(-0 405.6048 131.471325)">fields2cover.hpp / Options</text>
   </g>
   <g id="text_6">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(405.6048 161.273559)">PlanCovRoute()   /   PlanCovPath()</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(405.6048 175.42477)">Cell, Cells and Field overloads</text>
   </g>
   <g id="text_7">
    <text style="fill: #238466; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="825.0408" y="131.471325" transform="rotate(-0 825.0408 131.471325)">Route  /  Path</text>
   </g>
   <g id="text_8">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(825.0408 161.273559)">Ordered swaths and connections</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(825.0408 175.42477)">Pose, direction, section, speed</text>
   </g>
   <g id="text_9">
    <text style="fill: #2866ad; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="61.8048" y="272.429325" transform="rotate(-0 61.8048 272.429325)">Headland generation</text>
   </g>
   <g id="text_10">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 302.231559)">hg::ConstHL</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 316.38277)">Core inset + connection rings</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 330.533981)">Outer border / holes</text>
   </g>
   <g id="text_11">
    <text style="fill: #2866ad; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="329.9688" y="272.429325" transform="rotate(-0 329.9688 272.429325)">Swath generation</text>
   </g>
   <g id="text_12">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(329.9688 302.231559)">sg::BruteForce</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(329.9688 316.38277)">obj::SGObjective</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(329.9688 330.533981)">Direction + phase + clipping</text>
   </g>
   <g id="text_13">
    <text style="fill: #2866ad; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="598.1328" y="272.429325" transform="rotate(-0 598.1328 272.429325)">Route planning</text>
   </g>
   <g id="text_14">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(598.1328 302.231559)">rp::RoutePlannerBase</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(598.1328 316.38277)">Border / coverage graphs</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(598.1328 330.533981)">Greedy + timed 2-opt</text>
   </g>
   <g id="text_15">
    <text style="fill: #2866ad; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="866.2968" y="272.429325" transform="rotate(-0 866.2968 272.429325)">Path planning</text>
   </g>
   <g id="text_16">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(866.2968 302.231559)">pp::PathPlanning</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(866.2968 316.38277)">TurningBase: Dubins / RS</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(866.2968 330.533981)">Checked constrained search</text>
   </g>
   <g id="text_17">
    <text style="fill: #238466; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="61.8048" y="458.081325" transform="rotate(-0 61.8048 458.081325)">Types and geometry</text>
   </g>
   <g id="text_18">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 487.883559)">Point / Ring / Cell / Cells / Field / Robot / Swaths / Route / Path</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(61.8048 502.03477)">NativeGeom + Boost.Geometry: buffer, boolean, clipping, WKT</text>
   </g>
   <g id="text_19">
    <text style="fill: #c58020; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="598.1328" y="458.081325" transform="rotate(-0 598.1328 458.081325)">Supporting utilities and steering</text>
   </g>
   <g id="text_20">
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(598.1328 487.883559)">Parser: nlohmann JSON / pugixml GML; limited CRS transforms</text>
    <text style="fill: #26364a; font: 10.5px 'DejaVu Sans'" transform="translate(598.1328 502.03477)">autonomy/common/math/steering: turning solvers</text>
   </g>
   <g id="text_21">
    <text style="fill: #586671; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="52.866" y="605.736" transform="rotate(-0 52.866 605.736)">Integration boundary</text>
   </g>
   <g id="text_22">
    <text style="fill: #586671; font: 11px 'DejaVu Sans'" transform="translate(52.866 625.290922)">Fields2Cover has no built-in PlannerServer registration or coverage task protocol.</text>
    <text style="fill: #586671; font: 11px 'DejaVu Sans'" transform="translate(52.866 640.116)">Applications must preserve reverse direction and work/turn semantics when adapting PathState.</text>
   </g>
  </g>
 </g>
