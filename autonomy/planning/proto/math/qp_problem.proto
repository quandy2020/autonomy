syntax = "proto3";

package autonomy.planning.proto.math;

message QPMatrix {
  repeated double element = 1;
  int32 row_size = 2;
  int32 col_size = 3;
}

message QuadraticProgrammingProblem {
  int32 param_size = 1;
  QPMatrix quadratic_matrix = 2;
  repeated double bias = 3;
  QPMatrix inequality_matrix = 4;
  repeated double inequality_value = 5;
  QPMatrix equality_matrix = 6;
  repeated double equality_value = 7;
  repeated double optimal_param = 8;
}

