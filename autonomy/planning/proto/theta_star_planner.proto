syntax = "proto3";

package autonomy.planning.proto;

message ThetaStarPlanner
{
    // Number of adjacent nodes to be searched (4 or 8)
    // Default: 8
    int32 how_many_corners = 1;
    
    // Whether the planner can plan through unknown space
    // Default: true
    bool allow_unknown = 2;
    
    // Weight on the euclidean distance cost (used for g_cost calculations)
    // Default: 2.0
    double w_euc_cost = 3;
    
    // Weight on the costmap traversal cost
    // Default: 1.0
    double w_traversal_cost = 4;
    
    // Weight on the heuristic cost (used for h_cost calculations)
    // If w_euc_cost < 1.0, then w_heuristic_cost = w_euc_cost, else w_heuristic_cost = 1.0
    // Default: 1.0
    double w_heuristic_cost = 5;
    
    // The interval at which the planner checks if it has been cancelled
    // Default: 5000
    int32 terminal_checking_interval = 6;
}
