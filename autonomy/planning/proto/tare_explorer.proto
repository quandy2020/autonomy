// TARE planner-id compatibility settings.
syntax = "proto3";
package autonomy.planning.proto;

message TareExplorerOptions {
  // Retired independent frontier/A* adapter fields. Kept only for wire and
  // text-configuration compatibility; asynchronous exploration is configured
  // through perception/proto/exploration_options.proto.
  optional uint32 min_frontier_cluster_size = 1 [deprecated = true];
  optional uint32 max_global_viewpoints = 2 [deprecated = true];
  optional uint32 viewpoint_clearance_cells = 3 [deprecated = true];
  optional double information_gain_weight = 4 [deprecated = true];
  optional double travel_cost_weight = 5 [deprecated = true];
  optional bool allow_unknown_transit = 6 [deprecated = true];
  optional uint64 max_search_iterations = 7 [deprecated = true];

  // Configured Vista plugin id whose route graph the TARE id shares.
  // Defaults to "vista_planner". The referenced plugin must exist and be Vista.
  optional string vista_planner_id = 8;
}
