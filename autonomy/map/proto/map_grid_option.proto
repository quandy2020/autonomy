syntax = "proto3";

package autonomy.map.proto;

import "automsgs/msgs/std_msgs/header.proto";
import "automsgs/msgs/builtin_interfaces/time.proto";
import "automsgs/msgs/builtin_interfaces/duration.proto";
import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/geometry_msgs/twist_stamped.proto";

message GridMapOptions
{
    // 是否启用2.5D网格地图
    bool enabled = 1;

    // map file path (optional)
    string map_file = 2;

    // frame id of the grid map
    string frame_id = 3;

    // grid map name
    string name = 4;

    // map resolution in xy plane [m/cell]
    double resolution = 5;

    // side length of the map in x-direction [m]
    double length_x = 6;

    // side length of the map in y-direction [m]
    double length_y = 7;

    // map position in x-direction [m]
    double position_x = 8;

    // map position in y-direction [m]
    double position_y = 9;

    // list of data layer names
    repeated string layers = 10;

    // list of basic layer names (layers that define validity)
    repeated string basic_layers = 11;
}
