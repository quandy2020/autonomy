syntax = "proto3";

package autonomy.map.proto;

message MapOptions
{
    // 地图名称
    string map_name = 1;
    
    // 地图文件路径（如果从文件加载）
    string map_file = 2;
    
    // 地图发布主题（用于原始地图发布，默认: "map"）
    string map_topic = 3;
    
    // 地图发布频率（Hz，默认: 0.0，表示不自动发布，仅在请求时发布）
    double publish_frequency = 4;
    
    // 坐标系ID（通常是 "map"）
    string frame_id = 5;
}