syntax = "proto3";

package autonomy.map.proto;

import "autonomy/commsgs/proto/std_msgs.proto";
import "autonomy/commsgs/proto/builtin_interfaces.proto";
import "autonomy/commsgs/proto/geometry_msgs.proto";

message SensorSource
{
    string topic = 1;
    double max_obstacle_height = 2;
    double min_obstacle_height = 3;
    bool clearing = 4;
    bool marking = 5;
    string data_type = 6;
    double raytrace_min_range = 7;
    double raytrace_max_range = 8;
    double obstacle_min_height = 9;
    double obstacle_max_height = 10;
}

message DenoiseLayer
{
    string plugin = 1;
    bool enabled = 2;
    // Minimum obstacle group size in cells (Nav2: minimal_group_size).
    double denoise_radius = 3;
    // Pixel connectivity: 4 (orthogonal) or 8 (with diagonals). Default 8.
    int32 group_connectivity_type = 4;
}

message Footprint
{
    repeated autonomy.commsgs.proto.geometry_msgs.Point2D points = 1;
}

message InflationLayer
{
    string plugin = 1;
    bool enabled = 2;
    double cost_scaling_factor = 3;
    double inflation_radius = 4;
    bool inflate_unknown = 5;
    bool inflate_around_unknown = 6;
}

message ObstacleLayer
{
    string plugin = 1;
    bool enabled = 2;
    bool footprint_clearing_enabled = 3;
    map<string, SensorSource> sensor_sources = 4;
}

message VoxelLayer
{
    string plugin = 1;
    bool enabled = 2;
    bool footprint_clearing_enabled = 3;
    map<string, SensorSource> sensor_sources = 4;
    int32 z_voxels = 5;
    double origin_z = 6;
    double z_resolution = 7;
    double max_obstacle_height = 8;
    int32 unknown_threshold = 9;
    int32 mark_threshold = 10;
    bool publish_voxel_map = 11;
}

message RangeSensorLayer
{
    string plugin = 1;
    bool enabled = 2;
    double phi = 3;
    double inflate_cone = 4;
    double no_readings_timeout = 5;
    double clear_threshold = 6;
    double mark_threshold = 7;
    bool clear_on_max_reading = 8;
    double transform_tolerance = 9;
    repeated string topics = 10;
    string input_sensor_type = 11;
}

message StaticLayer
{
    string plugin = 1;
    bool enabled = 2;
    bool subscribe_to_updates = 3;
    double transform_tolerance = 4;
    bool footprint_clearing_enabled = 5;
    string map_topic = 6;
}

message Costmap2DOptions
{
    // 是否启用2D代价地图
    bool enabled = 1;

    // map file path
    string map_file = 2;

    // frame id
    string frame_id = 3;

    // costmap name
    string name = 4;

    // costmap resolution
    double resolution = 5;

    // costmap width
    int32 width = 6;

    // costmap height
    int32 height = 7;

    // update frequency
    double update_frequency = 8;

    // rolling window
    bool rolling_window = 9;

    // robot radius
    double robot_radius = 10;

    // always send full costmap
    bool always_send_full_costmap = 11;

    // footprint
    Footprint footprint = 12;

    // footprint padding
    double footprint_padding = 13;

    // plugins
    repeated string plugins = 14;

    // static layer
    StaticLayer static_layer = 15;

    // denoise layer
    DenoiseLayer denoise_layer = 16;

    // obstacle layer
    ObstacleLayer obstacle_layer = 17;

    // inflation layer
    InflationLayer inflation_layer = 18;

    // voxel layer
    VoxelLayer voxel_layer = 19;

    // range sensor layer
    RangeSensorLayer range_sensor_layer = 20;
}