syntax = "proto3";

package autonomy.tasks.proto;

// Options for the explore-to-anywhere task.
// Used when the task manager or BT navigator configures the explore_to_anywhere navigator.
// The exploration module typically writes the next goal to the explore_goal blackboard key.
message ExploreToAnywhereOptions {
  // Blackboard key for the exploration goal (written by upstream exploration module; default: "explore_goal").
  string explore_goal_blackboard_key = 1;

  // Blackboard key for the path used by planner/controller (default: "path").
  string path_blackboard_key = 2;

  // Default behavior tree file basename (e.g. "explore_to_anywhere.xml").
  string default_bt_file = 3;
}
