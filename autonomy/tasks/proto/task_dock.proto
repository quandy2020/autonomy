syntax = "proto3";

package autonomy.tasks.proto;

// Options for the navigate-to-docking task.
// Used when the task manager or BT navigator configures the navigate_to_docking navigator.
message NavigateToDockingOptions {
  // Blackboard key for the dock goal (dock_id or dock_pose); written from action goal.
  string dock_goal_blackboard_key = 1;

  // Default behavior tree file basename (e.g. "navigate_to_docking.xml").
  string default_bt_file = 2;
}
