syntax = "proto3";

package autonomy.tasks.proto;

// Options for the navigate-to-pose task.
// Used when the task manager or BT navigator configures the navigate_to_pose navigator.
message NavigateToPoseOptions {
  // Blackboard key for the goal pose (default: "goal").
  string goal_blackboard_key = 1;

  // Blackboard key for the path used by planner/controller (default: "path").
  string path_blackboard_key = 2;

  // Default behavior tree file basename (e.g. "navigate_to_pose_w_replanning_and_recovery.xml").
  string default_bt_file = 3;
}

// Options for the navigate-through-poses (multi-waypoint) task.
// Used when the task manager or BT navigator configures the navigate_through_poses navigator.
message NavigateThroughPosesOptions {
  // Blackboard key for the ordered list of goal poses (default: "goals").
  string goals_blackboard_key = 1;

  // Blackboard key for the path used by planner/controller (default: "path").
  string path_blackboard_key = 2;

  // Default behavior tree file basename (e.g. "navigate_through_poses.xml").
  string default_bt_file = 3;
}
