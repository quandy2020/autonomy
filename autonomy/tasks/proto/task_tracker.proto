syntax = "proto3";

package autonomy.tasks.proto;

// Options for the track-to-target (follow) task.
// Used when the task manager or BT navigator configures the track_to_target navigator.
message TrackToTargetOptions {
  // Blackboard key for the route produced by the tracker (default: "route").
  string route_blackboard_key = 1;

  // Blackboard key for the path used by FollowPath (default: "path").
  string path_blackboard_key = 2;

  // Blackboard key for the target pose in odom frame (written by upstream tracker).
  string target_pose_blackboard_key = 3;

  // Default behavior tree file basename (e.g. "track_to_target.xml").
  string default_bt_file = 4;
}
