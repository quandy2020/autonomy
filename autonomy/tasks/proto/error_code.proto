syntax = "proto3";

package autonomy.tasks.proto;

// Outcome codes aligned with move_base_flex/mbf_msgs (GetPath / ExePath / Recovery / MoveBase).
// BT nodes write GetPathErrorCode or ExePathErrorCode to blackboard error_code_id (uint16).
// High-level autolink actions use NavigateToPose* / NavigateThroughPoses* (Nav2-compatible 9000+/9100+).

// --- GetPath (mbf_msgs/action/GetPath.action), range 50-99 ---

enum GetPathErrorCode {
  GET_PATH_SUCCESS = 0;
  // 1-9 reserved for plugin-specific non-error results

  GET_PATH_FAILURE = 50;
  GET_PATH_CANCELED = 51;
  GET_PATH_INVALID_START = 52;
  GET_PATH_INVALID_GOAL = 53;
  GET_PATH_BLOCKED_START = 54;
  GET_PATH_BLOCKED_GOAL = 55;
  GET_PATH_NO_PATH_FOUND = 56;
  GET_PATH_PAT_EXCEEDED = 57;
  GET_PATH_EMPTY_PATH = 58;
  GET_PATH_TF_ERROR = 59;
  GET_PATH_NOT_INITIALIZED = 60;
  GET_PATH_INVALID_PLUGIN = 61;
  GET_PATH_INTERNAL_ERROR = 62;
  GET_PATH_OUT_OF_MAP = 63;
  GET_PATH_MAP_ERROR = 64;
  GET_PATH_STOPPED = 65;
  // 71-99 reserved for plugin-specific errors
}

// --- ExePath (mbf_msgs/action/ExePath.action), range 100-149 ---

enum ExePathErrorCode {
  EXE_PATH_SUCCESS = 0;
  // 1-9 reserved for plugin-specific non-error results

  EXE_PATH_FAILURE = 100;
  EXE_PATH_CANCELED = 101;
  EXE_PATH_NO_VALID_CMD = 102;
  EXE_PATH_PAT_EXCEEDED = 103;
  EXE_PATH_COLLISION = 104;
  EXE_PATH_OSCILLATION = 105;
  EXE_PATH_ROBOT_STUCK = 106;
  EXE_PATH_MISSED_GOAL = 107;
  EXE_PATH_MISSED_PATH = 108;
  EXE_PATH_BLOCKED_GOAL = 109;
  EXE_PATH_BLOCKED_PATH = 110;
  EXE_PATH_INVALID_PATH = 111;
  EXE_PATH_TF_ERROR = 112;
  EXE_PATH_NOT_INITIALIZED = 113;
  EXE_PATH_INVALID_PLUGIN = 114;
  EXE_PATH_INTERNAL_ERROR = 115;
  EXE_PATH_OUT_OF_MAP = 116;
  EXE_PATH_MAP_ERROR = 117;
  EXE_PATH_STOPPED = 118;
  // 121-149 reserved for plugin-specific errors
}

// --- Recovery (mbf_msgs/action/Recovery.action), range 150-199 ---

enum RecoveryErrorCode {
  RECOVERY_SUCCESS = 0;

  RECOVERY_FAILURE = 150;
  RECOVERY_CANCELED = 151;
  RECOVERY_PAT_EXCEEDED = 152;
  RECOVERY_TF_ERROR = 153;
  RECOVERY_NOT_INITIALIZED = 154;
  RECOVERY_INVALID_PLUGIN = 155;
  RECOVERY_INTERNAL_ERROR = 156;
  RECOVERY_STOPPED = 157;
  RECOVERY_IMPASSABLE = 158;
  // 171-199 reserved for plugin-specific errors
}

// --- MoveBase (mbf_msgs/action/MoveBase.action), general 10-49 + aggregated plan/ctrl ---

enum MoveBaseErrorCode {
  MOVE_BASE_SUCCESS = 0;

  MOVE_BASE_FAILURE = 10;
  MOVE_BASE_CANCELED = 11;
  MOVE_BASE_COLLISION = 12;
  MOVE_BASE_OSCILLATION = 13;
  MOVE_BASE_START_BLOCKED = 14;
  MOVE_BASE_GOAL_BLOCKED = 15;
  MOVE_BASE_TF_ERROR = 16;
  MOVE_BASE_INTERNAL_ERROR = 17;
  // 21-49 reserved for future general errors

  MOVE_BASE_PLAN_FAILURE = 50;
  // 51-99 reserved for planner-specific (see GetPathErrorCode)

  MOVE_BASE_CTRL_FAILURE = 100;
  // 101-149 reserved for controller-specific (see ExePathErrorCode)
}

// --- Nav2-compatible high-level navigation actions ---

enum NavigateToPoseErrorCode {
  NAV_TO_POSE_NONE = 0;
  NAV_TO_POSE_UNKNOWN = 9000;
  NAV_TO_POSE_FAILED_TO_LOAD_BEHAVIOR_TREE = 9001;
  NAV_TO_POSE_TF_ERROR = 9002;
  NAV_TO_POSE_TIMEOUT = 9003;
  NAV_TO_POSE_NO_VALID_PATH = 9004;
  NAV_TO_POSE_CANCELED = 9005;
  NAV_TO_POSE_PREEMPTED = 9006;
  NAV_TO_POSE_INVALID_GOAL = 9007;
  NAV_TO_POSE_NOT_INITIALIZED = 9008;
  NAV_TO_POSE_PLANNER_FAILED = 9009;
  NAV_TO_POSE_CONTROLLER_FAILED = 9010;
  NAV_TO_POSE_SMOOTHER_FAILED = 9011;
  NAV_TO_POSE_PATH_INVALID = 9012;
  NAV_TO_POSE_GOAL_CHECKER_FAILED = 9013;
}

enum NavigateThroughPosesErrorCode {
  NAV_THROUGH_POSES_NONE = 0;
  NAV_THROUGH_POSES_UNKNOWN = 9100;
  NAV_THROUGH_POSES_FAILED_TO_LOAD_BEHAVIOR_TREE = 9101;
  NAV_THROUGH_POSES_TF_ERROR = 9102;
  NAV_THROUGH_POSES_TIMEOUT = 9103;
  NAV_THROUGH_POSES_NO_VALID_PATH = 9104;
  NAV_THROUGH_POSES_CANCELED = 9105;
  NAV_THROUGH_POSES_PREEMPTED = 9106;
  NAV_THROUGH_POSES_INVALID_GOAL = 9107;
  NAV_THROUGH_POSES_NOT_INITIALIZED = 9108;
  NAV_THROUGH_POSES_PLANNER_FAILED = 9109;
  NAV_THROUGH_POSES_CONTROLLER_FAILED = 9110;
  NAV_THROUGH_POSES_SMOOTHER_FAILED = 9111;
  NAV_THROUGH_POSES_PATH_INVALID = 9112;
  NAV_THROUGH_POSES_GOAL_CHECKER_FAILED = 9113;
}
