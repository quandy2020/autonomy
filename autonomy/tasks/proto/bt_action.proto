        autonomy.commsgs.proto.builtin_interfaces.Duration time_allowance = 1;
    }

    message Feedback
    {
        autonomy.commsgs.proto.builtin_interfaces.Duration exploration_time = 1;
    }

    message Result
    {
        ExploreToAnywhereErrorCode error_code = 1;
        string error_msg = 2;
    }

    Goal goal = 1;
    Feedback feedback = 2;
    Result result = 3;
}

// ============================================================================
// Wait Action
// ============================================================================

// Error codes for Wait
// Note: The expected priority order of the errors should match the message order
enum WaitErrorCode
{
    WAIT_ERROR_NONE = 0;
    WAIT_ERROR_UNKNOWN = 740;
    WAIT_ERROR_TIMEOUT = 741;
}

message WaitAction
{
    message Goal
    {
        // Time to wait
        autonomy.commsgs.proto.builtin_interfaces.Duration time = 1;
    }

    message Feedback
    {
        // Time left
        autonomy.commsgs.proto.builtin_interfaces.Duration time_left = 1;
    }

    message Result
    {
        // Total elapsed time
        autonomy.commsgs.proto.builtin_interfaces.Duration total_elapsed_time = 1;
        
        // Error code
        WaitErrorCode error_code = 2;
        
        // Error message
        string error_msg = 3;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

