enum ComputeRouteActionErrorCode
{
    COMPUTE_ROUTE_ERROR_NONE=0;
    COMPUTE_ROUTE_ERROR_UNKNOWN=400;
    COMPUTE_ROUTE_ERROR_TF_ERROR=401;
    COMPUTE_ROUTE_ERROR_NO_VALID_GRAPH=402;
    COMPUTE_ROUTE_ERROR_INDETERMINANT_NODES_ON_GRAPH=403;
    COMPUTE_ROUTE_ERROR_TIMEOUT=404;
    COMPUTE_ROUTE_ERROR_NO_VALID_ROUTE=405;
    COMPUTE_ROUTE_IERROR_NVALID_EDGE_SCORER_USE=407;
}

message ComputeRouteAction
{
    // goal definition
    message Goal
    {
        uint32 start_id = 1;
        autonomy.commsgs.proto.geometry_msgs.PoseStamped start = 2;
        uint32 goal_id = 3;
        autonomy.commsgs.proto.geometry_msgs.PoseStamped goal = 4;

        // Whether to use the start field or find the start pose in TF
        bool use_start = 5; 

        // Whether to use the poses or the IDs fields for request
        bool use_poses = 6; 
    }

    message Feedback
    {
         google.protobuf.Empty empty = 1;
    }

    message Result
    {
        autonomy.commsgs.proto.builtin_interfaces.Duration planning_time = 1;
        autonomy.commsgs.proto.planning_msgs.Path path = 2;
        Route route = 3;
        uint32 error_code = 4;
        string error_msg = 5;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

