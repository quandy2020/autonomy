// Error codes for ComputeAndTrackRoute
enum ComputeAndTrackRouteErrorCode
{
    COMPUTE_AND_TRACK_ROUTE_ERROR_NONE = 0;
    COMPUTE_AND_TRACK_ROUTE_ERROR_UNKNOWN = 400;
    COMPUTE_AND_TRACK_ROUTE_ERROR_TF_ERROR = 401;
    COMPUTE_AND_TRACK_ROUTE_ERROR_NO_VALID_GRAPH = 402;
    COMPUTE_AND_TRACK_ROUTE_ERROR_INDETERMINANT_NODES_ON_GRAPH = 403;
    COMPUTE_AND_TRACK_ROUTE_ERROR_TIMEOUT = 404;
    COMPUTE_AND_TRACK_ROUTE_ERROR_NO_VALID_ROUTE = 405;
    COMPUTE_AND_TRACK_ROUTE_ERROR_OPERATION_FAILED = 406;
    COMPUTE_AND_TRACK_ROUTE_ERROR_INVALID_EDGE_SCORER_USE = 407;
}


message ComputeAndTrackRouteAction
{
    message Goal
    {
        // Start node ID
        uint32 start_id = 1;
        
        // Start pose
        autonomy.commsgs.proto.geometry_msgs.PoseStamped start = 2;
        
        // Goal node ID
        uint32 goal_id = 3;
        
        // Goal pose
        autonomy.commsgs.proto.geometry_msgs.PoseStamped goal = 4;
        
        // Whether to use the start field or find the start pose in TF
        bool use_start = 5;
        
        // Whether to use the poses or the IDs fields for request
        bool use_poses = 6;
    }

    message Feedback
    {
        // Last node ID
        uint32 last_node_id = 1;
        
        // Next node ID
        uint32 next_node_id = 2;
        
        // Current edge ID
        uint32 current_edge_id = 3;
        
        // Route
        Route route = 4;
        
        // Path
        autonomy.commsgs.proto.planning_msgs.Path path = 5;
        
        // Operations triggered
        repeated string operations_triggered = 6;
        
        // Whether route was rerouted
        bool rerouted = 7;
    }

    message Result
    {
        // Execution duration
        autonomy.commsgs.proto.builtin_interfaces.Duration execution_duration = 1;
        
        // Error code
        ComputeAndTrackRouteErrorCode error_code = 2;
        
        // Error message
        string error_msg = 3;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

