// Docking state codes
enum DockingStateCode
{
    DOCKING_STATE_NONE = 0;
    DOCKING_STATE_NAV_TO_STAGING_POSE = 1;
    DOCKING_STATE_INITIAL_PERCEPTION = 2;
    DOCKING_STATE_CONTROLLING = 3;
    DOCKING_STATE_WAIT_FOR_CHARGE = 4;
    DOCKING_STATE_RETRY = 5;
}

// Error codes for DockRobot
// Note: The expected priority order of the errors should match the message order
enum DockRobotErrorCode
{
    DOCK_ROBOT_ERROR_NONE = 0;
    DOCK_ROBOT_ERROR_DOCK_NOT_IN_DB = 901;
    DOCK_ROBOT_ERROR_DOCK_NOT_VALID = 902;
    DOCK_ROBOT_ERROR_FAILED_TO_STAGE = 903;
    DOCK_ROBOT_ERROR_FAILED_TO_DETECT_DOCK = 904;
    DOCK_ROBOT_ERROR_FAILED_TO_CONTROL = 905;
    DOCK_ROBOT_ERROR_FAILED_TO_CHARGE = 906;
    DOCK_ROBOT_ERROR_TIMEOUT = 907;
    DOCK_ROBOT_ERROR_UNKNOWN = 999;
}

message DockRobotAction
{
    message Goal
    {
        // Whether to use the dock_id or dock_pose fields
        bool use_dock_id = 1;
        
        // Dock name or ID to dock at, from given dock database
        string dock_id = 2;
        
        // Dock pose
        autonomy.commsgs.proto.geometry_msgs.PoseStamped dock_pose = 3;
        
        // If using dock_pose, what type of dock it is
        string dock_type = 4;
        
        // Maximum time for navigation to get to the dock's staging pose
        float max_staging_time = 5;
        
        // Whether or not to navigate to staging pose or assume robot is already at staging pose within tolerance
        bool navigate_to_staging_pose = 6;
    }

    message Feedback
    {
        // Current docking state
        DockingStateCode state = 1;
        
        // Docking time elapsed
        autonomy.commsgs.proto.builtin_interfaces.Duration docking_time = 2;
        
        // Number of retries attempted
        uint32 num_retries = 3;
    }

    message Result
    {
        // Docking success status
        bool success = 1;
        
        // Error code
        DockRobotErrorCode error_code = 2;
        
        // Number of retries attempted
        uint32 num_retries = 3;
        
        // Error message
        string error_msg = 4;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

