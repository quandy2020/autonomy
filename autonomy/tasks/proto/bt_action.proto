message NavigateThroughPosesAction
{
    message Goal
    {
        // Ordered list of poses to navigate through (via points)
        autonomy.commsgs.proto.planning_msgs.Goals poses = 1;

        // Optional behavior tree file path
        string behavior_tree = 2;
    }

    message Feedback
    {
        // Index of the current pose being navigated to (0-based)
        uint32 current_pose_index = 1;

        // Total number of poses
        uint32 total_poses = 2;

        // Current pose
        autonomy.commsgs.proto.geometry_msgs.PoseStamped current_pose = 3;

        // Navigation time so far
        autonomy.commsgs.proto.builtin_interfaces.Duration navigation_time = 4;
    }

    message Result
    {
        NavigateThroughPosesErrorCode error_code = 1;
        string error_msg = 2;
    }

    Goal goal = 1;
    Feedback feedback = 2;
    Result result = 3;
}

// ============================================================================
// SmoothPath Action
// ============================================================================

// Error codes for SmoothPath
// Note: The expected priority order of the errors should match the message order
enum SmoothPathErrorCode
{
    SMOOTH_PATH_ERROR_NONE = 0;
    SMOOTH_PATH_ERROR_UNKNOWN = 500;
    SMOOTH_PATH_ERROR_INVALID_SMOOTHER = 501;
    SMOOTH_PATH_ERROR_TIMEOUT = 502;
    SMOOTH_PATH_ERROR_SMOOTHED_PATH_IN_COLLISION = 503;
    SMOOTH_PATH_ERROR_FAILED_TO_SMOOTH_PATH = 504;
    SMOOTH_PATH_ERROR_INVALID_PATH = 505;
}

message SmoothPathAction 
{
    message Goal
    {
        // Path to smooth
        autonomy.commsgs.proto.planning_msgs.Path path = 1;
        
        // Smoother plugin ID
        string smoother_id = 2;
        
        // Maximum smoothing duration
        autonomy.commsgs.proto.builtin_interfaces.Duration max_smoothing_duration = 3;
        
        // Whether to check for collisions
        bool check_for_collisions = 4;
    }

    message Feedback
    {
        // Feedback definition (currently empty)
    }

    message Result
    {
        // Smoothed path
        autonomy.commsgs.proto.planning_msgs.Path path = 1;
        
        // Actual smoothing duration
        autonomy.commsgs.proto.builtin_interfaces.Duration smoothing_duration = 2;
        
        // Whether smoothing was completed
        bool was_completed = 3;
        
        // Error code
        SmoothPathErrorCode error_code = 4;
        
        // Error message
        string error_msg = 5;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

// ============================================================================
// Spin Action
// ============================================================================

// Error codes for Spin
// Note: The expected priority order of the errors should match the message order
enum SpinErrorCode
{
    SPIN_ERROR_NONE = 0;
    SPIN_ERROR_UNKNOWN = 700;
    SPIN_ERROR_TIMEOUT = 701;
    SPIN_ERROR_TF_ERROR = 702;
    SPIN_ERROR_COLLISION_AHEAD = 703;
}

message SpinAction
{
    message Goal
    {
        // Target yaw angle
        float target_yaw = 1;
        
        // Time allowance
        autonomy.commsgs.proto.builtin_interfaces.Duration time_allowance = 2;
        
        // Whether to disable collision checks
        bool disable_collision_checks = 3;
    }

    message Feedback
    {
        // Angular distance traveled
        float angular_distance_traveled = 1;
    }

    message Result
    {
        // Total elapsed time
        autonomy.commsgs.proto.builtin_interfaces.Duration total_elapsed_time = 1;
        
        // Error code
        SpinErrorCode error_code = 2;
        
        // Error message
        string error_msg = 3;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

// ============================================================================
// UndockRobot Action
// ============================================================================

// Error codes for UndockRobot
// Note: The expected priority order of the errors should match the message order
enum UndockRobotErrorCode
{
    UNDOCK_ROBOT_ERROR_NONE = 0;
    UNDOCK_ROBOT_ERROR_DOCK_NOT_VALID = 902;
    UNDOCK_ROBOT_ERROR_FAILED_TO_CONTROL = 905;
    UNDOCK_ROBOT_ERROR_TIMEOUT = 907;
    UNDOCK_ROBOT_ERROR_UNKNOWN = 999;
}

message UndockRobotAction
{
    message Goal
    {
        // If initialized on a dock so the server doesn't know what type of dock its on,
        // you must specify what dock it is to know where to stage for undocking.
        // If only one type of dock plugin is present, it is not necessary to set.
        // If not set & server instance was used to dock, server will use current dock information from last docking request.
        string dock_type = 1;
        
        // Maximum time to undock
        float max_undocking_time = 2;
    }

    message Feedback
    {
        // Feedback definition (currently empty)
    }

    message Result
    {
        // Undocking success status
        bool success = 1;
        
        // Error code
        UndockRobotErrorCode error_code = 2;
        
        // Error message
        string error_msg = 3;
    }

    // Goal
    Goal goal = 1;

    // Feedback
    Feedback feedback = 2;

    // Result
    Result result = 3;
}

