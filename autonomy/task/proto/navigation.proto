syntax = "proto3";

package autonomy.task.proto;

import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/geometry_msgs/twist_stamped.proto";
import "autonomy/task/proto/task_common.proto";

// navigation — aligned with bridge NavigationCommand / nav_msgs actions.

enum NavigationMode {
  NAV_MODE_UNSPECIFIED = 0;
  NAV_MODE_SINGLE_POSE = 1;
  NAV_MODE_THROUGH_POSES = 2;
}

enum NavigationCommand {
  NAV_CMD_UNSPECIFIED = 0;
  NAV_CMD_START = 1;
  NAV_CMD_STOP = 2;
  NAV_CMD_CANCEL = 3;
  NAV_CMD_RESUME = 4;
  NAV_CMD_PAUSE = 5;
  NAV_CMD_REPLAN = 6;
}

enum NavigationStatus {
  NAV_STATUS_UNKNOWN = 0;
  NAV_STATUS_IDLE = 1;
  NAV_STATUS_PLANNING = 2;
  NAV_STATUS_NAVIGATING = 3;
  NAV_STATUS_PAUSED = 4;
  NAV_STATUS_SUCCEEDED = 5;
  NAV_STATUS_FAILED = 6;
  NAV_STATUS_CANCELED = 7;
}

message NavigationGoal {
  TaskHeader header = 1;
  NavigationCommand command = 2;
  NavigationMode mode = 3;
  repeated automsgs.msgs.geometry_msgs.PoseStamped goals = 4;
  NavigationPluginOptions plugins = 5;
  float timeout_sec = 6;
}

message NavigationFeedback {
  NavigationStatus status = 1;
  TaskProgress progress = 2;
  int32 current_waypoint_index = 3;
  int32 total_waypoints = 4;
  float distance_remaining = 5;
  automsgs.msgs.geometry_msgs.PoseStamped current_pose = 6;
}

message NavigationResult {
  TaskResult result = 1;
  NavigationStatus final_status = 2;
}
