syntax = "proto3";

package autonomy.task.proto;

import "autonomy/commsgs/proto/geometry_msgs.proto";
import "autonomy/task/proto/task_common.proto";

// apps/mapping — aligned with bridge MapCommand.

enum MapCommand {
  MAP_CMD_UNSPECIFIED = 0;
  MAP_CMD_LOAD = 1;
  MAP_CMD_SWITCH = 2;
  MAP_CMD_SET_INITIAL_POSE = 3;
  MAP_CMD_CLEAR_COSTMAP = 4;
  MAP_CMD_ADD_KEEP_OUT_ZONE = 5;
  MAP_CMD_REMOVE_KEEP_OUT_ZONE = 6;
}

enum MapStatus {
  MAP_STATUS_UNKNOWN = 0;
  MAP_STATUS_IDLE = 1;
  MAP_STATUS_LOADING = 2;
  MAP_STATUS_SUCCEEDED = 3;
  MAP_STATUS_FAILED = 4;
}

message MappingGoal {
  TaskHeader header = 1;
  MapCommand command = 2;
  oneof params {
    string map_name = 3;
    commsgs.proto.geometry_msgs.PoseWithCovarianceStamped initial_pose = 4;
    commsgs.proto.geometry_msgs.Polygon keep_out_zone = 5;
    string zone_id = 6;
  }
}

message MappingFeedback {
  MapStatus status = 1;
  TaskProgress progress = 2;
  string current_map_name = 3;
}

message MappingResult {
  TaskResult result = 1;
  MapStatus final_status = 2;
  string current_map_name = 3;
}
