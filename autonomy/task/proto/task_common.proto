syntax = "proto3";

package autonomy.task.proto;

import "autonomy/commsgs/proto/builtin_interfaces.proto";
import "autonomy/commsgs/proto/error_code.proto";
import "autonomy/commsgs/proto/vehicle_msgs.proto";

// Internal task envelope (lighter than bridge RequestHeader).
message TaskHeader {
  commsgs.proto.builtin_interfaces.Time stamp = 1;
  string task_id = 2;
  string client_id = 3;
  commsgs.proto.vehicle_msgs.RobotTaskType task_type = 4;
}

message TaskResult {
  commsgs.proto.vehicle_msgs.RobotTaskStatus status = 1;
  commsgs.proto.error_code.ErrorCode error_code = 2;
  string message = 3;
}

message TaskProgress {
  float progress = 1;  // [0, 1]
  string detail = 2;
}

// Plugin selection shared by navigation / tracking tasks.
message NavigationPluginOptions {
  string planner_id = 1;
  string controller_id = 2;
  string goal_checker_id = 3;
  string behavior_tree = 4;
}
