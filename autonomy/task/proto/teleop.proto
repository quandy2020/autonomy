syntax = "proto3";

package autonomy.task.proto;

import "autonomy/commsgs/proto/builtin_interfaces.proto";
import "autonomy/commsgs/proto/geometry_msgs.proto";
import "autonomy/task/proto/task_common.proto";

// apps/teleop — aligned with bridge TeleopCommand (Bidi stream).

enum TeleopCommand {
  TELEOP_CMD_UNSPECIFIED = 0;
  TELEOP_CMD_START = 1;
  TELEOP_CMD_STOP = 2;
  TELEOP_CMD_VELOCITY = 3;
}

enum TeleopStatus {
  TELEOP_STATUS_UNKNOWN = 0;
  TELEOP_STATUS_IDLE = 1;
  TELEOP_STATUS_ACTIVE = 2;
  TELEOP_STATUS_TIMEOUT = 3;
  TELEOP_STATUS_REJECTED = 4;
}

message TeleopGoal {
  TaskHeader header = 1;
  TeleopCommand command = 2;
  commsgs.proto.geometry_msgs.TwistStamped velocity = 3;
  commsgs.proto.builtin_interfaces.Duration session_timeout = 4;
  float max_linear_speed = 5;
  float max_angular_speed = 6;
  float watchdog_timeout_sec = 7;
  bool disable_collision_checks = 8;
}

message TeleopFeedback {
  TeleopStatus status = 1;
  commsgs.proto.geometry_msgs.TwistStamped applied_velocity = 2;
}

message TeleopResult {
  TaskResult result = 1;
  TeleopStatus final_status = 2;
}
