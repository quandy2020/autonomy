syntax = "proto3";

package autonomy.manipulation.proto;

// Runtime options for autonomy.manipulation (MoveIt2 move_group analogue).

message ManipulationOptions {
  string robot_description = 1;
  string robot_description_semantic = 2;
  string planning_group = 3;
  string planner_id = 4;
  string kinematics_solver = 5;
  string controller_id = 6;
  bool enable_servo = 7;
  uint32 planning_time_milliseconds = 8;
  float goal_joint_tolerance = 9;
  float goal_position_tolerance = 10;
  float goal_orientation_tolerance = 11;
  repeated string default_joints = 12;
  string base_frame = 13;
  string tip_frame = 14;
  uint32 interpolation_steps = 15;
  bool use_joint_trajectory_controller = 16;
  string trajectory_topic = 17;
  string action_name = 18;
  // PlanningRequestAdapter ids (aliases or class names):
  // fix_start_state_bounds, fix_start_state_path_constraints,
  // time_parameterization, validate_path, dense_sample, check_constraints
  repeated string adapters = 19;
  string collision_detector = 20;
  string joint_states_topic = 21;
  double execution_timeout_seconds = 22;
  double max_velocity = 23;
  double max_acceleration = 24;
  string gripper_controller_id = 25;
  bool enable_scene_monitor = 26;
  // Max |Δq| (rad/m) between desired waypoint and measured state before
  // TrajectoryExecutionManager reports control failure (0 = disabled).
  double execution_deviation_tolerance = 27;
  // Default MotionPlanRequest.max_attempts when request leaves it unset.
  uint32 max_planning_attempts = 28;
  // Pilz Cartesian limits (MoveIt cartesian_limits lite). 0 = unset → use
  // max_velocity / max_acceleration for LIN/CIRC.
  double max_translational_velocity = 29;
  double max_translational_acceleration = 30;
  double max_translational_deceleration = 31;
  double max_rotational_velocity = 32;
  // Max |cmd_effort−actual_effort| (Nm) when both present (0 = disabled).
  double execution_effort_tolerance = 33;
  // Occupancy cloud self-filter sphere radius around link origins (m);
  // 0 disables.
  double occupancy_self_filter_padding = 34;
  // Software effort proportional loop on top of feedforward (0 = pure feedforward).
  double effort_tracking_proportional_gain = 35;
  // Clamp |effort_command| (Nm); 0 = no clamp.
  double maximum_effort_command = 36;
}
