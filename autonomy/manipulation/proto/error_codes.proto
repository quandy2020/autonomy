syntax = "proto3";

package autonomy.manipulation.proto;

// Internal manipulation / planning / inverse kinematics / execution result codes.
// Numeric values align with MoveIt MoveItErrorCodes for wire bridging via
// automsgs.msgs.moveit_msgs.MoveItErrorCodes.
//
// External RPC / StatusPb must use automsgs.msgs.status_msgs.StatusCode
// (map at the module boundary; do not expose this enum on public Status).
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  SUCCESS = 1;
  FAILURE = 99999;

  PLANNING_FAILED = -1;
  INVALID_MOTION_PLAN = -2;
  MOTION_PLAN_INVALIDATED_BY_ENVIRONMENT_CHANGE = -3;
  CONTROL_FAILED = -4;
  // Spelling corrected vs historical MoveIt wire enum UNABLE_TO_AQUIRE_*;
  // numeric value -5 is unchanged for bridging.
  UNABLE_TO_ACQUIRE_SENSOR_DATA = -5;
  TIMED_OUT = -6;
  PREEMPTED = -7;

  START_STATE_IN_COLLISION = -10;
  START_STATE_VIOLATES_PATH_CONSTRAINTS = -11;
  GOAL_IN_COLLISION = -12;
  GOAL_VIOLATES_PATH_CONSTRAINTS = -13;
  GOAL_CONSTRAINTS_BADLY_DEFINED = -14;
  INVALID_GROUP_NAME = -15;
  INVALID_GOAL_CONSTRAINTS = -16;
  INVALID_ROBOT_STATE = -17;
  INVALID_LINK_NAME = -18;
  INVALID_OBJECT_NAME = -19;

  FRAME_TRANSFORM_FAILURE = -21;
  COLLISION_CHECKING_UNAVAILABLE = -22;
  ROBOT_STATE_STALE = -23;
  SENSOR_INFO_STALE = -24;

  NO_INVERSE_KINEMATICS_SOLUTION = -31;
  INVALID_PLANNING_SCENE = -32;
}
