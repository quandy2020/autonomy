syntax = "proto3";

package autonomy.manipulation.proto;

import "autonomy/manipulation/proto/error_codes.proto";
import "automsgs/msgs/geometry_msgs/pose.proto";
import "automsgs/msgs/moveit_msgs/motion_plan.proto";
import "automsgs/msgs/sensor_msgs/joint_state.proto";
import "automsgs/msgs/trajectory_msgs/joint_trajectory.proto";

// One Pilz Sequence item (point-to-point / linear / circular) with blend radius.
message SequenceItem {
  // Motion primitive: "PTP" | "LIN" | "CIRC" (Pilz planner identifiers).
  string type = 1;
  automsgs.msgs.sensor_msgs.JointState goal_state = 2;
  automsgs.msgs.geometry_msgs.Pose goal_pose = 3;
  // Presence via generated has_goal_pose() / has_interim_pose() (do not add bools).
  reserved 4, 6;
  reserved "has_goal_pose", "has_interim_pose";
  automsgs.msgs.geometry_msgs.Pose interim_pose = 5;
  double blend_radius = 7;
  double velocity_scale = 8;
}

// Pilz Cartesian limits (MoveIt cartesian_limits_parameters lite).
message CartesianLimits {
  double max_translational_velocity = 1;       // m/s
  double max_translational_acceleration = 2;   // m/s²
  double max_translational_deceleration = 3;   // m/s²
  double max_rotational_velocity = 4;          // rad/s
  bool configured = 5;
}

// Wire portion of an internal motion plan request (no runtime shared_ptrs).
message MotionPlanRequest {
  string group = 1;
  string planner_id = 2;
  automsgs.msgs.sensor_msgs.JointState start_state = 3;
  automsgs.msgs.sensor_msgs.JointState goal_state = 4;
  automsgs.msgs.geometry_msgs.Pose goal_pose = 5;
  reserved 6;
  reserved "has_goal_pose";
  repeated automsgs.msgs.geometry_msgs.Pose cartesian_waypoints = 7;
  double planning_time = 8;  // seconds
  int32 max_attempts = 9;
  repeated automsgs.msgs.moveit_msgs.JointConstraint joint_constraints = 10;
  repeated automsgs.msgs.moveit_msgs.PositionConstraint position_constraints = 11;
  repeated automsgs.msgs.moveit_msgs.OrientationConstraint orientation_constraints =
      12;
  double max_velocity = 13;
  double max_acceleration = 14;
  double velocity_scale = 15;
  double acceleration_scale = 16;
  double goal_joint_tolerance = 17;
  double goal_position_tolerance = 18;
  double blend_radius = 19;
  CartesianLimits cartesian_limits = 20;
  repeated SequenceItem sequence = 21;
}

// Motion planning result (internal).
message MotionPlanResponse {
  bool success = 1;
  ErrorCode error_code = 2;
  string error = 3;
  automsgs.msgs.trajectory_msgs.JointTrajectory trajectory = 4;
}
