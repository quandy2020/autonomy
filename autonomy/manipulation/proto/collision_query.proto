syntax = "proto3";

package autonomy.manipulation.proto;

// Result of a collision query.
message CollisionResult {
  bool collision = 1;
  string contact_body_a = 2;
  string contact_body_b = 3;
}

// Minimum distance query (MoveIt CollisionEnv::distanceRobot analogue).
message DistanceResult {
  double distance = 1;
  bool collision = 2;
  string nearest_body_a = 3;
  string nearest_body_b = 4;
  double nearest_point_x = 5;
  double nearest_point_y = 6;
  double nearest_point_z = 7;
}
