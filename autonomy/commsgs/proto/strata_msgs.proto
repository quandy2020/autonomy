syntax = "proto3";

package autonomy.commsgs.proto.strata_msgs;

import "autonomy/commsgs/proto/std_msgs.proto";
import "autonomy/commsgs/proto/geometry_msgs.proto";

message ColorRgba {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

message PoiMarker {
    std_msgs.Header header = 1;
    string id = 2;
    geometry_msgs.Point lng_lat = 3;
    double rotation_deg = 4;
    string name = 5;
    bool selected = 6;
}

message PoiMarkerArray {
    std_msgs.Header header = 1;
    repeated PoiMarker markers = 2;
}

message RobotMarker {
    std_msgs.Header header = 1;
    string id = 2;
    geometry_msgs.Point lng_lat = 3;
    double rotation_deg = 4;
    string name = 5;
    string status = 6;
    float battery = 7;
}

message RobotMarkerArray {
    std_msgs.Header header = 1;
    repeated RobotMarker robots = 2;
}

message SemanticZone {
    std_msgs.Header header = 1;
    string id = 2;
    string zone_type = 3;
    repeated geometry_msgs.Point polygon = 4;
    ColorRgba fill_color = 5;
    float fill_opacity = 6;
    ColorRgba outline_color = 7;
    float outline_width = 8;
    string label = 9;
}

message SemanticZoneArray {
    std_msgs.Header header = 1;
    repeated SemanticZone zones = 2;
}

message GraphNode {
    string id = 1;
    string type = 2;
    geometry_msgs.Point coordinates = 3;
}

message GraphEdge {
    string id = 1;
    string from = 2;
    string to = 3;
    double weight = 4;
}

message RoadGraph {
    std_msgs.Header header = 1;
    repeated GraphNode nodes = 2;
    repeated GraphEdge edges = 3;
}

message FloorInfo {
    string id = 1;
    string name = 2;
    int32 level = 3;
    string slam_image_path = 4;
    double start_x = 5;
    double start_y = 6;
    int32 x_grid_count = 7;
    int32 y_grid_count = 8;
    double resolution = 9;
}

message FloorInfoArray {
    std_msgs.Header header = 1;
    repeated FloorInfo floors = 2;
    string active_floor_id = 3;
}

message CanvasLabelStyle {
    string font = 1;
    ColorRgba text_color = 2;
    ColorRgba halo_color = 3;
    float halo_blur = 4;
    int32 padding = 5;
}

message CanvasLabel {
    std_msgs.Header header = 1;
    string id = 2;
    geometry_msgs.Point position = 3;
    string label = 4;
    bool visible = 5;
}

message CanvasLabelArray {
    std_msgs.Header header = 1;
    repeated CanvasLabel labels = 2;
    CanvasLabelStyle style = 3;
}

message LabelBubble {
    std_msgs.Header header = 1;
    geometry_msgs.Point lng_lat = 2;
    string html = 3;
    float offset_x = 4;
    float offset_y = 5;
    bool visible = 6;
}

message LabelBubbleArray {
    std_msgs.Header header = 1;
    repeated LabelBubble bubbles = 2;
}

message IotBubble {
    std_msgs.Header header = 1;
    string id = 2;
    string event_type = 3;
    geometry_msgs.Point position = 4;
    string message = 5;
    int64 expire_at_ms = 6;
    bool visible = 7;
}

message IotBubbleArray {
    std_msgs.Header header = 1;
    repeated IotBubble bubbles = 2;
}

message Robot3DLayer {
    std_msgs.Header header = 1;
    string id = 2;
    string robot_id = 3;
    string model_url = 4;
    double scale = 5;
    geometry_msgs.Point offset = 6;
    double rotation_deg = 7;
    geometry_msgs.Point position = 8;
    double heading_deg = 9;
    string status = 10;
    bool visible = 11;
    double rotate_x = 12;
    double rotate_y = 13;
    double rotate_z = 14;
    double meters_scale = 15;
    string default_animation = 16;
}

message Robot3DLayerArray {
    std_msgs.Header header = 1;
    repeated Robot3DLayer layers = 2;
}
