syntax = "proto3";

package autonomy.commsgs.proto.task_msgs;

import "autonomy/commsgs/proto/builtin_interfaces.proto";
import "autonomy/commsgs/proto/geometry_msgs.proto";
import "autonomy/commsgs/proto/planning_msgs.proto";
import "autonomy/commsgs/proto/std_msgs.proto";

// --- nav2_msgs/msg ---

message BehaviorTreeStatusChange {
  builtin_interfaces.Time timestamp = 1;
  string node_name = 2;
  uint32 uid = 3;
  string previous_status = 4;
  string current_status = 5;
}

message BehaviorTreeLog {
  builtin_interfaces.Time timestamp = 1;
  repeated BehaviorTreeStatusChange event_log = 2;
}

message SpeedLimit {
  std_msgs.Header header = 1;
  bool percentage = 2;
  float speed_limit = 3;
}

message CollisionMonitorState {
  uint32 action_type = 1;
  string polygon_name = 2;
}

message CollisionDetectorState {
  repeated string polygons = 1;
  repeated bool detections = 2;
}

message WaypointStatus {
  uint32 waypoint_status = 1;
  uint32 waypoint_index = 2;
  geometry_msgs.PoseStamped waypoint_pose = 3;
  uint32 error_code = 4;
  string error_msg = 5;
}

// --- nav2_msgs/srv ---

message IsPathValid {
  message Request {
    planning_msgs.Path path = 1;
    uint32 max_cost = 2;
    bool consider_unknown_as_obstacle = 3;
  }

  message Response {
    bool is_valid = 1;
    repeated int32 invalid_pose_indices = 2;
  }

  Request request = 1;
  Response response = 2;
}

message SetInitialPose {
  message Request {
    geometry_msgs.PoseWithCovarianceStamped pose = 1;
  }

  Request request = 1;
}

message ClearEntireCostmap {
  message Request {}

  message Response {}

  Request request = 1;
  Response response = 2;
}

message ManageLifecycleNodes {
  message Request {
    uint32 command = 1;
  }

  message Response {
    bool success = 1;
  }

  Request request = 1;
  Response response = 2;
}

