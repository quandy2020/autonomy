// --- nav2_msgs/action ---

message NavigateToPoseAction {
  message Goal {
    geometry_msgs.PoseStamped pose = 1;
    string behavior_tree = 2;
  }

  message Feedback {
    geometry_msgs.PoseStamped current_pose = 1;
    builtin_interfaces.Duration navigation_time = 2;
    builtin_interfaces.Duration estimated_time_remaining = 3;
    int32 number_of_recoveries = 4;
    float distance_remaining = 5;
  }

  message Result {
    NavigateToPoseErrorCode error_code = 1;
    string error_msg = 2;
  }
}

message NavigateThroughPosesAction {
  message Goal {
    repeated geometry_msgs.PoseStamped poses = 1;
    string behavior_tree = 2;
  }

  message Feedback {
    geometry_msgs.PoseStamped current_pose = 1;
    builtin_interfaces.Duration navigation_time = 2;
    builtin_interfaces.Duration estimated_time_remaining = 3;
    int32 number_of_recoveries = 4;
    float distance_remaining = 5;
    int32 number_of_poses_remaining = 6;
  }

  message Result {
    NavigateThroughPosesErrorCode error_code = 1;
    string error_msg = 2;
  }
}

message FollowPathAction {
  message Goal {
    planning_msgs.Path path = 1;
    string controller_id = 2;
    string goal_checker_id = 3;
    string progress_checker_id = 4;
  }

  message Feedback {
    float distance_to_goal = 1;
    float speed = 2;
  }

  message Result {
    FollowPathErrorCode error_code = 1;
    string error_msg = 2;
  }
}

message ComputePathToPoseAction {
  message Goal {
    geometry_msgs.PoseStamped goal = 1;
    geometry_msgs.PoseStamped start = 2;
    string planner_id = 3;
    bool use_start = 4;
  }

  message Feedback {}

  message Result {
    planning_msgs.Path path = 1;
    builtin_interfaces.Duration planning_time = 2;
    ComputePathToPoseErrorCode error_code = 3;
    string error_msg = 4;
  }
}

message ComputePathThroughPosesAction {
  message Goal {
    planning_msgs.Goals goals = 1;
    geometry_msgs.PoseStamped start = 2;
    string planner_id = 3;
    bool use_start = 4;
  }

  message Feedback {}

  message Result {
    planning_msgs.Path path = 1;
    builtin_interfaces.Duration planning_time = 2;
    ComputePathThroughPosesErrorCode error_code = 3;
    string error_msg = 4;
  }
}

message SmoothPathAction {
  message Goal {
    planning_msgs.Path path = 1;
    string smoother_id = 2;
    builtin_interfaces.Duration max_smoothing_duration = 3;
    bool check_for_collisions = 4;
  }

  message Feedback {}

  message Result {
    planning_msgs.Path path = 1;
    builtin_interfaces.Duration smoothing_duration = 2;
    bool was_completed = 3;
    SmoothPathErrorCode error_code = 4;
    string error_msg = 5;
  }
}

message FollowWaypointsAction {
  message Goal {
    uint32 number_of_loops = 1;
    uint32 goal_index = 2;
    repeated geometry_msgs.PoseStamped poses = 3;
  }

  message Feedback {
    uint32 current_waypoint = 1;
  }

  message Result {
    repeated WaypointStatus missed_waypoints = 1;
    FollowWaypointsErrorCode error_code = 2;
    string error_msg = 3;
  }
}

message SpinAction {
  message Goal {
    float target_yaw = 1;
    builtin_interfaces.Duration time_allowance = 2;
    bool disable_collision_checks = 3;
  }

  message Feedback {
    float angular_distance_traveled = 1;
  }

  message Result {
    builtin_interfaces.Duration total_elapsed_time = 1;
    SpinErrorCode error_code = 2;
    string error_msg = 3;
  }
}

message BackUpAction {
  message Goal {
    geometry_msgs.Point target = 1;
    float speed = 2;
    builtin_interfaces.Duration time_allowance = 3;
    bool disable_collision_checks = 4;
  }

  message Feedback {
    float distance_traveled = 1;
  }

  message Result {
    builtin_interfaces.Duration total_elapsed_time = 1;
    BackUpErrorCode error_code = 2;
    string error_msg = 3;
  }
}

message DriveOnHeadingAction {
  message Goal {
    geometry_msgs.Point target = 1;
    float speed = 2;
    builtin_interfaces.Duration time_allowance = 3;
    bool disable_collision_checks = 4;
  }

  message Feedback {
    float distance_traveled = 1;
  }

  message Result {
    builtin_interfaces.Duration total_elapsed_time = 1;
    DriveOnHeadingErrorCode error_code = 2;
    string error_msg = 3;
  }
}

message WaitAction {
  message Goal {
    builtin_interfaces.Duration time = 1;
  }

  message Feedback {
    builtin_interfaces.Duration time_left = 1;
  }

  message Result {
    builtin_interfaces.Duration total_elapsed_time = 1;
    WaitErrorCode error_code = 2;
    string error_msg = 3;
  }
}

message AssistedTeleopAction {
  message Goal {
    builtin_interfaces.Duration time_allowance = 1;
  }

  message Feedback {
    builtin_interfaces.Duration current_teleop_duration = 1;
  }

  message Result {
    builtin_interfaces.Duration total_elapsed_time = 1;
    AssistedTeleopErrorCode error_code = 2;
    string error_msg = 3;
  }
}

message DummyBehaviorAction {
  message Goal {
    string command = 1;
  }

  message Result {
    builtin_interfaces.Duration total_elapsed_time = 1;
    uint32 error_code = 2;
    string error_msg = 3;
  }
}
