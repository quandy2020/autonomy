syntax = "proto3";

package autonomy.commsgs.proto.visualization;

/// 可视化服务器配置选项
message VisualizationOptions {
    /// 服务器监听地址
    string host = 1;
    
    /// 服务器监听端口
    uint32 port = 2;
    
    /// 是否启用客户端发布功能（允许 Foxglove Studio 发布消息）
    bool enable_client_publish = 3;
    
    /// 是否启用连接图功能
    bool enable_connection_graph = 4;
}
