syntax = "proto3";

package autonomy.perception.fathom.proto;

// Runtime configuration for the autolink Fathom RGB-D refinement component.
message FathomComponentConfig {
  string model_path = 1;
  string backend = 2;
  uint32 input_width = 3;
  uint32 input_height = 4;
  float depth_scale = 5;
  float mask_threshold = 6;
  string refined_depth_topic = 7;
  string point_cloud_topic = 8;
}
