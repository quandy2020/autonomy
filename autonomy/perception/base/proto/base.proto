syntax = "proto3";

package autonomy.perception.base.proto;

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_ONNX = 1;
  BACKEND_TENSORRT = 2;
}

enum TaskKind {
  TASK_UNSPECIFIED = 0;
  TASK_DETECT = 1;
  TASK_SEGMENT = 2;
  TASK_CLASSIFY = 3;
  TASK_POSE = 4;
  TASK_OBB = 5;
  TASK_TRACK = 6;
  TASK_DEPTH = 7;
}

// Monocular depth family loaded through the shared network engine.
enum DepthBackend {
  DEPTH_BACKEND_UNSPECIFIED = 0;
  // MoGe-2 ONNX/TRT: image [1,3,H,W] RGB [0,1] →
  // points / normal / mask / metric_scale. Depth is recovered in C++.
  DEPTH_BACKEND_MOGE = 1;
}

// One YOLO26 / MoGe head: enable + engine path + publish topic (+ extras).
message TaskOptions {
  TaskKind kind = 1;
  bool enable = 2;
  string model_path = 3;
  string topic = 4;
  // Pose only: keypoint count of the exported graph.
  uint32 num_keypoints = 5;
  // Depth only.
  DepthBackend depth_backend = 6;
  // MoGe: mask < threshold → NaN depth. Default 0.5 when unset/0.
  float moge_mask_threshold = 7;
  // MoGe: optional known horizontal FOV in degrees. 0 recovers from points.
  float moge_fov_x_deg = 8;
}

// YOLO26 is the shared visual backbone. Detect / segment / classify / pose /
// OBB are exported graphs of that family. Track associates detections across
// frames. Depth is an optional RGB-to-metric head on the same loader.
//
// Output wire types (automsgs only — no local message duplicates):
//   detect/segment/pose/obb/track → vision_msgs.Detection2DArray
//   classify                      → vision_msgs.Classification
//   depth                         → sensor_msgs.Image (32FC1 metres)
// Segment/pose currently publish boxes via Detection2DArray; per-pixel masks
// and keypoints are not in vision_msgs and remain unbound until a shared type
// exists.
message BaseOptions {
  Backend backend = 1;
  uint32 input_width = 2;
  uint32 input_height = 3;
  float confidence_threshold = 4;
  float nms_iou_threshold = 5;
  uint32 max_detections = 6;
  // Class index order frozen by the exported task graphs.
  repeated string class_names = 7;
  string camera_frame = 8;

  // Enabled heads. At most one entry per TaskKind; duplicates are rejected.
  repeated TaskOptions tasks = 10;
}
