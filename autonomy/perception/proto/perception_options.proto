syntax = "proto3";

package autonomy.perception.proto;

message PerceptionOptions {
  bool enabled = 1;
  bool enable_rgbd_exploration = 2;
  string exploration_config = 3;
  string odom_topic = 4;
  string depth_topic = 5;
  string camera_info_topic = 6;
  string camera_frame = 7;
  string map_frame = 8;
  double planner_hz = 9;
  string path_topic = 10;
  string waypoint_topic = 11;
  string map_topic = 12;
  string explorer_backend = 13;
  string point_cloud_topic = 14;
  string global_path_topic = 15;
  string local_path_topic = 16;
  string exploration_finished_topic = 17;
  string exploration_progress_topic = 18;
  string navigation_boundary_topic = 19;
  string terrain_map_topic = 20;
  bool enable_exploration_nav_bridge = 21;
  string prior_map_topic = 22;
  string vg_markers_topic = 23;
  bool enable_yopo_track = 24;
  string track_config = 25;
  string cmd_vel_topic = 26;
}
