syntax = "proto3";

package autonomy.perception.hestia.proto;

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_OPEN = 1;
  MODE_DUAL = 2;
}

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_ONNX = 1;
  BACKEND_TENSORRT = 2;
}

// Single runtime configuration for Hestia open-vocabulary home perception.
message HestiaOptions {
  Mode mode = 1;
  string open_model_path = 2;
  string home_model_path = 3;
  Backend backend = 4;
  uint32 open_width = 5;
  uint32 open_height = 6;
  uint32 home_width = 7;
  uint32 home_height = 8;
  uint32 max_detections = 9;
  float confidence_threshold = 10;
  // Ordered open prompts matching the exported open model class indices.
  repeated string open_prompts = 11;
  // Ordered home labels matching the exported home model class indices.
  repeated string home_labels = 12;
  float depth_scale = 13;
  float min_depth_m = 14;
  float max_depth_m = 15;
  uint32 min_depth_samples = 16;
  float inner_box_scale = 17;
  float depth_outlier_m = 18;
  string camera_frame = 19;
  string base_frame = 20;
  float association_iou_threshold = 21;
  float lost_timeout_sec = 22;
  float merge_iou_threshold = 23;
  string detections_2d_topic = 24;
  string detections_3d_topic = 25;
  float max_input_skew_sec = 27;
  // Dual mode: run open detection on a background Async slot (stale-OK).
  bool open_async = 30;
  // Optional post-decode NMS; 0 disables (assume export already applied NMS).
  float nms_iou_threshold = 31;
  // TF lookup timeout when lifting into base_frame.
  float tf_timeout_sec = 32;

  reserved 26, 28, 29;
  reserved "query_topic", "max_data_age_sec", "use_fathom_depth",
      "open_async_queue";
}
