syntax = "proto3";

package autonomy.driver.proto;

// 测距传感器辐射类型枚举
enum RangeRadiationType {
    ULTRASOUND = 0;    // 超声波
    INFRARED = 1;      // 红外
}

// 测距传感器配置选项
message RangeOptions {
    // 传感器ID（唯一标识符）
    string sensor_id = 1;
    
    // 订阅的主题名称
    string topic = 2;
    
    // 传感器坐标系ID
    string frame_id = 3;
    
    // 是否启用该传感器
    bool enabled = 4;
    
    // 辐射类型（超声波、红外等）
    RangeRadiationType radiation_type = 5;
    
    // 视场角（弧度）
    double field_of_view = 6;
    
    // 最小测距范围（米）
    double min_range = 7;
    
    // 最大测距范围（米）
    double max_range = 8;
    
    // 数据转发目标列表（可选，如 "map", "localization" 等）
    repeated string forward_targets = 9;
    
    // 采样率（Hz，0表示使用原始频率）
    double sampling_rate = 10;
}
