syntax = "proto3";

package autonomy.driver.proto;

// GPS状态枚举
enum GpsStatus {
    GPS_STATUS_UNAVAILABLE = 0;    // 不可用
    GPS_STATUS_NO_FIX = 1;         // 无定位
    GPS_STATUS_OK = 2;             // 正常定位
    GPS_STATUS_GBAS_FIX = 3;       // GBAS定位
}

// GPS服务类型枚举
enum GpsService {
    GPS_SERVICE_UNKNOWN = 0;       // 未知
    GPS_SERVICE_GPS = 1;           // GPS
    GPS_SERVICE_GLONASS = 2;       // GLONASS
    GPS_SERVICE_COMPASS = 4;       // 北斗
    GPS_SERVICE_GALILEO = 8;       // 伽利略
}

// GPS/导航卫星配置选项
message GpsOptions {
    // 传感器ID（唯一标识符）
    string sensor_id = 1;
    
    // 订阅的主题名称（NavSatFix）
    string topic = 2;
    
    // 传感器坐标系ID（通常是 "gps" 或 "navsat"）
    string frame_id = 3;
    
    // 是否启用该传感器
    bool enabled = 4;
    
    // 最小定位精度阈值（米），超过此值的数据将被过滤
    double min_position_accuracy = 5;
    
    // 最小高度精度阈值（米），超过此值的数据将被过滤
    double min_altitude_accuracy = 6;
    
    // 数据转发目标列表（可选，如 "localization", "map" 等）
    repeated string forward_targets = 7;
    
    // 采样率（Hz，0表示使用原始频率）
    double sampling_rate = 8;
    
    // 是否使用GPS数据进行定位融合
    bool use_for_localization = 9;
    
    // GPS服务类型（位掩码，可以组合多种服务）
    uint32 service_type = 10;
}
