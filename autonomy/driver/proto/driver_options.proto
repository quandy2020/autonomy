syntax = "proto3";

package autonomy.driver.proto;

import "autonomy/driver/proto/lidar_options.proto";
import "autonomy/driver/proto/imu_options.proto";
import "autonomy/driver/proto/camera_options.proto";
import "autonomy/driver/proto/range_options.proto";
import "autonomy/driver/proto/gps_options.proto";

// 驱动引擎配置选项
message DriverOptions {
    // 激光雷达配置列表
    repeated LidarOptions lidars = 1;
    
    // IMU配置列表
    repeated ImuOptions imus = 2;
    
    // 相机配置列表
    repeated CameraOptions cameras = 3;
    
    // 测距传感器配置列表
    repeated RangeOptions ranges = 4;
    
    // GPS/导航卫星配置列表
    repeated GpsOptions gps_sensors = 5;
    
    // 是否自动启动传感器订阅
    bool auto_start = 6;
    
    // 默认传感器数据转发目标（可选）
    repeated string default_forward_targets = 7;
}
