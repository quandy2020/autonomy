syntax = "proto3";

package autonomy.driver.proto;

// 相机类型枚举
enum CameraType {
    MONO = 0;           // 单目相机
    STEREO = 1;         // 双目相机
    RGBD = 2;           // RGB-D相机
}

// 相机配置选项
message CameraOptions {
    // 传感器ID（唯一标识符）
    string sensor_id = 1;
    
    // 相机类型
    CameraType type = 2;
    
    // 图像主题名称
    string image_topic = 3;
    
    // 相机信息主题名称（可选）
    string camera_info_topic = 4;
    
    // 深度图像主题名称（仅用于RGBD相机，可选）
    string depth_topic = 5;
    
    // 传感器坐标系ID
    string frame_id = 6;
    
    // 是否启用该传感器
    bool enabled = 7;
    
    // 图像宽度（像素，0表示使用原始尺寸）
    uint32 width = 8;
    
    // 图像高度（像素，0表示使用原始尺寸）
    uint32 height = 9;
    
    // 图像编码格式（如 "rgb8", "bgr8", "mono8" 等）
    string encoding = 10;
    
    // 数据转发目标列表（可选，如 "perception", "visualization" 等）
    repeated string forward_targets = 11;
    
    // 采样率（Hz，0表示使用原始频率）
    double sampling_rate = 12;
}
