# Sensor block selects the mode. Backend is always Ceres.
schema: atlas
platform_name: autosim_lio
mission: mapping

sensors:
  camera: false
  imu: true
  lidar: true

frontend:
  fusion: loose

camera:
  sensor: mono
  type: PinHole
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0
  width: 640
  height: 480
  fps: 20

imu:
  frequency: 200
  noise_gyro: 0.0001
  noise_acc: 0.001

lidar_map:
  directory: ""
  chunk_size: 20
  blind: 0.5
  stride: 1

reloc:
  xy_radius: 4
  xy_step: 2

occupancy:
  resolution: 0.1
  min_z: 0.2
  max_z: 1.5
  max_range: 40.0

backend:
  type: ceres
  max_iterations: 10
  pose_weight: 10.0
  visual_weight: 1.0

# Faster-LIO ESKF / ivox, G2P5, loop closing, NDT localization.
fasterlio:
  lidar_type: 5
  scan_line: 32
  blind: 0.3
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 1
  max_iteration: 4
  filter_size_scan: 0.10
  filter_size_map: 0.10
  global_map_voxel: 0.05
  ivox_grid_resolution: 0.20
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T: [-0.032, 0.0, 0.104]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  keep_first_imu_estimation: false
  kf_dis_th: 0.35
  kf_angle_th: 8.0
  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 200
  imu_filter: false
  proj_kfs: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -0.2
  min_th_floor: 0.2
  max_th_floor: 1.5
  grid_map_resolution: 0.1

system:
  with_loop_closing: true
  with_g2p5: true
  step_on_kf: false
  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ""
  pub_tf: true

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  max_candidates: 1
  loop_place_radius: 4.0
  max_reloc_snap: 1.5
  with_height: false

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: false
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  height_max: 100.0
  height_min: -100.0
  range_max: 70
  range_min: 0.5
