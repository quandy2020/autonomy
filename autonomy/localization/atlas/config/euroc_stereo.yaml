platform_name: euroc_stereo

frontend:
  mode: vo
  fusion: loose
  vo:
    enabled: true
  vio:
    enabled: false

# EuRoC cam0; baseline ≈ ||t_c1_c2|| from ORB-SLAM3 Stereo.T_c1_c2
camera:
  sensor: stereo
  type: PinHole
  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375
  baseline: 0.110074
  bf: 50.4306
  depth_threshold: 60.0
  width: 752
  height: 480
  fps: 20.0
  rgb: true
  distortion: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]

orb:
  n_features: 1200
  scale_factor: 1.2
  n_levels: 8
  ini_th_fast: 20
  min_th_fast: 7

vocabulary: autonomy/localization/conf/atlas/orb_vocab.fbow

backend:
  type: ceres
  window_size: 10
  max_iterations: 15
