platform_name: euroc_mono_inertial

frontend:
  mode: vio
  fusion: tight
  vo:
    enabled: false
  vio:
    enabled: true

# EuRoC cam0 pinhole (ASL / ORB-SLAM3 EuRoC.yaml)
camera:
  sensor: mono
  type: PinHole
  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375
  baseline: 0.0
  width: 752
  height: 480
  fps: 20.0
  rgb: true
  distortion: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]

orb:
  n_features: 1000
  scale_factor: 1.2
  n_levels: 8
  ini_th_fast: 20
  min_th_fast: 7

vocabulary: autonomy/localization/conf/atlas/orb_vocab.fbow

backend:
  type: ceres
  window_size: 10
  max_iterations: 15

# IMU noise + T_b_c (body ← camera), ORB-SLAM3 EuRoC IMU.T_b_c1
imu:
  noise_gyro: 1.7e-4
  noise_acc: 2.0e-3
  walk_gyro: 1.9393e-5
  walk_acc: 3.0e-3
  frequency: 200.0
  insert_kfs_when_lost: true
  T_b_c: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
          0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768,
          -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
          0.0, 0.0, 0.0, 1.0]
