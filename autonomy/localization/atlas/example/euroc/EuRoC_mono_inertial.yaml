# EuRoC monocular-inertial model (enable IMU fusion in Atlas)

Camera:
  name: "EuRoC monocular"
  setup: "monocular"
  model: "perspective"

  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375

  k1: -0.28340811
  k2: 0.07395907
  p1: 0.00019359
  p2: 1.76187114e-05
  k3: 0.0

  fps: 20.0
  cols: 752
  rows: 480

  color_order: "Gray"

# Visual-inertial fusion (ORB-SLAM3-style pipeline inside Atlas)
IMU:
  enabled: true
  frequency: 200.0
  noise_acc: 0.02
  noise_gyro: 0.0017
  random_walk_acc: 0.003
  random_walk_gyro: 0.00017
  gravity_magnitude: 9.81
  time_offset: 0.0
  time_sync_slop: 0.02
  init_min_keyframes: 10
  # T_c_b = inv(T_BS): IMU(body) -> cam0. T_BS from EuRoC/ASL (cam0 sensor.yaml)
  # matches ORB-SLAM3 EuRoC.yaml Tbc inverted.
  R_c_b: [0.0148655429818, 0.999557249008, -0.0257744366974,
          -0.999880929698, 0.0149672133247, 0.00375618835797,
          0.00414029679422, 0.025715529948, 0.999660727178]
  t_c_b: [0.0652229095355, -0.0207063854927, -0.0080546024600]
  buffer_capacity: 20000

Preprocessing:
  min_size: 800

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  use_inertial: true
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20
  erase_temporal_keyframes: false
  num_temporal_keyframes: 15

Tracking:
  backend: "g2o"
  enable_temporal_keyframe_only_tracking: false

KeyframeInserter:
  wait_for_local_bundle_adjustment: false

Relocalizer:
  search_neighbor: true

LoopDetector:
  backend: "g2o"

System:
  map_format: "msgpack"
  num_grid_cols: 47
  num_grid_rows: 30
