# Default fusion / extrinsics notes for Atlas multimodal modes.
# Loaded by tools or documented for operators (orchestrator currently uses
# Extrinsics defaults; YAML load can be added later).

extrinsics:
  # Lidar -> camera
  R_c_l: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  t_c_l: [0.0, 0.0, 0.0]
  # Base -> wheel
  R_b_w: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  t_b_w: [0.0, 0.0, 0.0]
  time_offset_imu: 0.0
  time_offset_lidar: 0.0
  time_offset_cam: 0.0
  time_offset_wheel: 0.0

fusion:
  max_assoc_dt: 0.05
  vision_weight: 0.4
  lidar_weight: 0.6
  wheel_slip_scale: 1.0
