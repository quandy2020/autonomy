# Atlas multimodal calibration (camera / IMU / lidar)
# Optical camera undistort → sensor/camera or util/calibration/undistort.hpp
# Lidar motion deskew → frontend/lio + T_imu_lidar

camera:
  model: perspective   # perspective | fisheye
  width: 752
  height: 480
  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375
  fps: 20.0
  # OpenCV order: k1, k2, p1, p2, k3
  distortion: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05, 0.0]

imu:
  gyro_noise: 0.001
  acc_noise: 0.01
  gyro_bias_noise: 1.0e-5
  acc_bias_noise: 1.0e-4
  gravity: [0.0, 0.0, -9.81]

lidar:
  model: generic       # generic | velodyne | ouster | livox
  min_range: 0.5
  max_range: 80.0
  scan_period: 0.1
  range_scale: 1.0
  range_bias: 0.0

extrinsics:
  # p_imu = R * p_lidar + t
  T_imu_lidar:
    R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    t: [0.0, 0.0, 0.0]
  # p_cam = R * p_imu + t
  T_cam_imu:
    R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    t: [0.0, 0.0, 0.0]
  # optional; else T_cam_imu * T_imu_lidar
  # T_cam_lidar:
  #   R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  #   t: [0.0, 0.0, 0.0]
  T_base_wheel:
    R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    t: [0.0, 0.0, 0.0]
  time_offset_imu: 0.0
  time_offset_lidar: 0.0
  time_offset_cam: 0.0
  time_offset_wheel: 0.0
