# Pure-lidar localization against a prior TiledMap (NDT via LidarLocator).
# LocalEstimator pose authority; no vision YAML.
# Fill maps.tiled_path with a directory containing index.yaml + chunk_*.pcd.

modality: lo

lidar_config_path: autonomy/localization/conf/atlas/lightning/lo_loc.yaml
enable_lidar_loc: true

sensors:
  imu:    { enabled: false }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: false }

residuals:
  vision: false
  imu: false
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: false

maps:
  dense_rgbd: false
  g2p5: true
  g2p5_topic: /atlas/g2p5/occupancy
  tiled: true
  tiled_path: ""  # user fills
  # Dyn layer retention for incremental updates (short|medium|permanent).
  dyn_cloud_policy: medium
