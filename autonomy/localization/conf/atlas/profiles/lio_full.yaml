# Full-product LIO: LocalEstimator + lidar geometric loop enabled.
# Same as lio.yaml but lidar_config_path → lightning/lio_full.yaml
# (use_lidar_loop: true). default.yaml loop flag stays false.
#
# Optional: maps.g2p5_save_path → Shutdown writes map.pgm + map.yaml.

modality: lio

# Camera / IMU / lidar intrinsics + T_imu_lidar (deskew / ObsModel).
calibration_path: autonomy/localization/conf/atlas/calibration/default.yaml
lidar_config_path: autonomy/localization/conf/atlas/lightning/lio_full.yaml

sensors:
  imu:    { enabled: true,  topic: /imu }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: false }

residuals:
  vision: false
  imu: true
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: false
  g2p5: true
  g2p5_topic: /atlas/g2p5/occupancy
  # g2p5_save_path: /tmp/atlas_g2p5_map
  tiled: false
