# Readiness: LocalEstimator path (lidar pose authority, no vision YAML).
# LidarBridge → UpdateLidar + VizBridge PublishWorldPose.
#
# Lidar preprocess: lidar_config_path (or lightning_yaml). use_lidar_loop stays
# false in default.yaml — flip one flag there to enable geometric loop.

modality: lo

lidar_config_path: autonomy/localization/conf/atlas/lightning/default.yaml

sensors:
  imu:    { enabled: false }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: false }

residuals:
  vision: false
  imu: false
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: false
  g2p5: true
  g2p5_topic: /atlas/g2p5/occupancy
