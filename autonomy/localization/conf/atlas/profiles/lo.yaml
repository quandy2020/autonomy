# Readiness: LocalEstimator path (lidar pose authority, no vision YAML).
# LidarBridge → UpdateLidar + VizBridge PublishWorldPose.

modality: lo

sensors:
  imu:    { enabled: false }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: false }

residuals:
  vision: false
  imu: false
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: false
  g2p5: true
