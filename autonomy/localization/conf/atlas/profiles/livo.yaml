# Readiness: vision + staged Local/Global Joint BA (ResidualMask).
# Requires --atlas_config; CameraBridge + ImuBridge + LidarBridge → system.

modality: livo

sensors:
  imu:    { enabled: true,  topic: /imu }
  camera: { enabled: true,  rgb_topic: /camera/rgb/image_raw, depth_topic: /camera/depth/image_raw }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: false, topic: /wheel_odom }

residuals:
  vision: true
  imu: true
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: true
  g2p5: false
