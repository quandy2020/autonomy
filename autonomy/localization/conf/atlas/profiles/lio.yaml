# Readiness: LocalEstimator path (IMU predict + lidar update).
# ImuBridge(est) + LidarBridge(est) + VizBridge; no vision YAML.
#
# Wheel /odom: seed T_wb only (OdomBridge.apply_relative_odom=false for LIO).
# Lidar loop + ObsModel ICP: lightning/lio_full.yaml.

modality: lio

# Camera / IMU / lidar intrinsics + T_imu_lidar (deskew / ObsModel).
calibration_path: autonomy/localization/conf/atlas/calibration/default.yaml
lidar_config_path: autonomy/localization/conf/atlas/lightning/lio_full.yaml

sensors:
  imu:    { enabled: true,  topic: /imu }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  # Seed map≈odom once; continuous UpdateOdom is disabled for LIO.
  odom:   { enabled: true,  topic: /odom }

residuals:
  vision: false
  imu: true
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: false
  g2p5: true
  g2p5_topic: /atlas/g2p5/occupancy
  tiled: false
