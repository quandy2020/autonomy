# Readiness: LocalEstimator path (IMU predict + lidar update).
# ImuBridge(est) + LidarBridge(est) + VizBridge; no vision YAML.
#
# Lidar geometric loop (unified State via LocalEstimator, not second SLAM):
# enable in lidar yaml (e.g. conf/atlas/lightning/default.yaml):
#   use_lidar_loop: true
# Default remains false so VO/LIVO are undisturbed.

modality: lio

# Camera / IMU / lidar intrinsics + T_imu_lidar (deskew / ObsModel).
calibration_path: conf/atlas/calibration/default.yaml

sensors:
  imu:    { enabled: true,  topic: /imu }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: false }

residuals:
  vision: false
  imu: true
  lidar: true
  odom: false

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: false
  g2p5: true
  tiled: false
