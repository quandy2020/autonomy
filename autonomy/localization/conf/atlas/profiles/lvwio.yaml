# Readiness: vision + staged joint (livo) + odom residuals into JointBA.
# OdomBridge estimator=nullptr; OdomSensor residuals wired via AttachSystem.

modality: lvwio

sensors:
  imu:    { enabled: true,  topic: /imu }
  camera: { enabled: true,  rgb_topic: /camera/rgb/image_raw, depth_topic: /camera/depth/image_raw }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: true,  topic: /wheel_odom }

residuals:
  vision: true
  imu: true
  lidar: true
  odom: true

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: true
  g2p5: true
