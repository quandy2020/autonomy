# Readiness: LocalEstimator path (IMU + lidar + odom all update est).
# ImuBridge + LidarBridge + OdomBridge(est, viz) + VizBridge; no vision YAML.

modality: lwio

sensors:
  imu:    { enabled: true,  topic: /imu }
  camera: { enabled: false }
  lidar:  { enabled: true,  topic: /points }
  odom:   { enabled: true,  topic: /wheel_odom }

residuals:
  vision: false
  imu: true
  lidar: true
  odom: true

system:
  thread_pool_size: 4
  use_pool_mapping: true
  use_pool_backend: true
  with_loop_closing: true

maps:
  dense_rgbd: false
  g2p5: true
