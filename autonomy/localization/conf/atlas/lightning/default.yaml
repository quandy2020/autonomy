# Default lidar preprocess / IVox params for sensor/lidar/lightning.
# Referenced via RuntimeConfig.lidar_config_path or profile lightning_yaml.

preprocess:
  min_range: 0.5
  max_range: 80.0
  blind: 0.1
  voxel_leaf: 0.2
  max_points: 20000

ivox:
  resolution: 0.5
  max_points_per_voxel: 20
  neighbor_search: 1
  min_plane_points: 5

obs_model:
  max_distance: 0.5
  max_residuals: 2000
  enable_ground_prior: false
