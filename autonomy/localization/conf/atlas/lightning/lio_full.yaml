# Full-product LIO lidar preprocess / IVox (loop enabled).
# Profile: conf/atlas/profiles/lio.yaml + lio_full.yaml → lidar_config_path here.
# Frontend params aligned with lightning-lm fasterlio defaults where applicable.

preprocess:
  lidar_type: generic   # generic | velodyne | ouster | livox
  min_range: 0.5
  max_range: 80.0
  blind: 0.1
  # lightning filter_size_scan default 0.5
  voxel_leaf: 0.5
  max_points: 20000
  use_point_time: false

# Gyro multi-stage filter before deskew (Lightning fasterlio.imu_filter).
# Autosim IMU is already m/s² — keep off unless gyro is very noisy.
imu_filter: false
imu_filter_options:
  median_window_size: 5
  moving_avg_window: 3
  rate_limit: 3.0
  spike_threshold: 3.0

# Geometric lidar loop: NDT + LidarPoseGraph → SetPose + rebuild IVox.
# ICP-only off: false loops early in run jump pose + wipe IVox.
use_lidar_loop: true
lidar_loop:
  candidate_radius_m: 15.0
  # Skip recent KFs (~24m @ 0.8m KF) so Detect cannot hit start while mapping.
  skip_recent_n: 30
  min_keyframes: 40
  allow_icp_only: false
  inlier_ratio_thresh: 0.50
  mean_residual_thresh: 0.06
  ndt_score_thresh: 1.5
  submap_kf_radius: 5

# Keyframe gate for loop + G2P5 (meters / rad).
keyframe:
  min_distance_m: 0.8
  min_angle_rad: 0.15

publish_global_cloud: true
global_cloud_topic: /atlas/cloud_map
global_cloud_frame: map
global_cloud_max_points: 200000
global_cloud_period_sec: 0.5

smooth_factor: 0.5
pose_extrapolator:
  smooth_factor: 0.5
  use_imu_predict: true
  gyro_static_thresh: 0.02
  # Must stay false for LIO: true + SetPose(zero_v) killed |v| every scan.
  sync_estimator_on_lidar: false

ivox:
  # lightning ivox_grid_resolution=0.5, ivox_nearby_type=18
  resolution: 0.5
  max_points_per_voxel: 20
  max_voxels: 200000
  neighbor_search: 1
  min_plane_points: 5
  nearby_type: nearby18
  node_kind: linear
  phc_order: 6
  knn_max_num: 5
  knn_max_range: 5.0
  esti_plane_threshold: 0.1
  use_morton_key: false
  use_hilbert_key: false

map_incremental:
  selective_insert: true
  max_insert_no_nn: 600
  max_insert_per_scan: 2500

obs_model:
  max_distance: 0.5
  max_residuals: 2000
  enable_ground_prior: false
  # lightning enable_icp_part default false
  enable_icp_part: false
  plane_weight: 1.0
  icp_weight: 0.1
  icp_max_distance: 0.5
  srange_scale: 81.0
