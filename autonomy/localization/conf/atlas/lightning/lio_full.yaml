# Full-product LIO — aligned to lightning/conf/lightning/autosim.yaml (fasterlio).
# Profile: conf/atlas/profiles/lio_full.yaml → lidar_config_path here.
#
# Density / weight notes (Atlas vs Lightning):
#   voxel_leaf ↔ filter_size_scan/map = 0.10
#   ivox.resolution ↔ ivox_grid_resolution = 0.20
#   plane_weight: Atlas UpdateLidar uses w = plane_weight / lidar_noise²
#                 (default lidar_noise=0.1 → /0.01). plane_weight=3 → ≈300
#                 (= lightning plane_icp_weight).

preprocess:
  lidar_type: generic   # generic | velodyne | ouster | livox
  min_range: 0.3
  max_range: 80.0
  blind: 0.3
  voxel_leaf: 0.10
  max_points: 20000
  use_point_time: false

# Gyro multi-stage filter before deskew (Lightning fasterlio.imu_filter).
# Autosim IMU is already m/s² — keep off unless gyro is very noisy.
imu_filter: false
imu_filter_options:
  median_window_size: 5
  moving_avg_window: 3
  rate_limit: 3.0
  spike_threshold: 3.0

# Geometric lidar loop: NDT + LidarPoseGraph → SetPose + rebuild IVox.
# ICP-only off: false loops early in run jump pose + wipe IVox.
use_lidar_loop: true
lidar_loop:
  candidate_radius_m: 15.0
  # Align with lightning loop_closing.min_id_interval / closest_id_th.
  skip_recent_n: 20
  min_keyframes: 25
  allow_icp_only: false
  inlier_ratio_thresh: 0.45
  mean_residual_thresh: 0.08
  ndt_score_thresh: 1.3
  submap_kf_radius: 5

# Keyframe gate (lightning kf_dis_th=0.35, kf_angle_th=8°).
keyframe:
  min_distance_m: 0.35
  min_angle_rad: 0.1396   # 8 deg

publish_global_cloud: true
global_cloud_topic: /atlas/cloud_map
global_cloud_frame: map
global_cloud_max_points: 200000
global_cloud_period_sec: 0.5

smooth_factor: 0.5
pose_extrapolator:
  smooth_factor: 0.5
  use_imu_predict: true
  gyro_static_thresh: 0.02
  # Must stay false for LIO: true + SetPose(zero_v) killed |v| every scan.
  sync_estimator_on_lidar: false

ivox:
  # lightning autosim: ivox_grid_resolution=0.20, nearby18
  resolution: 0.20
  max_points_per_voxel: 20
  max_voxels: 200000
  neighbor_search: 1
  min_plane_points: 5
  nearby_type: nearby18
  node_kind: linear
  phc_order: 6
  knn_max_num: 5
  knn_max_range: 5.0
  esti_plane_threshold: 0.1
  use_morton_key: false
  use_hilbert_key: false

map_incremental:
  selective_insert: true
  max_insert_no_nn: 2000
  max_insert_per_scan: 8000

obs_model:
  max_distance: 0.5
  max_residuals: 4000
  enable_ground_prior: false
  enable_icp_part: false
  # ≈ lightning plane_icp_weight 300 when /lidar_noise² (0.01)
  plane_weight: 3.0
  icp_weight: 0.1
  icp_max_distance: 0.5
  srange_scale: 81.0
