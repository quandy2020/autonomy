# Default body IMU (noise in continuous-time SI units)
name: default
rate_hz: 200.0
gravity: 9.81
# T_body_imu
extrinsic:
  translation: [0.0, 0.0, 0.0]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
noise:
  acc_n: 0.1          # m/s^2 / sqrt(Hz)
  gyr_n: 0.01         # rad/s / sqrt(Hz)
  acc_w: 0.001        # bias random walk
  gyr_w: 0.0001
initial_bias:
  accel: [0.0, 0.0, 0.0]
  gyro: [0.0, 0.0, 0.0]
