# Livox Mid-360 style spinning / solid-state lidar
name: mid360
driver: livox
rate_hz: 10.0
range:
  min_m: 0.1
  max_m: 70.0
# T_body_lidar
extrinsic:
  translation: [0.0, 0.0, 0.08]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
preprocess:
  voxel_size: 0.2
  blind_m: 0.5
deskew:
  enabled: true
filter:
  remove_ground: false
  intensity_min: 0.0
noise:
  range_sigma: 0.02
  point_sigma: 0.05
