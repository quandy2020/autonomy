# Atla2 platform: lidar odometry only (no IMU)
frontend:
  mode: lo
  fusion: loose
  vio:
    enabled: false
  lio:
    enabled: true
    lidar: mid360

sensor:
  gps:
    enabled: false

backend:
  type: iekf

map:
  max_local_map_points: 80000
  voxel_size: 0.2

sync_tol_ms: 20.0
platform_name: drone_lo
