# Graph / Ceres sliding-window backend (alias of type: ceres|graph)
type: graph
window_size: 10
max_iterations: 15
pose_weight: 10.0
imu_weight: 1.0
visual_weight: 1.0
lidar_weight: 1.0
gps_weight: 0.5
camera:
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0
marginalization:
  enabled: true
  schur: dense
loop_closure:
  enabled: false
