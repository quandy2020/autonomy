syntax = "proto3";

package autonomy.localization.atla2.proto;

import "common/feature_observation.proto";
import "common/landmark.proto";
import "common/odometry_state.proto";

// VIO result: pose + bias (in state) + landmarks.
message VioResult {
  OdometryState state = 1;
  repeated Landmark landmarks = 2;
  repeated FeatureObservation observations = 3;
  int32 window_size = 4;
}
