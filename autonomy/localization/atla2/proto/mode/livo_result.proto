syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/sensor_msgs/point_cloud2.proto";
import "common/feature_observation.proto";
import "common/fusion_style.proto";
import "common/landmark.proto";
import "common/odometry_state.proto";

// LIVO result: vision landmarks + lidar local map + fused state.
message LivoResult {
  OdometryState state = 1;
  FusionStyle fusion = 2;
  repeated Landmark landmarks = 3;
  repeated FeatureObservation observations = 4;
  automsgs.msgs.sensor_msgs.PointCloud2 local_map = 5;
  double visual_residual = 6;
  double lidar_residual = 7;
}
