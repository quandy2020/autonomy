syntax = "proto3";

package autonomy.localization.atla2.proto;

// Sensor-failure degradation ladder for multi-modal SLAM.
enum DegradationLevel {
  DEGRADATION_LEVEL_UNSPECIFIED = 0;
  DEGRADATION_LEVEL_FULL = 1;       // all configured modalities OK
  DEGRADATION_LEVEL_LIO_ONLY = 2;
  DEGRADATION_LEVEL_VIO_ONLY = 3;
  DEGRADATION_LEVEL_LO_ONLY = 4;    // lidar odometry only
  DEGRADATION_LEVEL_VO_ONLY = 5;
  DEGRADATION_LEVEL_IMU_COAST = 6;
}
