syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/geometry_msgs/pose_with_covariance.proto";
import "automsgs/msgs/std_msgs/header.proto";
import "common/imu_preintegration.proto";

// Backend / fusion factor edge for debug logs and bag replay.
message GraphFactorEdge {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PRIOR_POSE = 1;
    TYPE_RELATIVE_POSE = 2;
    TYPE_IMU_PREINT = 3;
    TYPE_VISUAL_REPROJ = 4;
    TYPE_LIDAR_POINT_TO_PLANE = 5;
    TYPE_GPS_POSITION = 6;
    TYPE_BARO_ALTITUDE = 7;
    TYPE_LOOP_CLOSURE = 8;
  }

  automsgs.msgs.std_msgs.Header header = 1;
  Type type = 2;
  int32 node_i = 3;
  int32 node_j = 4;
  int32 landmark_id = 5;
  double weight = 6;
  double residual = 7;

  automsgs.msgs.geometry_msgs.PoseWithCovariance relative_pose = 8;
  ImuPreintegration imu = 9;
  // Visual: uv observation (pixels) as x,y; z unused.
  double u = 10;
  double v = 11;
}
