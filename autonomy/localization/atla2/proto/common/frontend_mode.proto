syntax = "proto3";

package autonomy.localization.atla2.proto;

// Frontend / odometry mode selection (VO / VIO / LO / LIO / LIVO).
enum FrontendMode {
  FRONTEND_MODE_UNSPECIFIED = 0;
  FRONTEND_MODE_VO = 1;    // vision only
  FRONTEND_MODE_VIO = 2;   // vision + IMU
  FRONTEND_MODE_LO = 3;    // lidar odometry (no IMU)
  FRONTEND_MODE_LIO = 4;   // lidar + IMU
  FRONTEND_MODE_LIVO = 5;  // lidar + vision + IMU
}
