syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/sensor_msgs/camera_info.proto";
import "automsgs/msgs/std_msgs/header.proto";
import "common/extrinsic_set.proto";
import "common/sensor_kind.proto";

// Output of calibration_tool CLIs.
message CalibrationResult {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CAMERA_INTRINSIC = 1;
    KIND_CAMERA_IMU = 2;
    KIND_LIDAR_IMU = 3;
    KIND_CAMERA_LIDAR = 4;
    KIND_JOINT = 5;
  }

  automsgs.msgs.std_msgs.Header header = 1;
  Kind kind = 2;
  repeated SensorKind sensors = 3;
  ExtrinsicSet extrinsics = 4;
  automsgs.msgs.sensor_msgs.CameraInfo camera_info = 5;
  // Camera–IMU / lidar–IMU time offset [s].
  double time_offset_s = 6;
  double reprojection_rmse_px = 7;
  double fitness_score = 8;
  bool success = 9;
  string message = 10;
  string output_yaml = 11;
}
