syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/std_msgs/header.proto";

// Single feature observation on an image (for debug / factor logging).
message FeatureObservation {
  automsgs.msgs.std_msgs.Header header = 1;
  int32 landmark_id = 2;
  int32 feature_id = 3;
  int32 camera_index = 4;  // 0=left/mono, 1=right
  automsgs.msgs.geometry_msgs.Point uv = 5;
  double inv_depth = 6;
  bool is_outlier = 7;
}
