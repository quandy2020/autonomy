syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/builtin_interfaces/time.proto";
import "automsgs/msgs/geometry_msgs/quaternion.proto";
import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/std_msgs/header.proto";
import "common/imu_bias.proto";

// IMU preintegration between two keyframes / frames (VIO factor logging).
message ImuPreintegration {
  automsgs.msgs.std_msgs.Header header = 1;
  automsgs.msgs.builtin_interfaces.Time t0 = 2;
  automsgs.msgs.builtin_interfaces.Time t1 = 3;
  double dt = 4;

  // ΔR as quaternion (body_i ← body_j incremental).
  automsgs.msgs.geometry_msgs.Quaternion delta_q = 5;
  automsgs.msgs.geometry_msgs.Vector3 delta_v = 6;
  automsgs.msgs.geometry_msgs.Vector3 delta_p = 7;

  ImuBias bias_linearization = 8;
  // 15x15 covariance row-major (optional; empty if unused).
  repeated double covariance = 9;
}
