syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/geometry_msgs/point.proto";

// Visual landmark (VIO / LIVO / VO). Position in world / map frame.
message Landmark {
  int32 id = 1;
  automsgs.msgs.geometry_msgs.Point position = 2;
  // Latest observation in image plane (pixels); (0,0) if unset.
  automsgs.msgs.geometry_msgs.Point uv = 3;
  bool has_uv = 4;
  double inv_depth = 5;
}
