syntax = "proto3";

package autonomy.localization.atla2.proto;

// Pipeline tracking state (mirrors SlamState).
enum SlamState {
  SLAM_STATE_UNSPECIFIED = 0;
  SLAM_STATE_UNINITIALIZED = 1;
  SLAM_STATE_INITIALIZING = 2;
  SLAM_STATE_TRACKING = 3;
  SLAM_STATE_LOST = 4;
  SLAM_STATE_DEGRADED = 5;
}
