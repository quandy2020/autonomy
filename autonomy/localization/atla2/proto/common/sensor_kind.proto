syntax = "proto3";

package autonomy.localization.atla2.proto;

// Sensor modality kind (mirrors SensorKind).
enum SensorKind {
  SENSOR_KIND_UNSPECIFIED = 0;
  SENSOR_KIND_CAMERA = 1;
  SENSOR_KIND_IMU = 2;
  SENSOR_KIND_LIDAR = 3;
  SENSOR_KIND_GPS = 4;
  SENSOR_KIND_BAROMETER = 5;
  SENSOR_KIND_OPTICAL_FLOW = 6;
}
