syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/geometry_msgs/pose_with_covariance.proto";
import "automsgs/msgs/std_msgs/header.proto";
import "common/frontend_mode.proto";

// Loop-closure detection / acceptance event.
message LoopClosureEvent {
  automsgs.msgs.std_msgs.Header header = 1;
  FrontendMode source_mode = 2;  // visual vs lidar loop
  int32 query_keyframe_id = 3;
  int32 match_keyframe_id = 4;
  automsgs.msgs.geometry_msgs.PoseWithCovariance relative_pose = 5;
  double score = 6;
  bool accepted = 7;
}
