syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/std_msgs/header.proto";
import "common/backend_type.proto";
import "common/frontend_mode.proto";
import "common/fusion_style.proto";
import "common/slam_state.proto";
import "status/health_report.proto";

// Runtime status for monitoring / Autolink / RPC.
message SlamStatus {
  automsgs.msgs.std_msgs.Header header = 1;
  SlamState state = 2;
  FrontendMode configured_mode = 3;
  FrontendMode active_mode = 4;
  BackendType backend = 5;
  FusionStyle fusion = 6;
  HealthReport health = 7;
  double fps = 8;
  int32 keyframe_count = 9;
  int32 landmark_count = 10;
  int32 local_map_points = 11;
  string platform_name = 12;
}
