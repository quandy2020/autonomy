syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/nav_msgs/path.proto";
import "automsgs/msgs/std_msgs/header.proto";
import "common/frontend_mode.proto";

// Estimated trajectory export (ATE/RPE); wraps nav_msgs.Path.
message Trajectory {
  automsgs.msgs.std_msgs.Header header = 1;
  FrontendMode mode = 2;
  automsgs.msgs.nav_msgs.Path path = 3;
  string frame_id = 4;
}
