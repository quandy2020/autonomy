syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/std_msgs/header.proto";

// Voxel / ikd-hash map metadata (no full cloud payload).
message VoxelMapMeta {
  automsgs.msgs.std_msgs.Header header = 1;
  double voxel_size_m = 2;
  int32 occupied_voxels = 3;
  int32 point_count = 4;
  // Axis-aligned bounds in map frame.
  double min_x = 5;
  double min_y = 6;
  double min_z = 7;
  double max_x = 8;
  double max_y = 9;
  double max_z = 10;
}
