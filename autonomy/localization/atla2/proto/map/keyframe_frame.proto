syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/sensor_msgs/image.proto";
import "automsgs/msgs/sensor_msgs/point_cloud2.proto";
import "common/keyframe_meta.proto";
import "common/landmark.proto";

// One keyframe with optional image / cloud / landmarks.
message KeyframeFrame {
  KeyframeMeta meta = 1;
  automsgs.msgs.sensor_msgs.Image image = 2;
  automsgs.msgs.sensor_msgs.PointCloud2 cloud = 3;
  repeated Landmark landmarks = 4;
  bool has_image = 5;
  bool has_cloud = 6;
}
