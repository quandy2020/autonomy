syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/std_msgs/header.proto";

// Aerial elevation map (grid of heights, ENU / body-projected).
message ElevationMap {
  automsgs.msgs.std_msgs.Header header = 1;
  double resolution_m = 2;
  uint32 width = 3;
  uint32 height = 4;
  // Origin of cell (0,0) in map frame.
  double origin_x = 5;
  double origin_y = 6;
  // Row-major heights [m]; NaN = unknown. Length = width * height.
  repeated float heights = 7;
}
