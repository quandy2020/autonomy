syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/geometry_msgs/vector3.proto";
import "automsgs/msgs/sensor_msgs/nav_sat_fix.proto";

// GNSS sample: reuses NavSatFix + local ENU / velocity (C++ GpsSample).
message GpsSample {
  automsgs.msgs.sensor_msgs.NavSatFix fix = 1;
  automsgs.msgs.geometry_msgs.Vector3 position_enu = 2;
  automsgs.msgs.geometry_msgs.Vector3 velocity_enu = 3;
  double hdop = 4;
  bool valid = 5;
}
