syntax = "proto3";

package autonomy.localization.atla2.proto;

import "automsgs/msgs/sensor_msgs/compressed_image.proto";
import "automsgs/msgs/sensor_msgs/image.proto";
import "automsgs/msgs/sensor_msgs/imu.proto";
import "automsgs/msgs/std_msgs/header.proto";
import "common/extrinsic_set.proto";
import "sensor/barometer_sample.proto";
import "sensor/gps_sample.proto";
import "sensor/lidar_scan.proto";
import "sensor/optical_flow_sample.proto";

// Soft-synced multi-sensor packet for one SlamSystem::Step (mirrors SensorData).
message SyncedSensorPacket {
  // Sync reference time / primary frame.
  automsgs.msgs.std_msgs.Header header = 1;

  repeated automsgs.msgs.sensor_msgs.Imu imu = 2;
  automsgs.msgs.sensor_msgs.Image image = 3;
  automsgs.msgs.sensor_msgs.Image image_right = 4;
  automsgs.msgs.sensor_msgs.CompressedImage image_compressed = 5;
  LidarScan lidar = 6;
  GpsSample gps = 7;
  BarometerSample barometer = 8;
  OpticalFlowSample optical_flow = 9;
  ExtrinsicSet extrinsics = 10;

  // Explicit presence flags. Names must not be has_<field>: singular message
  // fields already generate has_<field>() in C++.
  bool image_valid = 11;
  bool image_right_valid = 12;
  bool lidar_valid = 13;
  bool imu_valid = 14;
  bool gps_valid = 15;
  bool baro_valid = 16;
  bool optical_flow_valid = 17;
}
