# High-accuracy LIO eval (Oxford Spires / live Autolink): finer voxels, more
# ESIKF iters. ALL camera / LiDAR / IMU calib from DiffCal dataset
# (/data/Oxford/calibration/{cam0,cam-lidar-imu}.yaml) — not TurtleBot autosim.
odometry:
  type: livo
  modalities: [lidar, imu]

backend:
  type: state_filter
  filter: esikf
  max_iterations: 6
  convergence_eps: 1.0e-7

coupling: sequential

camera:
  calib_file: calibration/camera_spires_equidistant.yaml

extrinsic:
  lidar_camera: calibration/extrinsic_lidar_camera_spires.yaml
  imu_lidar: calibration/extrinsic_imu_lidar_spires.yaml

vio:
  grid_size: 5
  grid_n_width: 17
  grid_n_height: 14
  patch_size: 8
  patch_pyramid_level: 3
  max_iterations: 5
  outlier_threshold: 1000.0
  image_point_cov: 100.0
  enable_normal: 1
  enable_inverse_composition: 0
  enable_raycast: 0
  enable_exposure_estimate: 1
  enable_colmap_output: 0
  log_dir: ""

frontend:
  lidar:
    feature_type: point_to_plane
    map_type: voxel_map
  visual:
    tracker: direct_patch
    min_features: 50
  dynamic_filter:
    lidar: none
    visual: none
    semantic_model: ""
    mask_threshold: 0.5
    config: robustness/dynamic_filter.yaml

robustness:
  degeneracy:
    enable: true
    config: robustness/degeneracy.yaml
  confidence_gating:
    enable: false
    config: robustness/confidence_gating.yaml
  intensity_aided:
    enable: true

map:
  lidar:
    type: voxel_map
    resolution: 0.1
    confidence_enabled: false
  visual:
    type: sparse_visual
    max_landmarks: 2000
  self_cleaning:
    enable: false
    config: robustness/map_cleaning.yaml

loop_closure:
  enable: true
  config: loop_closure_accurate.yaml

mapping:
  enable: true
  session_id: live
  output_dir: ""
  ikd_downsample_resolution: 0.1
  prior_resolution: 0.4

cross_session:
  enable: false
  chain_linking: true

relocalization:
  enable: false
  method: branch_and_bound
  trigger: tracking_lost
  min_lost_streak: 3
  cooldown_sec: 2.0
  seed_with_current_pose: true
  prior_map_path: ""
  prior_resolution: 0.5
  thread_pool:
    worker_count: 2
    max_queue_size: 64
    enable_low_priority: true
  branch_and_bound:
    max_depth: 5
    resolution: 0.5
    z_resolution: 0.5
    score_threshold: 0.7
    search_space: se3
    search_radius_z_steps: 2
    roll_pitch_refine_rad: 0.1
    roll_pitch_steps: 2
    se3_trans_refine_m: 0.2
    se3_yaw_refine_rad: 0.1
    se3_refine_passes: 1
  place_recognition:
    enable: false

threading:
  backend_threads: 1
  lidar_frontend_threads: 1
  visual_frontend_threads: 1
  async_loop_threads: 2
  use_global_thread_pool: false
