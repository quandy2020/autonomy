lidar: none              # spatiotemporal | semantic | none
visual: none
semantic_model: ""
mask_threshold: 0.5

spatiotemporal:
  range_diff_m: 0.4
  azimuth_res_deg: 0.4
  elevation_res_deg: 0.4
  min_range_m: 1.0
  max_range_m: 80.0
  # legacy knobs (reserved for voxel-normal extension)
  normal_consistency: 0.8
  time_window_sec: 0.5
  min_hits: 2

semantic:
  # backend: onnx | mask_file
  # onnx：需链接 ONNX Runtime（ARGUS_USE_ONNXRUNTIME / 自动发现）
  # mask_file：离线 / KITTI 子集用 HxW 灰度图（0=动态）
  backend: onnx
  mask_path: ""
  input_width: 640
  input_height: 640
  person_class_ids: [0]
