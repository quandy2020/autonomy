enable: false
method: scan_context
multi_modal_consensus: true
min_confidence: 0.65
async: true   # 必须为 true
enable_pose_inject: true   # PoseGraph Optimize → ESIKF ΔT 注入
current_session_id: live
wait_second_loop: false
max_loop_translation_m: 0.0   # 0 = disabled
max_inject_translation_m: 5.0 # roll back if Optimize Δ|t| too large

# Hard FPR (LTA-OM optimize-and-recover); Ceres/GN TryAcceptLoops.
fpr:
  enable: true
  max_loop_residual: 2.0
  max_cost_rms: 0.0

# ICP refine after Scan Context (reject bad relative poses).
geometric_verify:
  enable: true
  max_fitness_m: 0.6
  max_translation_m: 8.0
  max_yaw_rad: 0.9
  min_inlier_ratio: 0.25
  seed_xy_steps: 1
  seed_xy_step_m: 1.0
  seed_yaw_steps: 1
  seed_yaw_step_rad: 0.15

# Long-term association: corrected history → live map (default off).
lta:
  enable: false
  points_per_frame: 20000
  max_queued_clouds: 32
  downsample_resolution_m: 0.75
  keyframe_buffer: 64
  prior_neighbor_keyframes: 2   # ±N prior KFs after cross-session link
  reload_prior_on_cross_session: true

scan_context:
  num_rings: 20
  num_sectors: 60
  max_radius_m: 80.0
  max_candidates: 10

consensus:
  geometric_weight: 0.45
  visual_weight: 0.25
  topology_weight: 0.20
  pose_consistency_weight: 0.10
  max_relative_yaw_rad: 0.6
  max_relative_trans_m: 15.0

cross_session:
  enable: false
  min_confidence: 0.65
  loop_information_scale: 150.0
  freeze_prior_nodes: true
