# Gentle loops for accuracy: tight ICP, small inject only (no Td games).
enable: true
method: scan_context
multi_modal_consensus: true
min_confidence: 0.60
async: true
enable_pose_inject: true
current_session_id: live
wait_second_loop: false
max_loop_translation_m: 1.5
max_inject_translation_m: 0.8
inject_clamp_only: false
loop_information_scale: 120.0

temporal:
  enable: true
  min_confirmations: 1
  max_match_id_delta: 8
  max_query_span: 15

# Natural drift is small — do not require large odom gap.
revisit_signature:
  enable: true
  min_odom_gap_m: 0.25
  max_icp_trans_m: 1.2
  min_gap_minus_icp_m: 0.05
  max_fitness_m: 0.40

fpr:
  enable: true
  max_loop_residual: 1.0
  max_cost_rms: 0.5

geometric_verify:
  enable: true
  max_iterations: 18
  max_fitness_m: 0.40
  max_translation_m: 1.2
  max_yaw_rad: 0.55
  subsample_stride: 3
  min_correspondences: 50
  max_corr_dist_m: 1.6
  min_inlier_ratio: 0.35
  seed_xy_steps: 1
  seed_xy_step_m: 0.6
  seed_yaw_steps: 1
  seed_yaw_step_rad: 0.10

lta:
  enable: false
  keyframe_buffer: 300

scan_context:
  num_rings: 20
  num_sectors: 60
  max_radius_m: 80.0
  max_candidates: 8
  exclude_recent_count: 30
  min_score: 0.55
  enable_lateral_search: true
  lateral_max_shift: 2
  lateral_step_m: 0.8

consensus:
  geometric_weight: 0.55
  visual_weight: 0.05
  topology_weight: 0.30
  pose_consistency_weight: 0.10
  max_relative_yaw_rad: 0.55
  max_relative_trans_m: 1.5
  min_id_gap: 30
  min_path_separation_m: 30.0

cross_session:
  enable: false
