syntax = "proto3";

package autonomy.control.proto;

// Topology-Driven MPC (T-MPC), adapted from tud-amr/mpc_planner (MPCC + parallel topologies).
message TdmpcControllerOptions
{
    string kinematic_model = 1;
    double track_width = 2;
    string quadruped_gait = 3;
    double max_lateral_velocity = 4;
    double min_turn_radius = 5;
    double r_vy = 6;

    double transform_tolerance = 7;
    double max_robot_pose_search_dist = 8;

    int32 horizon = 9;
    double dt = 10;

    // MPCC-style path tracking (contour / lag)
    double q_contour = 11;
    double q_lag = 12;
    double q_yaw = 13;
    double q_velocity = 14;
    double q_contour_terminal = 15;
    double q_lag_terminal = 16;
    double q_yaw_terminal = 17;

    double r_v = 18;
    double r_omega = 19;
    double r_du = 20;

    double v_min = 21;
    double v_max = 22;
    double omega_min = 23;
    double omega_max = 24;
    double reference_velocity = 25;

    // T-MPC++: number of parallel topology candidates (lateral offsets + baseline)
    int32 num_topology_candidates = 26;
    double topology_lateral_spacing = 27;
    bool enable_baseline_topology = 28;

    // Static obstacle penalty via costmap (replaces decomp constraints in mpc_planner)
    double q_obstacle = 29;
    double obstacle_cost_threshold = 30;
    bool enable_costmap_constraints = 31;

    int32 max_iterations = 32;
    double cost_tolerance = 33;
    double ipopt_max_cpu_time = 34;
    bool use_fallback_on_failure = 35;
    double slowdown_radius = 36;
    double yaw_rate_kp = 37;
    bool allow_backward = 38;
}
