syntax = "proto3";

package autonomy.control.proto;

// GracefulController configuration parameters
message GracefulControllerOptions
{
    // The TF transform tolerance.
    double transform_tolerance = 1;

    // The lookahead distance to use to find the motion_target point.
    // This distance should be a value around 1.0m but not much farther away.
    // Greater values will cause the robot to generate smoother paths but not necessarily follow the path as closely.
    double max_lookahead = 2;

    // Minimum lookahead distance to avoid instability.
    double min_lookahead = 3;

    // Maximum integrated distance along the path to bound the search for the closest pose to the robot.
    // This is set by default to the maximum costmap extent, so it shouldn't be set manually
    // unless there are loops within the local costmap.
    double max_robot_pose_search_dist = 4;

    // Ratio of the rate of change in phi to the rate of change in r.
    // Controls the convergence of the slow subsystem.
    // If this value is equal to zero, the controller will behave as a pure waypoint follower.
    // A high value offers extreme scenario of pose-following where theta is reduced much faster than r.
    // Note: This variable is called k1 in earlier versions of the paper.
    double k_phi = 5;

    // Constant factor applied to the heading error feedback.
    // Controls the convergence of the fast subsystem.
    // The bigger the value, the robot converge faster to the reference heading.
    // Note: This variable is called k2 in earlier versions of the paper.
    double k_delta = 6;

    // Constant factor applied to the path curvature.
    // This value must be positive.
    // Determines how fast the velocity drops when the curvature increases.
    double beta = 7;

    // Constant factor applied to the path curvature.
    // This value must be greater or equal to 1.
    // Determines the sharpness of the curve: higher lambda implies sharper curves.
    double lambda = 8;

    // Minimum linear velocity. Units: meters/sec.
    double v_linear_min = 9;

    // Maximum linear velocity. Units: meters/sec.
    double v_linear_max = 10;

    // Maximum angular velocity produced by the control law. Units: radians/sec.
    double v_angular_max = 11;

    // Minimum angular velocity for in-place rotation. Units: radians/sec.
    double v_angular_min_in_place = 12;

    // Radius around the goal pose in which the robot will start to slow down. Units: meters.
    double slowdown_radius = 13;

    // Enable a rotation in place to the goal before starting the path.
    // The control law may generate large sweeping arcs to the goal pose,
    // depending on the initial robot orientation and k_phi, k_delta.
    bool initial_rotation = 14;

    // The difference in the path orientation and the starting robot orientation
    // to trigger a rotate in place, if initial_rotation is enabled. Units: radians.
    double initial_rotation_tolerance = 15;

    // Similar to initial_rotation, the control law can generate large arcs when the goal orientation
    // is not aligned with the path. If this is enabled, the final pose will be ignored and the robot
    // will follow the orientation of the path and will make a final rotation in place to the goal orientation.
    bool prefer_final_rotation = 16;

    // The scaling factor applied to the rotation in place velocity.
    double rotation_scaling_factor = 17;

    // Whether to allow the robot to move backward.
    bool allow_backward = 18;

    // Whether to use collision detection.
    bool use_collision_detection = 19;

    // Resolution for collision checking during in-place rotation. Units: radians.
    double in_place_collision_resolution = 20;
}
