syntax = "proto3";

package autonomy.control.proto;

message GoalCheckerOptions {
    bool stateful = 1;
    string plugin = 2;
    double xy_goal_tolerance = 3;
    double yaw_goal_tolerance = 4;
    double path_length_tolerance = 5;
}

message ProgressCheckerOptions {
    string plugin = 1;
    double required_movement_radius = 2;
    double movement_time_allowance = 3;
}

message CheckerOptions {
    GoalCheckerOptions goal_checker = 1;
    ProgressCheckerOptions progress_checker = 2;
}