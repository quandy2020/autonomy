syntax = "proto3";

package autonomy.control.proto;

import "autonomy/control/proto/checker_options.proto";

// MPPI Controller configuration parameters
message MPPIControllerOptions {
    // Core Optimization Parameters
    int32 time_steps = 1;  // Default: 56
    double model_dt = 2;  // Default: 0.05
    int32 batch_size = 3;  // Default: 2000
    
    // Noise Parameters
    double vx_std = 4;  // Default: 0.2
    double vy_std = 5;  // Default: 0.2
    double wz_std = 6;  // Default: 0.4

    // Velocity Constraints
    double vx_max = 7;  // Default: 0.5
    double vx_min = 8;  // Default: -0.35
    double vy_max = 9;  // Default: 0.5
    double wz_max = 10;  // Default: 1.9

    // Optimization Algorithm Parameters
    int32 iteration_count = 11;  // Default: 1
    double temperature = 12;  // Default: 0.3
    double gamma = 13;  // Default: 0.015

    // Motion Model
    string motion_model = 14;  // Default: "DiffDrive"

    // Visualization
    bool visualize = 15;  // Default: false

    TrajectoryVisualizerOptions trajectory_visualizer = 16;

    // Motion Model Specific Constraints
    AckermannConstraintsOptions ackermann_constraints = 17;

    // Critic Configuration
    repeated string critics = 18;
    ConstraintCriticOptions constraint_critic = 19;
    GoalCriticOptions goal_critic = 20;
    GoalAngleCriticOptions goal_angle_critic = 21;
    PreferForwardCriticOptions prefer_forward_critic = 22;
    CostCriticOptions cost_critic = 23;
    PathAlignCriticOptions path_align_critic = 24;
    PathFollowCriticOptions path_follow_critic = 25;
    PathAngleCriticOptions path_angle_critic = 26;
    ObstaclesCriticOptions obstacles_critic = 27;  // Optional, alternative to CostCritic
    VelocityDeadbandCriticOptions velocity_deadband_critic = 28;  // Optional
    TwirlingCriticOptions twirling_critic = 29;  // Optional

    // Checker Configuration
    GoalCheckerOptions goal_checker = 30;
    ProgressCheckerOptions progress_checker = 31;

    // Acceleration constraints (nav2_mppi_controller defaults)
    double ax_max = 32;  // Default: 3.0
    double ax_min = 33;  // Default: -3.0
    double ay_max = 34;  // Default: 3.0
    double ay_min = 35;  // Default: -3.0
    double az_max = 36;  // Default: 3.5

    // Optimizer behavior (nav2_mppi_controller)
    int32 retry_attempt_limit = 37;  // Default: 1
    bool regenerate_noises = 38;  // Default: false
    bool open_loop = 39;  // Default: false
    bool clamp_raw_controls = 40;  // Default: false

    PathHandlerOptions path_handler = 41;

    // Actuator delay (seconds); rollout shifts by round(delay / model_dt)
    double model_delay_vx = 42;  // Default: 0.0
    double model_delay_vy = 43;  // Default: 0.0
    double model_delay_wz = 44;  // Default: 0.0

    // Savitzky-Golay filter order: 1 (linear MA) or 2 (quadratic)
    int32 sgf_order = 45;  // Default: 2
}

// Path handler configuration (nav2_mppi_controller PathHandler)
message PathHandlerOptions {
    // 0 = auto (half costmap diagonal)
    double max_robot_pose_search_dist = 1;
    double prune_distance = 2;  // Default: 1.5
    double transform_tolerance = 3;  // Default: 0.1
    bool enforce_path_inversion = 4;  // Default: false
    double inversion_xy_tolerance = 5;  // Default: 0.2
    double inversion_yaw_tolerance = 6;  // Default: 0.4
}

// Trajectory visualizer configuration
message TrajectoryVisualizerOptions {
    int32 trajectory_step = 1;  // Default: 5
    int32 time_step = 2;  // Default: 3
}

// Ackermann motion model constraints
message AckermannConstraintsOptions {
    double min_turning_r = 1;  // Default: 0.2
}

// Base critic options (common fields for all critics)
message BaseCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: varies by critic
}

// Constraint critic configuration
message ConstraintCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 4.0
}

// Goal critic configuration
message GoalCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 5.0
    double threshold_to_consider = 4;  // Default: 1.4
}

// Goal angle critic configuration
message GoalAngleCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 3.0
    double threshold_to_consider = 4;  // Default: 0.5
}

// Prefer forward critic configuration
message PreferForwardCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 5.0
    double threshold_to_consider = 4;  // Default: 0.5
}

// Cost critic configuration
message CostCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 3.81
    double critical_cost = 4;  // Default: 300.0
    bool consider_footprint = 5;  // Default: true
    double collision_cost = 6;  // Default: 1000000.0
    double near_goal_distance = 7;  // Default: 1.0
    int32 trajectory_point_step = 8;  // Default: 2
}

// Path align critic configuration
message PathAlignCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 14.0
    double max_path_occupancy_ratio = 4;  // Default: 0.05
    int32 trajectory_point_step = 5;  // Default: 4
    double threshold_to_consider = 6;  // Default: 0.5
    int32 offset_from_furthest = 7;  // Default: 20
    bool use_path_orientations = 8;  // Default: false
}

// Path follow critic configuration
message PathFollowCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 5.0
    int32 offset_from_furthest = 4;  // Default: 5
    double threshold_to_consider = 5;  // Default: 1.4
}

// Path angle critic configuration
message PathAngleCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 2.0
    int32 offset_from_furthest = 4;  // Default: 4
    double threshold_to_consider = 5;  // Default: 0.5
    double max_angle_to_furthest = 6;  // Default: 1.0
    bool forward_preference = 7;  // Default: true
}

// Obstacles critic configuration (optional, alternative to CostCritic)
message ObstaclesCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double repulsion_weight = 3;  // Default: 1.5
    double critical_weight = 4;  // Default: 20.0
    bool consider_footprint = 5;  // Default: false
    double collision_cost = 6;  // Default: 10000.0
    double collision_margin_distance = 7;  // Default: 0.1
    double near_goal_distance = 8;  // Default: 0.5
}

// Velocity deadband critic configuration (optional)
message VelocityDeadbandCriticOptions {
    bool enabled = 1;  // Default: true
    int32 cost_power = 2;  // Default: 1
    double cost_weight = 3;  // Default: 35.0
    repeated double deadband_velocities = 4;  // Default: [0.05, 0.05, 0.05]
}

// Twirling critic configuration (optional)
message TwirlingCriticOptions {
    bool enabled = 1;  // Default: true
    int32 twirling_cost_power = 2;  // Default: 1
    double twirling_cost_weight = 3;  // Default: 10.0
}
