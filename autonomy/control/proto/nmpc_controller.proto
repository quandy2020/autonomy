syntax = "proto3";

package autonomy.control.proto;

// Nonlinear MPC — planar kinematics (unicycle / diff-drive / quadruped).
// Solved with autonomy/common/optimization (Ipopt).
message NmpcControllerOptions
{
    // "unicycle" | "differential_drive" | "quadruped" / "legged"
    string kinematic_model = 22;
    // Wheel track width (m); used when kinematic_model is differential_drive.
    double track_width = 23;
    // Quadruped: "trotting" (default) or "holonomic" / "crab"
    string quadruped_gait = 24;
    // Max |vy| for quadruped holonomic gait (m/s).
    double max_lateral_velocity = 25;
    // Min |v|/|omega| when quadruped trotting turns (m); 0 = disabled.
    double min_turn_radius = 26;
    // Lateral velocity penalty weight (holonomic quadruped); defaults to r_omega.
    double r_vy = 27;
    double transform_tolerance = 1;
    double max_robot_pose_search_dist = 2;

    // Prediction horizon
    int32 horizon = 3;
    double dt = 4;

    // State weights (x, y, yaw)
    double q_x = 5;
    double q_y = 6;
    double q_yaw = 7;
    // Terminal weights (defaults to stage if zero)
    double q_x_terminal = 8;
    double q_y_terminal = 9;
    double q_yaw_terminal = 10;

    // Control weights
    double r_v = 11;
    double r_omega = 12;

    // Box constraints
    double v_min = 13;
    double v_max = 14;
    double omega_min = 15;
    double omega_max = 16;

    // Reference speed along path when building horizon references
    double reference_velocity = 17;

    // Ipopt solver (autonomy/common/optimization)
    int32 max_iterations = 18;
    double step_size = 19;           // legacy, unused by Ipopt MPC
    double gradient_epsilon = 20;    // legacy, unused by Ipopt MPC
    double cost_tolerance = 21;

    // Scale reference speed near goal (m); 0 = disabled
    double slowdown_radius = 28;
    double ipopt_max_cpu_time = 29;
    bool use_fallback_on_failure = 30;
    // Holonomic quadruped: heading assist omega = ref_omega + kp * yaw_err
    double yaw_rate_kp = 31;
    bool allow_backward = 32;
    // Penalty on control increment ||u_k - u_{k-1}||^2
    double r_du = 33;
}
