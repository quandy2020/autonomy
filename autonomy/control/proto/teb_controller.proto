syntax = "proto3";

package autonomy.control.proto;

message TEBControllerOptions {
  // Robot limits (nav2_teb defaults)
  double max_vel_x = 1;
  double max_vel_x_backwards = 2;
  double max_vel_theta = 3;
  double acc_lim_x = 4;
  double acc_lim_theta = 5;
  double min_turning_radius = 6;
  string robot_model = 7;  // "diff_drive" | "carlike"

  // Trajectory / horizon
  double dt_ref = 8;
  double dt_hysteresis = 9;
  int32 min_samples = 10;
  int32 max_samples = 11;
  double max_global_plan_lookahead_dist = 12;
  double global_plan_prune_distance = 13;
  int32 control_look_ahead_poses = 14;
  bool global_plan_overwrite_orientation = 15;

  // Obstacles
  double min_obstacle_dist = 16;
  double inflation_dist = 17;
  bool include_costmap_obstacles = 18;
  double costmap_obstacles_behind_robot_dist = 19;
  int32 obstacle_poses_affected = 20;
  double costmap_obstacle_sample_resolution = 21;

  // Optimization weights
  int32 no_inner_iterations = 22;
  int32 no_outer_iterations = 23;
  double weight_max_vel_x = 24;
  double weight_max_vel_theta = 25;
  double weight_acc_lim_x = 26;
  double weight_acc_lim_theta = 27;
  double weight_kinematics_nh = 28;
  double weight_kinematics_forward_drive = 29;
  double weight_kinematics_turning_radius = 30;
  double weight_optimaltime = 31;
  double weight_obstacle = 32;
  double weight_viapoint = 33;
  double weight_shortest_path = 34;
  double penalty_epsilon = 35;

  // Path handling
  double transform_tolerance = 36;
  double max_robot_pose_search_dist = 37;
  bool free_goal_vel = 38;

  // Homotopy / recovery / obstacle conversion (ROS2 TebConfig defaults)
  bool enable_homotopy_class_planning = 39;
  bool enable_multithreading = 40;
  int32 max_number_classes = 41;
  bool oscillation_recovery = 42;
  double oscillation_filter_duration = 43;
  // "points_only" | "points_lines_polygons"
  string obstacle_conversion_mode = 44;
}
