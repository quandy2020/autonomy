syntax = "proto3";

package autonomy.control.proto;

// Velocity smoother configuration parameters
message VelocitySmootherOptions {
    // Smoothing metadata
    double smoothing_frequency = 1;  // Default: 20.0
    string feedback = 2;  // Default: "OPEN_LOOP", options: "OPEN_LOOP", "CLOSED_LOOP"
    bool scale_velocities = 3;  // Default: false    // Kinematics - all vectors represent (x, y, theta)
    repeated double max_velocity = 4;  // Default: {0.50, 0.0, 2.5}
    repeated double min_velocity = 5;  // Default: {-0.50, 0.0, -2.5}
    repeated double max_accel = 6;  // Default: {2.5, 0.0, 3.2}
    repeated double max_decel = 7;  // Default: {-2.5, 0.0, -3.2}

    // Feature parameters
    string odom_topic = 8;  // Default: "odom"
    double odom_duration = 9;  // Default: 0.1
    repeated double deadband_velocity = 10;  // Default: {0.0, 0.0, 0.0}, represents (x, y, theta)
    double velocity_timeout = 11;  // Default: 1.0

    // Real-time priority
    bool use_realtime_priority = 12;  // Default: false
}
