syntax = "proto3";

package autonomy.system.proto;

message ChannelWatchOptions {
  string channel = 1;
  double timeout_sec = 2;
  double min_rate_hz = 3;
}

message LatencyWatchOptions {
  string channel = 1;
  double max_age_sec = 2;
}

message MrmHandlerOptions {
  string cmd_vel_channel = 1;
  bool emergency_stop_on_error = 2;
}

message CriticalProcessOptions {
  string name = 1;
  string match = 2;          // /proc cmdline substring; empty → use name
  string restart_hint = 3;   // "respawn" | "alert_only"
}

message MonitorOptions {
  bool enable_cpu_monitor = 1;
  bool enable_gpu_monitor = 2;
  bool enable_mem_monitor = 3;
  bool enable_hdd_monitor = 4;
  bool enable_net_monitor = 5;
  bool enable_ntp_monitor = 6;
  bool enable_process_monitor = 7;
  bool enable_voltage_monitor = 8;

  bool enable_channel_monitor = 9;
  bool enable_latency_monitor = 10;
  bool enable_hazard_monitor = 11;
  bool enable_mrm_handler = 12;
  repeated ChannelWatchOptions channel_watches = 13;
  repeated LatencyWatchOptions latency_watches = 14;
  MrmHandlerOptions mrm = 15;

  bool enable_prometheus = 16;
  string prometheus_bind_address = 17;
  string prometheus_metrics_prefix = 18;

  bool enable_cpu_profile = 19;
  string cpu_profile_filename = 20;
  bool enable_heap_profile = 21;
  string heap_profile_filename = 22;

  double collect_interval_sec = 23;
  repeated CriticalProcessOptions critical_processes = 24;
  string health_snapshot_path = 25;
  bool publish_health_snapshot = 26;
}
