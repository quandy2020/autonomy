syntax = "proto3";

package autonomy.system.proto;

message OtaOptions {
  string slots_root = 1;
  string current_link = 2;
  string staging_dir = 3;
  string state_path = 4;
  int32 health_gate_sec = 5;
  bool delta_fallback_to_full = 6;
  bool allow_start_when_hazard = 7;
  bool require_signature = 8;
}
