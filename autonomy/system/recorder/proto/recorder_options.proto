syntax = "proto3";

package autonomy.system.recorder.proto;

import "autonomy/system/recorder/proto/evidence.proto";

message ChannelSpec {
  string name = 1;
  string message_type = 2;
  double timeout_sec = 3;
  int32 depth = 4;  // KEEP_LAST depth; 0 → heuristic (still BEST_EFFORT)
  int32 queue = 5;  // reader pending_queue_size; 0 → heuristic
}

message RecorderOptions {
  string output_dir = 1;
  double buffer_sec = 2;
  repeated ChannelSpec channels = 3;
  string bt_log_channel = 4;
  string cmd_vel_channel = 5;
  double path_deviate_m = 6;
  double cost_spike_sigma = 7;
  string policy_version = 8;
  string env_version = 9;
  string seed = 10;
  string robot_id = 11;
  TimeSource time_source = 12;
  double action_match_threshold = 13;
  double attribution_coverage_floor = 14;
  double regression_delta_limit = 15;
  bool require_version_tuple = 16;
  string git_sha = 17;
  string odom_channel = 18;
  string plan_channel = 19;
  string cost_channel = 20;
  string teleop_goal_channel = 21;
  double p2_sample_rate = 22;
  double p3_sample_rate = 23;
  double max_cmd_vx = 24;
  double max_cmd_wz = 25;
  string safety_chain_path = 26;
  string upload_dest = 27;
  // Tester session: open one episode at Start, periodic MCAP flush, keep P2/P3.
  bool full_dump = 28;
  double flush_period_sec = 29;  // used when full_dump; 0 → 1.0
  double localization_quality_floor = 30;  // 0 → 0.3; below fires TASK_FAILURE
}
