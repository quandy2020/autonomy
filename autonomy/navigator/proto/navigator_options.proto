syntax = "proto3";

package autonomy.navigator.proto;

// Lua: navigator.navigate_to_pose / navigator.navigate_through_poses
message BehaviorTreeNavigatorOptions {
  optional bool enable = 1;
  string behavior_tree_file = 2;
}

message NavigatorOptions {
  string global_frame = 1;
  string robot_base_frame = 2;

  uint32 bt_loop_duration = 3;
  uint32 default_server_timeout = 4;
  double local_survival_timeout = 5;

  repeated string plugin_lib_names = 6;
  string plugin_lib_path = 7;

  string default_planner_id = 8;
  string default_controller_id = 9;
  string default_goal_checker_id = 10;
  string default_smoother_id = 11;
  double goal_reached_tolerance = 12;

  BehaviorTreeNavigatorOptions navigate_to_pose = 13;
  BehaviorTreeNavigatorOptions navigate_through_poses = 14;

  optional bool enable_autolink_action_servers = 15;
}
