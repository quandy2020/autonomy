[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vntpa"
version = "1.0.0"
description = "VNT-PA + DeFM training, ONNX deployment and autosim/autolink bridge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["robotics", "navigation", "vnt-pa", "defm", "onnx"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<2",
  "onnxruntime>=1.17",
  "protobuf>=4.25",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy-quaternion>=2022.4",
  "h5py>=3.10",
  "opencv-python>=4.8",
  "numba>=0.58",
  "wandb>=0.17",
  "omegaconf>=2.3",
  "tensorboard>=2.14",
  "pillow>=10.0",
  "matplotlib>=3.8",
]
dev = ["pytest>=8", "ruff>=0.6", "grpcio-tools>=1.60"]

[project.urls]
Documentation = "https://github.com/quandy2020/autonomy/tree/main/autonomy/navigation/python/docs"
Source = "https://github.com/quandy2020/autonomy/tree/main/autonomy/navigation/python"

[project.scripts]
vntpa = "vntpa.cli:main"
vntpa-train = "vntpa.cli.train:main"
vntpa-eval = "vntpa.cli.evaluate:main"
vntpa-export = "vntpa.cli.export:main"
vntpa-collect = "vntpa.cli.collect:main"
vntpa-validate = "vntpa.cli.validate:main"
vntpa-analyze = "vntpa.cli.analyze:main"
vntpa-autosim = "vntpa.simulator.client:main"
frontiernet = "frontiernet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vntpa*", "frontiernet*", "thirdparty*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
thirdparty.defm = ["configs/*.yaml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: multi-second training smoke"]
