# FrontierNet retraining over a frozen DeFM encoder.
#
# Data pipeline (all paths relative to autonomy/navigation/python):
#   1. python -m frontiernet.collect --out data/frontiernet/frames --count 300
#   2. python -m frontiernet.label   --frames data/frontiernet/frames \
#                                    --out data/frontiernet/labels
#   3. python -m frontiernet.train   --config configs/train/frontiernet_defm.yaml
#
# The teacher in step 2 is the official RGB-D checkpoint; it only produces
# offline labels and is never part of the deployed graph. Labels are generated
# on the DeFM pixel grid (frontiernet_preprocess_aligned), which is what makes
# the adapter learnable: the upstream letterbox crop and the DeFM stretch
# disagree by a fixed warp, and training against the letterbox labels stalls at
# region IoU ~0.43 instead of ~0.72.

frames: data/frontiernet/frames
labels: data/frontiernet/labels
out: data/frontiernet/run

official_weights: conf/models/rgbd_11cls.pth
defm_weights: conf/models/defm_vit_s14.pth

# optimisation
epochs: 40
batch_size: 4
input_size: 224
head_lr: 5.0e-4
adapter_lr: 1.5e-3
backbone_lr: 0.0
weight_decay: 1.0e-4
warmup_ratio: 0.05
grad_clip: 1.0
amp: true
freeze_backbone: true
flip: true

# loss
df_weight: 1.0
seg_weight: 1.0
frontier_boost: 6.0
class_weight_power: 0.5
df_normalizer: 10.0
region_threshold_m: 0.5

# bookkeeping
device: cuda
workers: 2
val_fraction: 0.15
seed: 0
log_every: 10
classes: 11
