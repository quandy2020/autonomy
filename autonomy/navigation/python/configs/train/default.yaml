# vntpa product defaults
planner_onnx: conf/models/vntpa.onnx
defm_onnx: conf/models/defm_vit_s14.onnx
providers: [CPUExecutionProvider]

planner:
  context_size: 64
  token_count: 256
  token_dim: 384
  chunk: 8
  action_count: 4
  forward_step: 0.25
  turn_step_rad: 0.5235987756
  action_dt_s: 0.5
  execute_horizon: 4
  decision_rate_hz: 5.0

autosim:
  node_name: vntpa
  depth_topic: /camera/depth/image_raw
  odom_topic: /odom
  goal_topic: /navigation/goal
  cmd_topic: /cmd_vel
  timer_hz: 10.0
