syntax = "proto3";

package navigation;

import "automsgs/msgs/geometry_msgs/point.proto";
import "automsgs/msgs/geometry_msgs/pose2d.proto";
import "automsgs/msgs/geometry_msgs/pose_stamped.proto";
import "automsgs/msgs/geometry_msgs/twist.proto";
import "automsgs/msgs/nav_msgs/path.proto";
import "automsgs/msgs/sensor_msgs/image.proto";
import "navigation/proto/observation.proto";

/** @brief Closed region for coverage. The outer ring is counter-clockwise. */
message Region
{
    repeated automsgs.msgs.geometry_msgs.Point polygon = 1;
    repeated automsgs.msgs.geometry_msgs.Point holes = 2;
    string frame_id = 3;
}

/** @brief Goal accepted by the navigation session. */
message GoalSpec
{
    enum Type
    {
        TYPE_UNSPECIFIED = 0;
        TYPE_POSE = 1;
        TYPE_EXPLORATION = 2;
        TYPE_TRACKING = 3;
        TYPE_REGION = 4;
    }

    Type type = 1;
    optional automsgs.msgs.geometry_msgs.PoseStamped pose = 2;
    optional automsgs.msgs.sensor_msgs.Image goal_image = 3;
    optional navigation.observation.Language text = 4;
    optional double relative_bearing_rad = 5;
    optional Region region = 6;
    optional string floor_id = 7;
    string goal_id = 8;
    double position_tolerance = 9;
    double yaw_tolerance_rad = 10;
    uint64 sequence = 11;
}

/** @brief Discrete action emitted by VNT-PA-style policies. */
enum ActionKind
{
    ACTION_KIND_STOP = 0;
    ACTION_KIND_FORWARD = 1;
    ACTION_KIND_TURN_LEFT = 2;
    ACTION_KIND_TURN_RIGHT = 3;
}

/** @brief One discrete primitive with its physical step size. */
message ActionPrimitive
{
    ActionKind kind = 1;
    double distance = 2;  // metres for FORWARD
    double angle = 3;     // radians for turns
}

/** @brief Fixed-length action chunk produced by a policy. */
message ActionChunk
{
    repeated automsgs.msgs.geometry_msgs.Twist2D actions = 1;
    double dt_s = 2;
    uint64 sequence = 3;
    int64 produced_at_ns = 4;
    string frame = 5;
    repeated ActionPrimitive primitives = 6;
}

/** @brief Policy output. Exactly one output variant is set. */
message NavigationIntent
{
    oneof output
    {
        ActionChunk chunk = 1;
        automsgs.msgs.geometry_msgs.PoseStamped waypoint = 2;
        automsgs.msgs.nav_msgs.Path path = 3;
        automsgs.msgs.geometry_msgs.Twist2D velocity = 4;
    }
    uint64 sequence = 5;
    int64 stamp_ns = 6;
    string frame = 7;
    uint32 epoch = 8;
    float confidence = 9;
}

/** @brief Periodic navigation session status. */
message NavigationStatus
{
    uint64 sequence = 1;
    int64 stamp_ns = 2;
    string scenario = 3;
    string stage = 4;
    GoalSpec goal = 5;
    bool goal_reached = 6;
    bool degraded = 7;
    string reason = 8;
}

/** @brief One stored keyframe as exposed to diagnostics and persistence. */
message ContextEntry
{
    uint64 id = 1;
    automsgs.msgs.geometry_msgs.Pose2D pose = 2;
    repeated float embedding = 3 [packed = true];
    float novelty = 4;
    float importance = 5;
    int64 stamp_ns = 6;
    uint32 epoch = 7;
    uint32 observation_count = 8;
}

/** @brief Serialized memory snapshot; not used on the control hot path. */
message ContextSnapshot
{
    uint32 format_version = 1;
    uint32 epoch = 2;
    uint32 k = 3;
    repeated ContextEntry entries = 4;
    uint64 checksum = 5;
}

enum ConsistencyCode
{
    CONSISTENCY_CODE_OK = 0;
    CONSISTENCY_CODE_EPOCH_MISMATCH = 1;
    CONSISTENCY_CODE_FRAME_MISMATCH = 2;
    CONSISTENCY_CODE_STALE = 3;
    CONSISTENCY_CODE_INDEX_DEGRADED = 4;
}

message ConsistencyReport
{
    bool compatible = 1;
    ConsistencyCode code = 2;
    uint32 epoch = 3;
    string frame = 4;
    string reason = 5;
}

/** @brief Planar obstacle with a bounded uncertainty radius. */
message ObstaclePoint
{
    double x = 1;
    double y = 2;
    double vx_mps = 3;
    double vy_mps = 4;
    double radius = 5;
    float confidence = 6;
}

/** @brief Near-field obstacle set consumed by the reflex and safety layers. */
message ReflexObservation
{
    repeated ObstaclePoint obstacles = 1;
    int64 stamp_ns = 2;
    bool valid = 3;
    string frame = 4;
    double coverage_radius = 5;
}
