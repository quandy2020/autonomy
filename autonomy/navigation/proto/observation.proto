syntax = "proto3";

package navigation.observation;

import "automsgs/msgs/map_msgs/occupancy_grid.proto";
import "automsgs/msgs/nav_msgs/odometry.proto";
import "automsgs/msgs/sensor_msgs/camera_info.proto";
import "automsgs/msgs/sensor_msgs/image.proto";
import "automsgs/msgs/sensor_msgs/imu.proto";
import "automsgs/msgs/std_msgs/header.proto";

/** @brief Validity bits carried by Observation::validity. */
enum ObservationFlag
{
    OBSERVATION_FLAG_UNSPECIFIED = 0;
    OBSERVATION_FLAG_DEPTH_VALID = 1;
    OBSERVATION_FLAG_CAMERA_INFO_VALID = 2;
    OBSERVATION_FLAG_ODOM_VALID = 4;
    OBSERVATION_FLAG_IMU_VALID = 8;
    OBSERVATION_FLAG_TF_VALID = 16;
    OBSERVATION_FLAG_LANGUAGE_PRESENT = 32;
}

/** @brief Optional language instruction attached to an observation. */
message Language
{
    string text = 1;
    string locale = 2;
    repeated float embedding = 3 [packed = true];
}

/**
 * @brief One fused input snapshot consumed by Runner::Tick.
 *
 * @details The ObservationBuilder fills the message from the depth, camera,
 * odometry, IMU and TF channels; consumers must check @c validity instead of
 * inferring availability from field presence.
 */
message Observation
{
    automsgs.msgs.std_msgs.Header header = 1;
    automsgs.msgs.sensor_msgs.Image depth = 2;
    automsgs.msgs.sensor_msgs.CameraInfo camera_info = 3;
    automsgs.msgs.nav_msgs.Odometry odom = 4;
    automsgs.msgs.sensor_msgs.Imu imu = 5;
    Language language = 6;
    uint64 sequence = 7;
    uint32 validity = 8;
    string map_frame = 9;
    string camera_frame = 10;
    automsgs.msgs.map_msgs.OccupancyGrid map = 11;
}

/** @brief Frozen DeFM output for one observation. */
message DepthFeature
{
    repeated float tokens = 1 [packed = true];
    repeated float pooled = 2 [packed = true];
    uint32 token_count = 3;
    uint32 token_dim = 4;
    float uncertainty = 5;
    int64 stamp_ns = 6;
    uint64 sequence = 7;
}
