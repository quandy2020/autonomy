# Paper defaults (Li et al., arXiv:2609.21212). This file is documentation for
# python -m vntpa.cli.train; tools/vntpa/train.py is a synthetic stub only.
data:
  token_count: 256
  token_dim: 384
  context_size: 64
  pose_dim: 3
  chunk_length: 8
train:
  steps: 30000
  batch_scenes: 12
  accum: 4
  learning_rate: 3.0e-4
  weight_decay: 0.05
  warmup: 1000
  checkpoint_dir: logs/pan/checkpoints
  seed: 0
eval:
  exec_horizon: 4
  coverage_gate_eta: 10
