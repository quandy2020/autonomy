syntax = "proto3";

package autonomy.bridge.proto;

// Optional bools: unset → enabled (true); set false to advertise as unsupported.
message CapabilitiesOptions {
  optional bool supports_navigation = 1;
  optional bool supports_follow = 2;
  optional bool supports_teleop = 3;
  optional bool supports_exploration = 4;
  optional bool supports_docking = 5;          // Autonomy Charge/Dock
  optional bool supports_charge = 6;           // Rpc ChargeService
  optional bool supports_map_management = 7;   // Autonomy SendMapCommand
  optional bool supports_mapping = 8;          // Rpc MapService
  optional bool supports_localization = 9;
  optional bool supports_sensor_record = 10;
  optional bool supports_system_monitor = 11;
}
