syntax = "proto3";

package autonomy.bridge.proto;

import "autonomy/bridge/proto/capabilities_options.proto";
import "autonomy/bridge/proto/grpc_options.proto";
import "autonomy/bridge/proto/robot_identity_options.proto";

// Top-level process config for autonomy.bridge (not an external RPC surface).
message BridgeOptions {
  GrpcOptions grpc = 3;
  RobotIdentityOptions identity = 4;
  CapabilitiesOptions capabilities = 5;
}
