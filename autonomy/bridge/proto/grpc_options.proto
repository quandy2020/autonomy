syntax = "proto3";

package autonomy.bridge.proto;

// Authentication mode for Bridge gRPC (see docs/02_policy.md).
enum AuthMode {
  AUTH_MODE_NONE = 0;
  AUTH_MODE_TLS = 1;
  AUTH_MODE_BEARER_TOKEN = 2;
}

// gRPC transport / thread-pool / platform settings for autonomy.bridge.
// Field semantics: docs/06_configuration.md
message GrpcOptions {
  string host = 1;
  uint32 port = 2;
  uint32 num_grpc_threads = 3;
  uint32 num_event_threads = 4;
  string uplink_server_address = 5;
  int32 upload_batch_size = 6;
  bool enable_ssl_encryption = 7;
  bool enable_google_auth = 9;
  // Worker threads for blocking Action accept/cancel (autolink::base::ThreadPool).
  // 0 = max(2, num_event_threads / 2).
  uint32 num_worker_threads = 10;

  // --- Platform: health / reflection ---
  bool enable_health_check = 11;
  bool enable_server_reflection = 12;

  // --- Platform: metadata interceptor ---
  bool enable_metadata_interceptor = 13;
  bool require_robot_id_metadata = 14;

  // --- Platform: rate limit ---
  bool enable_rate_limit = 15;
  double rate_limit_qps = 16;
  uint32 rate_limit_burst = 17;

  // --- Transport ---
  int32 max_receive_message_bytes = 18;
  int32 max_send_message_bytes = 19;
  int32 keepalive_time_ms = 20;
  int32 keepalive_timeout_ms = 21;
  bool permit_keepalive_without_calls = 22;

  // --- TLS ---
  string tls_cert_path = 23;
  string tls_key_path = 24;
  string tls_ca_path = 25;
  bool tls_require_client_cert = 26;

  // --- Auth ---
  AuthMode auth_mode = 27;
  string bearer_token = 28;
  string bearer_token_file = 29;

  // --- OpenTelemetry ---
  bool enable_opentelemetry = 30;
  string otel_service_name = 31;
  string otel_exporter_endpoint = 32;
}
