syntax = "proto3";

package autonomy.bridge.proto;

// Fleet / cloud inventory fields for GetRobotFullInfo / GetInfo.
message RobotIdentityOptions {
  string robot_id = 1;          // empty → hostname
  string model = 2;             // empty → "autonomy"
  string serial_number = 3;
  string firmware_version = 4;
  string software_version = 5;  // empty → autonomy_version default
  string fleet_id = 6;
  string site_id = 7;
}
