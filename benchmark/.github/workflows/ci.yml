name: benchmark-ci

on:
  push:
    paths:
      - "src/autonomy/benchmark/**"
  pull_request:
    paths:
      - "src/autonomy/benchmark/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/autonomy/benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
