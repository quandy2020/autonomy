# Autodriver hardware config.
# export AUTODRIVER_PATH=<directory containing config/>
#
# Camera: one physical device with streams / point_clouds / imu (loader expands).
# Flat per-stream entries still work. Orbbec example: config/examples/orbbec_gemini_330.yaml
#
# Vendor params via params_file; inline params override the file.
#
# Optional motion-compensator pose feed (nav_msgs/Odometry):
# compensator:
#   pose_channel: /localization/odom

sensors:
  lidar_2d:
    - name: front
      enable: false
      channel: /lidar/front/scan
      backend: rplidar
      port: /dev/ttyUSB0
      params_file: lidar/slamtec/a1.yaml

  lidar_3d:
    - name: vlp16
      enable: false
      channel: /lidar/vlp16/points
      backend: velodyne
      fps: 10
      params:
        data_port: 2368
        packets_per_scan: 75
        model: VLP-16
        frame_id: velodyne
        source_type: online

  camera:
    - name: realsense_d455
      enable: true
      backend: realsense
      params_file: camera/realsense/d455.yaml
      width: 848
      height: 480
      fps: 30
      streams:
        - stream: color
          channel: /camera/color/image_raw
          frame_id: camera_color_optical_frame
        - stream: depth
          channel: /camera/depth/image_rect_raw
          frame_id: camera_depth_optical_frame
        - stream: ir1
          channel: /camera/infra1/image_rect_raw
          frame_id: camera_infra1_optical_frame
        - stream: ir2
          channel: /camera/infra2/image_rect_raw
          frame_id: camera_infra2_optical_frame
        - stream: aligned_depth_to_color
          channel: /camera/aligned_depth_to_color/image_raw
          frame_id: camera_color_optical_frame
      point_clouds:
        - name: points
          channel: /camera/depth/color/points
          frame_id: camera_depth_optical_frame
      imu:
        channel: /camera/imu
        frame_id: camera_imu_optical_frame

  gps:
    - name: gps_main
      enable: false
      channel: /gps/fix
      port: /dev/ttyUSB2
      baudrate: 9600

  range:
    - name: range_main
      enable: false
      channel: /range/front
      port: /dev/ttyUSB5
      baudrate: 9600
      fps: 10
