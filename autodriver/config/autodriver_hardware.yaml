# Autodriver hardware config — Intel RealSense D455
# export AUTODRIVER_PATH=<directory containing config/>
#
# Channels align with ros2/realsense-ros (realsense2_camera) defaults,
# using automsgs on Autolink instead of ROS 2 topics.
#
# RealSense device options (shared by all streams on the same camera):
#   emitter_enabled: false   # disable IR projector speckles on infra streams
#   enable_ir_emitter: false # alias for emitter_enabled (realsense-ros style)

sensors:
  lidar_2d:
    - name: front
      enable: false
      channel: /lidar/front/scan
      port: /dev/ttyUSB4
      baudrate: 115200
      fps: 10

  lidar_3d:
    - name: vlp16
      enable: false
      channel: /lidar/vlp16/points
      fps: 10
      params:
        ip: 192.168.1.201
        data_port: 2368
        model: VLP-16

  imu:
    - name: torso_imu
      enable: false
      channel:
        - /imu/torso
        - /imu/torso/raw
      port: /dev/ttyUSB0
      baudrate: 460800
      fps: 200

    - name: wrist_imu
      enable: false
      channel: /imu/wrist
      port: /dev/ttyUSB1
      baudrate: 921600
      fps: 400

    - name: realsense_d455_imu
      enable: true
      channel: /camera/imu
      backend: realsense
      params:
        model: D455
        frame_id: camera_imu_optical_frame

  gps:
    - name: gps_main
      enable: false
      channel: /gps/fix
      port: /dev/ttyUSB2
      baudrate: 9600

  camera:
    - name: realsense_d455_color
      enable: true
      channel: /camera/color/image_raw
      backend: realsense
      stream: color
      width: 848
      height: 480
      fps: 30
      params:
        model: D455
        emitter_enabled: false
        frame_id: camera_color_optical_frame

    - name: realsense_d455_depth
      enable: true
      channel: /camera/depth/image_rect_raw
      backend: realsense
      stream: depth
      width: 848
      height: 480
      fps: 30
      params:
        model: D455
        frame_id: camera_depth_optical_frame

    - name: realsense_d455_ir1
      enable: true
      channel: /camera/infra1/image_rect_raw
      backend: realsense
      stream: ir1
      width: 848
      height: 480
      fps: 30
      params:
        model: D455
        frame_id: camera_infra1_optical_frame

    - name: realsense_d455_ir2
      enable: true
      channel: /camera/infra2/image_rect_raw
      backend: realsense
      stream: ir2
      width: 848
      height: 480
      fps: 30
      params:
        model: D455
        frame_id: camera_infra2_optical_frame

    - name: realsense_d455_aligned_depth
      enable: true
      channel: /camera/aligned_depth_to_color/image_raw
      backend: realsense
      stream: aligned_depth_to_color
      width: 848
      height: 480
      fps: 30
      params:
        model: D455
        frame_id: camera_color_optical_frame

  point_cloud:
    - name: realsense_d455_points
      enable: true
      channel: /camera/depth/color/points
      backend: realsense
      width: 848
      height: 480
      fps: 30
      params:
        model: D455
        frame_id: camera_depth_optical_frame

  range:
    - name: range_main
      enable: false
      channel: /range/front
      port: /dev/ttyUSB5
      baudrate: 9600
      fps: 10
