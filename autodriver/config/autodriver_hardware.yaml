# Autodriver hardware config.
# export AUTODRIVER_PATH=<directory containing config/>
#
# Camera: one physical device with streams / point_clouds / imu (loader expands).
# Flat per-stream entries still work. Orbbec example: config/examples/orbbec_gemini_330.yaml
#
# Vendor params via params_file; inline params override the file.
#
# Optional motion-compensator pose feed (nav_msgs/Odometry):
# compensator:
#   pose_channel: /localization/odom
#
# Robot body (chassis) — decoupled from autonomy/vehicle; vendor SDK here:
# chassis:
#   enable: true
#   backend: stub   # or jetauto / hiwonder
#   # JetAuto: see config/chassis/jetauto.yaml
#
# Joystick teleop (Linux /dev/input/js*) → /joy + /cmd_vel (hold enable):
# joy:
#   enable: true
#   device: /dev/input/js0
#   enable_button: 4

chassis:
  enable: false
  name: base
  backend: stub
  locomotion: differential   # omni | ackermann | legged | wheel_legged | humanoid
  require_arm: false
  has_dock: false
  has_joint_bypass: false
  # tools: [brush]
  cmd_vel_channel: /cmd_vel
  mode_cmd_channel: /chassis/mode
  mode_state_channel: /chassis/mode_state
  capability_channel: /chassis/capability
  # tool_cmd_channel: /chassis/tool
  state_channel: /robot_state      # vehicle_msgs.RobotState
  event_channel: /robot_event      # vehicle_msgs.RobotEvent
  odom_channel: /odom              # derived from RobotState for nav
  watchdog_ms: 200
  odom_period_ms: 20
  max_linear_speed: 1.0
  max_angular_speed: 1.5
  odom_frame_id: odom
  base_frame_id: base_link

# Joystick teleop — DualSense USB or Bluetooth → /cmd_vel.
# Left stick Y forward, right stick X yaw. See config/joy/dualsense.yaml.
joy:
  enable: true
  profile: dualsense            # dualsense | ps5 | generic
  device: /dev/input/js0        # jstest /dev/input/js0
  joy_channel: /joy
  # cmd_vel_channel: /cmd_vel   # empty → chassis.cmd_vel_channel
  publish_hz: 50
  linear_axis: 1             # left stick Y
  angular_axis: 3            # right stick X (axis 2 is L2, rests at -1)
  invert_angular: true       # stick right → negative yaw (turn right)
  max_linear: 1.5
  max_angular: 1.5
  max_linear_acc: 0          # 0 = stick maps to speed immediately
  max_angular_acc: 0
  require_enable: false
  bluetooth_connect: true
  bluetooth_timeout_sec: 15

sensors:
  lidar_2d:
    - name: front
      enable: false
      channel: /lidar/front/scan
      backend: rplidar
      port: /dev/ttyUSB0
      params_file: lidar/slamtec/a1.yaml

  lidar_3d:
    - name: vlp16
      enable: false
      channel: /lidar/vlp16/points
      backend: velodyne
      fps: 10
      params_file: lidar/velodyne/vlp16.yaml

    - name: xt32
      enable: false
      channel: /lidar/xt32/points
      backend: hesai
      params_file: lidar/hesai/xt32.yaml

    - name: mid360
      enable: false
      channel: /lidar/mid360/points
      backend: livox
      params_file: lidar/livox/mid360.yaml

  camera:
    - name: realsense_d455
      enable: true
      backend: realsense
      params_file: camera/realsense/d455.yaml
      width: 848
      height: 480
      fps: 30
      streams:
        - stream: color
          channel: /camera/color/image_raw
          frame_id: camera_color_optical_frame
        - stream: depth
          channel: /camera/depth/image_rect_raw
          frame_id: camera_depth_optical_frame
        - stream: ir1
          channel: /camera/infra1/image_rect_raw
          frame_id: camera_infra1_optical_frame
        - stream: ir2
          channel: /camera/infra2/image_rect_raw
          frame_id: camera_infra2_optical_frame
        - stream: aligned_depth_to_color
          channel: /camera/aligned_depth_to_color/image_raw
          frame_id: camera_color_optical_frame
      point_clouds:
        - name: points
          channel: /camera/depth/color/points
          frame_id: camera_depth_optical_frame
      imu:
        channel: /camera/imu
        frame_id: camera_imu_optical_frame

  gps:
    - name: gps_main
      enable: false
      channel: /gps/fix
      port: /dev/ttyUSB2
      baudrate: 9600

  range:
    - name: range_main
      enable: false
      channel: /range/front
      port: /dev/ttyUSB5
      baudrate: 9600
      fps: 10
