# Intel RealSense D455 — device params only
# Merged via params_file from autodriver_hardware.yaml
#
# Stream / channel / width / height / fps stay in autodriver_hardware.yaml.
# This file is only what RealSenseDeviceHub reads as device-wide options.
#
# Indoor stereo flicker on white walls / lights is reduced by:
#   high_accuracy preset + higher laser power + temporal/spatial/hole fill
# applied to both /camera/depth/image_rect_raw and aligned depth.

model: D455
# serial: ""
# index: 0
emitter_enabled: true
enable_ir_emitter: true
enable_auto_exposure: true
visual_preset: high_accuracy
laser_power: 240

filters_enabled: true
threshold_filter: true
depth_min_m: 0.2
depth_max_m: 6.0
spatial_filter: true
spatial_magnitude: 2
spatial_smooth_alpha: 0.5
spatial_smooth_delta: 20
temporal_filter: true
temporal_smooth_alpha: 0.4
temporal_smooth_delta: 20
hole_filling_filter: true
hole_filling: 1
